function classificarAvisoPortal_(mensagem, tipo) {
    if (tipo) return String(tipo).toLowerCase();
    var texto = String(mensagem || '').toLowerCase();
    if (/erro|falha|negad|sem permiss|n[aã]o possui|inv[aá]lid/.test(texto)) return 'erro';
    if (/sucesso|conclu[ií]d|salv[oa]|gerad[oa]|atualizad[oa]/.test(texto)) return 'sucesso';
    if (/aviso|aten[cç][aã]o|aguarde|selecione|informe/.test(texto)) return 'aviso';
    return 'info';
}

function exibirAvisoPortal(mensagem, tipo, titulo) {
    var texto = String(mensagem === null || mensagem === undefined ? '' : mensagem)
        .replace(/^\s*Error\s*:\s*/i, '')
        .trim() || 'Não foi possível concluir a operação.';

    if (DEPATRI_AVISO_ABERTO) {
        DEPATRI_AVISOS_FILA.push({ mensagem: texto, tipo: tipo, titulo: titulo });
        return;
    }

    var overlay = garantirAvisoPortal_();
    if (!overlay) {
        setTimeout(function() { exibirAvisoPortal(texto, tipo, titulo); }, 50);
        return;
    }

    var classe = classificarAvisoPortal_(texto, tipo);
    var titulos = { erro: 'Não foi possível concluir', sucesso: 'Operação concluída', aviso: 'Atenção', info: 'Informação' };
    var icones = { erro: 'fa-triangle-exclamation', sucesso: 'fa-circle-check', aviso: 'fa-circle-exclamation', info: 'fa-circle-info' };

    overlay.className = 'tipo-' + classe + ' aberto';
    document.getElementById('depatriAvisoTitulo').textContent = titulo || titulos[classe] || titulos.info;
    document.getElementById('depatriAvisoMensagem').textContent = texto;
    document.getElementById('depatriAvisoIcone').className = 'fas ' + (icones[classe] || icones.info);
    DEPATRI_AVISO_ABERTO = true;

    setTimeout(function() {
        var botao = overlay.querySelector('.depatri-aviso-botao');
        if (botao) botao.focus();
    }, 0);
}

function fecharAvisoPortal_() {
    var overlay = document.getElementById('depatriAvisoOverlay');
    if (overlay) overlay.className = '';
    DEPATRI_AVISO_ABERTO = false;
    if (DEPATRI_AVISOS_FILA.length) {
        var proximo = DEPATRI_AVISOS_FILA.shift();
        setTimeout(function() { exibirAvisoPortal(proximo.mensagem, proximo.tipo, proximo.titulo); }, 80);
    }
}

window.alert = function(mensagem) {
    exibirAvisoPortal(mensagem);
};

function salvarLoginPersistentePortal_(usuario) {
    try {
        if (usuario && usuario.login) {
            localStorage.setItem(DEPATRI_USUARIO_PERSISTENTE_KEY, JSON.stringify(usuario));
        }
    } catch (e) {}
}

function limparLoginPersistentePortal_() {
    limparEstadoCasosCadastro_();
    try {
        localStorage.removeItem(DEPATRI_USUARIO_PERSISTENTE_KEY);
    } catch (e) {}
}

function abrirPortalComUsuario_(usuario) {
    usuarioAtual = usuario;

    document.getElementById('telaLogin').classList.remove('tela-ativa');
    document.getElementById('telaCadastro').classList.remove('tela-ativa');
    document.getElementById('telaRecuperarSenha').classList.remove('tela-ativa');
    document.getElementById('telaTrocaSenha').classList.remove('tela-ativa');
    document.getElementById('telaPrincipal').classList.add('tela-ativa');

    document.getElementById('userInfo').innerHTML =
        "<b>" + usuarioAtual.cargo + " " + usuarioAtual.nome + "</b> | " + usuarioAtual.delegacia;

    aplicarVisibilidadePortalPorPerfil();
limparEstadoCasosCadastro_();
navegar(obterModuloInicialPortal_());
}

function tentarRestaurarLoginPersistentePortal_() {
    var usuarioSalvo = null;

    try {
        var bruto = localStorage.getItem(DEPATRI_USUARIO_PERSISTENTE_KEY) || '';
        usuarioSalvo = bruto ? JSON.parse(bruto) : null;
    } catch (e) {
        usuarioSalvo = null;
    }

    if (usuarioSalvo && usuarioSalvo.login) {
        abrirPortalComUsuario_(usuarioSalvo);
    }
}

function fazerLogin() {
    var loginDigitado = document.getElementById('loginUsuario').value.trim();
    var senhaDigitada = document.getElementById('senhaUsuario').value.trim();

    if (!loginDigitado || !senhaDigitada) {
        document.getElementById('msgLogin').innerText = "Preencha usuário e senha.";
        return;
    }

    var btn = document.querySelector('button[onclick="fazerLogin()"]');
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Autenticando...';
    btn.disabled = true;

    google.script.run
        .withSuccessHandler(function (resposta) {
            btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Entrar no Sistema';
            btn.disabled = false;

            if (resposta.sucesso) {
                usuarioAtual = resposta.usuario;

                if (resposta.forcarTroca) {
                    limparLoginPersistentePortal_();
                    document.getElementById('telaLogin').classList.remove('tela-ativa');
                    document.getElementById('telaTrocaSenha').classList.add('tela-ativa');
                    return;
                }

                salvarLoginPersistentePortal_(usuarioAtual);
                abrirPortalComUsuario_(usuarioAtual);

            } else {
                document.getElementById('msgLogin').innerText = resposta.erro;
            }
        })
        .withFailureHandler(function () {
            btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Entrar no Sistema';
            btn.disabled = false;
            document.getElementById('msgLogin').innerText = 'Erro de conexão com o banco.';
        })
        .autenticarUsuario(loginDigitado, senhaDigitada);
}

function salvarNovaSenha() {
    var s1 = document.getElementById('novaSenha1').value;
    var s2 = document.getElementById('novaSenha2').value;

    if (s1.length < 6) {
        document.getElementById('msgTrocaSenha').innerText = "A senha deve ter no mínimo 6 caracteres.";
        return;
    }

    if (s1 !== s2) {
        document.getElementById('msgTrocaSenha').innerText = "As senhas não conferem.";
        return;
    }

    var btn = document.querySelector('button[onclick="salvarNovaSenha()"]');
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Salvando...';
    btn.disabled = true;

    google.script.run
        .withSuccessHandler(function (resposta) {
            if (resposta.sucesso) {
                salvarLoginPersistentePortal_(usuarioAtual);
                abrirPortalComUsuario_(usuarioAtual);
            } else {
                btn.innerHTML = '<i class="fas fa-lock"></i> Atualizar Senha e Entrar';
                btn.disabled = false;
                document.getElementById('msgTrocaSenha').innerText = resposta.erro || "Erro ao salvar.";
            }
        })
        .withFailureHandler(function () {
            btn.innerHTML = '<i class="fas fa-lock"></i> Atualizar Senha e Entrar';
            btn.disabled = false;
            document.getElementById('msgTrocaSenha').innerText = 'Erro ao salvar.';
        })
        .atualizarSenhaBD(usuarioAtual.login, s1);
}

function mostrarCadastro() {
    document.getElementById('telaLogin').classList.remove('tela-ativa');
    document.getElementById('telaRecuperarSenha').classList.remove('tela-ativa');
    document.getElementById('telaTrocaSenha').classList.remove('tela-ativa');
    document.getElementById('telaCadastro').classList.add('tela-ativa');

    var msg = document.getElementById('msgCadastro');
    if (msg) msg.innerHTML = '';
    carregarOpcoesCadastroPortal();
}
function carregarOpcoesCadastroPortal() {
    var selectLotacao = document.getElementById('cadDelegacia');
    var selectEquipe = document.getElementById('cadEquipe');
    var wrapEquipe = document.getElementById('cadEquipeWrap');
    if (selectLotacao) selectLotacao.innerHTML = '<option value="">Carregando...</option>';
    if (selectEquipe) selectEquipe.innerHTML = '<option value="">Selecione a equipe</option>';
    if (wrapEquipe) wrapEquipe.style.display = 'none';

    google.script.run
        .withSuccessHandler(function(ret) {
            window.__cadastroPortalOpcoes = ret || { lotacoes: [], equipesPorLotacao: {} };
            if (!selectLotacao) return;
            var html = '<option value="">Selecione a lotação/delegacia</option>';
            (window.__cadastroPortalOpcoes.lotacoes || []).forEach(function(item) {
                html += '<option value="' + item + '">' + item + '</option>';
            });
            selectLotacao.innerHTML = html;
            onChangeLotacaoCadastroPortal();
        })
        .withFailureHandler(function(erro) {
            if (selectLotacao) selectLotacao.innerHTML = '<option value="">Falha ao carregar</option>';
            var msg = document.getElementById('msgCadastro');
            if (msg) msg.innerHTML = '<span class="text-danger">' + (((erro && erro.message) || erro || 'Falha ao carregar lotações.')) + '</span>';
        })
        .obterOpcoesCadastroPortal();
}
function onChangeLotacaoCadastroPortal() {
    var selectLotacao = document.getElementById('cadDelegacia');
    var selectEquipe = document.getElementById('cadEquipe');
    var wrapEquipe = document.getElementById('cadEquipeWrap');
    if (!selectLotacao || !selectEquipe || !wrapEquipe) return;

    var lotacao = String(selectLotacao.value || '').trim().toUpperCase();
    var mapa = (window.__cadastroPortalOpcoes && window.__cadastroPortalOpcoes.equipesPorLotacao) || {};
    var chave = Object.keys(mapa).find(function(k) { return String(k || '').trim().toUpperCase() === lotacao; }) || '';
    var equipes = chave ? (mapa[chave] || []) : [];
    var exigeEquipe = lotacao === 'NUCLEO OPERACIONAL';

    if (!exigeEquipe) {
        wrapEquipe.style.display = 'none';
        selectEquipe.innerHTML = '<option value="">Selecione a equipe</option>';
        selectEquipe.value = '';
        return;
    }

    wrapEquipe.style.display = '';
    var html = '<option value="">Selecione a equipe</option>';
    equipes.forEach(function(item) {
        html += '<option value="' + item + '">' + item + '</option>';
    });
    selectEquipe.innerHTML = html;
}
function voltarLogin() {
    document.getElementById('telaCadastro').classList.remove('tela-ativa');
    document.getElementById('telaLogin').classList.add('tela-ativa');
    document.getElementById('msgCadastro').innerHTML = "";
}
function enviarCadastro() {
    var btn = document.getElementById('btnCadastrar');
    var lotacao = document.getElementById('cadDelegacia').value.trim();
    var equipe = (document.getElementById('cadEquipe') || {}).value ? document.getElementById('cadEquipe').value.trim() : '';
    var dados = {
        nome: document.getElementById('cadNome').value.trim(),
        email: document.getElementById('cadEmail').value.trim(),
        matricula: document.getElementById('cadMatricula').value.trim(),
        delegacia: lotacao,
        lotacao: lotacao,
        equipe: equipe
    };
    if (!dados.nome || !dados.email || !dados.matricula || !dados.lotacao) {
        return document.getElementById('msgCadastro').innerHTML = '<span class="text-danger">Preencha todos os campos!</span>';
    }
    if (String(dados.lotacao).toUpperCase() === 'NUCLEO OPERACIONAL' && !dados.equipe) {
        return document.getElementById('msgCadastro').innerHTML = '<span class="text-danger">Selecione a equipe do Núcleo Operacional.</span>';
    }
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Gerando Login e Senha...';
    btn.disabled = true;
    google.script.run
        .withSuccessHandler(function (resposta) {
            btn.innerHTML = 'Enviar Solicitação';
            btn.disabled = false;
            if (resposta.sucesso) {
                document.getElementById('msgCadastro').innerHTML =
                    '<div class="alert alert-success mt-2">' +
                    '<p class="mb-1">Cadastro recebido! O Admin precisa aprovar seu acesso.</p>' +
                    '<hr>' +
                    '<p class="mb-1 small">Guarde seus dados de acesso:</p>' +
                    '<b>Usuário:</b> ' + resposta.loginGerado + '<br>' +
                    '<b>Senha Temporária:</b> <span class="bg-dark text-warning px-2 py-1 rounded">' + resposta.senhaTemp + '</span>' +
                    '</div>';
                document.getElementById('cadNome').value = '';
                document.getElementById('cadEmail').value = '';
                document.getElementById('cadMatricula').value = '';
                document.getElementById('cadDelegacia').value = '';
                if (document.getElementById('cadEquipe')) document.getElementById('cadEquipe').value = '';
                onChangeLotacaoCadastroPortal();
            }
            else {
                document.getElementById('msgCadastro').innerHTML = '<span class="text-danger">' + (resposta.erro || '') + '</span>';
            }
        })
        .withFailureHandler(function (erro) {
            btn.innerHTML = 'Enviar Solicitação';
            btn.disabled = false;
            document.getElementById('msgCadastro').innerHTML = '<span class="text-danger">' + (((erro && erro.message) || erro || 'Erro ao gerar cadastro.')) + '</span>';
        })
        .registrarNovoUsuario(dados);
}

function validarVeiculosRecuperadosDemandas_() {
    var qtd = parseIntDemandasFrontend_((document.getElementById('cnt_veic_recup') || {}).value || '0');
    var erros = [];
    for (var i = 0; i < qtd; i++) {
        var tipo = normalizarTipoVeiculoRecuperadoDemandas_(((document.getElementById('demveh_tipo_' + i) || {}).value || '').trim());
        var placa = ((document.getElementById('demveh_placa_' + i) || {}).value || '').trim();
        var descricao = ((document.getElementById('demveh_desc_' + i) || {}).value || '').trim();
        if (!tipo) {
            erros.push('Preencha o TIPO_DO_VEÍCULO do VEÍCULO RECUPERADO ' + (i + 1) + '.');
            continue;
        }
        if (tipo === 'OUTROS' && !descricao) {
            erros.push('Preencha a descrição do campo OUTROS do VEÍCULO RECUPERADO ' + (i + 1) + '.');
        }
        if (!placa) {
            erros.push('Preencha a PLACA do VEÍCULO RECUPERADO ' + (i + 1) + '.');
        }
    }
    return erros;
}

    };

        var placa = ((document.getElementById('demveh_placa_' + i) || {}).value || '').trim().toUpperCase();

        detalhes.descricoesVeiculosRecuperados.push(descricao);

function classificarProcedimentoInstauradoFrontend_(valor) {
    var texto = String(valor || '').trim();

    if (!texto) return { classe: 'bg-warning text-dark', rotulo: 'NÃO INFORMADO' };

        return { classe: 'bg-danger', rotulo: 'NÃO INSTAURADO PELA DELEGACIA' };
    }

function dataBrParaIsoDemandasFrontend_(valor) {
    var txt = String(valor || '').trim();
    var m = txt.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
    return m ? (m[3] + '-' + m[2] + '-' + m[1]) : '';
}

function escaparHtmlDemandas_(texto) {
    return String(texto || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')

        .replace(/"/g, '&quot;')

}

function renderizarGrupoDinamicoDemandasFrontend(idGrupo, valoresForcados) {
    var cfg = obterConfigContadorDemandas_(idGrupo);
    if (!cfg || !cfg.detalheTipo) return;

    var container = document.getElementById('grupo_' + idGrupo);
    if (!container) return;

    var quantidade = parseIntDemandasFrontend_((document.getElementById(idGrupo) || {}).value || '0');

    if (quantidade <= 0) {
        container.innerHTML = '';
        return;
    }

    if (cfg.detalheTipo === 'veiculo_tipo' || cfg.detalheTipo === 'veiculo_fipe') {
        renderizarGrupoVeiculosRecuperadosDemandasFrontend(idGrupo, quantidade, valoresForcados || {});
        return;
    }

    var valoresAtuais = valoresForcados || (cfg.detalheTipo === 'pdf'
        ? obterValoresPdfGrupoDemandas_(idGrupo)
        : obterValoresTextoGrupoDemandas_(idGrupo));

    var html = '<div class="card card-depatri mt-3"><div class="card-header card-header-gold"><strong>' + escaparHtmlDemandas_(cfg.detalheTitulo || cfg.label) + '</strong></div><div class="card-body"><div class="row g-3">';

    for (var i = 0; i < quantidade; i++) {
        var valorAtual = Array.isArray(valoresAtuais) ? (valoresAtuais[i] || '') : '';
        if (cfg.detalheTipo === 'pdf') {
            var linkHtml = valorAtual
                ? '<div class="small mb-2"><a href="' + escaparHtmlDemandas_(valorAtual) + '" target="_blank" class="text-warning">PDF atual ' + (i + 1) + '</a></div>'
                : '<div class="small text-muted mb-2">Nenhum PDF enviado.</div>';
            html += ''
                + '<div class="col-md-4">'
                + '  <label class="form-label">' + escaparHtmlDemandas_(cfg.label) + ' ' + (i + 1) + '</label>'
                + linkHtml
                + '  <input type="hidden" class="dem-pdf-existing" data-grupo="' + cfg.id + '" data-indice="' + i + '" value="' + escaparHtmlDemandas_(valorAtual) + '">'
                + '  <input type="file" class="form-control dem-pdf-file" data-grupo="' + cfg.id + '" data-campo="' + cfg.detalheChave + '" data-indice="' + i + '" accept="application/pdf,.pdf">'
                + '</div>';
        } else {
            html += ''
                + '<div class="col-md-4">'
                + '  <label class="form-label">' + escaparHtmlDemandas_(cfg.label) + ' ' + (i + 1) + '</label>'
                + '  <input type="text" class="form-control dem-detalhe-texto" data-grupo="' + cfg.id + '" data-campo="' + cfg.detalheChave + '" data-indice="' + i + '" placeholder="' + escaparHtmlDemandas_(cfg.detalhePlaceholder || cfg.label) + '" value="' + escaparHtmlDemandas_(valorAtual) + '">'
                + '</div>';
        }
    }

    html += '</div></div></div>';
    container.innerHTML = html;
}

function renderizarResultadosBuscaDemandasFrontend(lista) {

    if (!box) return;

    if (!lista || !lista.length) {
        box.innerHTML = '<div class="text-muted">Nenhuma ocorrência encontrada.</div>';
        return;
    }

    var podeEditar = usuarioPodeEditarDemandasAtivasFrontend();

    var total = lista.length;
    var totalEvoluidas = 0;
    var totalNaoEvoluidas = 0;

function lerArquivoPdfComoBase64Demandas_(file) {
    return new Promise(function (resolve, reject) {
        var reader = new FileReader();
        reader.onload = function (evt) {
            try {
                var resultado = String((evt && evt.target && evt.target.result) || '');
                var partes = resultado.split(',');
                resolve({
                    nome: file.name,
                    mimeType: file.type || 'application/pdf',
                    base64: partes.length > 1 ? partes[1] : resultado
                });
            } catch (e) {
                reject(e);
            }
        };
        reader.onerror = function () { reject(new Error('Falha ao ler arquivo PDF.')); };
        reader.readAsDataURL(file);
    });
}

function coletarArquivosPdfDemandasParaUpload_() {
    var inputs = document.querySelectorAll('#containerDetalhesDemandas .dem-pdf-file');
    var promessas = [];

    Array.prototype.forEach.call(inputs, function (input) {
        var file = input.files && input.files[0];
        if (!file) return;

        promessas.push(
            lerArquivoPdfComoBase64Demandas_(file).then(function (conteudo) {
                conteudo.campo = input.getAttribute('data-campo') || '';
                conteudo.indice = parseIntDemandasFrontend_(input.getAttribute('data-indice') || '0');
                return conteudo;
            })
        );
    });

    return Promise.all(promessas);
}

function aplicarResultadosUploadDemandas_(detalhes, arquivosUpload) {
    (arquivosUpload || []).forEach(function (item) {
        var campo = item.campo || '';
        var indice = parseIntDemandasFrontend_(item.indice || 0);
        if (!campo || !detalhes[campo]) return;
        detalhes[campo][indice] = item.url || '';
    });

    Object.keys(detalhes).forEach(function (chave) {
        if (!Array.isArray(detalhes[chave])) return;
        detalhes[chave] = detalhes[chave].map(function (item) { return String(item || '').trim(); });
    });

    return detalhes;
}

        txt = txt.replace(/\./g, '').replace(',', '.');
    } else if (/^\d{1,3}(\.\d{3})+$/.test(txt)) {

    } else if (txt.indexOf(',') > -1) {

    txt = txt.replace(/[^\d.\-]/g, '');

}

    return '';
}

function atualizarDetalhesVeiculosRecuperados() {
    var wrap = document.getElementById('wrap_veiculos_recup_detalhes');
    if (!wrap) return;
    var inputQtd = document.getElementById('val_cnt_veiculos_recup');
    var nc = document.getElementById('nc_cnt_veiculos_recup');
    var qtd = numeroInteiroProdutividade_(inputQtd && inputQtd.value);
    var estados = coletarEstadoLinhasVeiculosRecuperados_();
    if ((nc && nc.checked) || qtd <= 0) { wrap.innerHTML = ''; return; }
    var html = '<div class="col-12"><div class="small text-warning mb-2">Preencha um bloco para cada veículo recuperado.</div></div>';
    for (var i = 0; i < qtd; i++) html += htmlBlocoVeiculoRecuperado_(i, estados[String(i)] || {});
    wrap.innerHTML = html;
    for (var j = 0; j < qtd; j++) reidratarLinhaVeiculoRecuperado_(j, estados[String(j)] || {});
}

function popularSelectSimplesProdutividade_(select, lista, placeholder, valueKey, textKey, selectedValue, includeManual) {
    if (!select) return;
    var html = '<option value="">' + (placeholder || 'Selecione...') + '</option>';
    if (includeManual) html += '<option value="__MANUAL__"' + (selectedValue === '__MANUAL__' ? ' selected' : '') + '>NÃO LISTADO / MODIFICADO</option>';
    (lista || []).forEach(function(item) { html += '<option value="' + escHtmlProdutividade_(item[valueKey]) + '"' + (String(selectedValue || '') === String(item[valueKey]) ? ' selected' : '') + '>' + escHtmlProdutividade_(item[textKey]) + '</option>'; });

}

function atualizarModoManualVeiculoRecuperado_(idx, manual) {
    var wrap = document.getElementById('veh_manual_wrap_' + idx);
    var modelo = document.getElementById('veh_modelo_' + idx);
    var ano = document.getElementById('veh_ano_' + idx);
    var valor = document.getElementById('veh_valor_' + idx);
    var fonte = document.getElementById('veh_fonte_' + idx);
    if (wrap) wrap.classList.toggle('d-none', !manual);
    if (modelo) { modelo.disabled = manual; if (manual) modelo.innerHTML = '<option value="">Não se aplica</option>'; }
    if (ano) { ano.disabled = manual; if (manual) ano.innerHTML = '<option value="">Não se aplica</option>'; }
    if (valor) { valor.value = manual ? '' : valor.value; if (valor.dataset) delete valor.dataset.valorNumero; }
    if (fonte) { fonte.readOnly = !manual; fonte.value = manual ? (fonte.value || '') : 'TABELA FIPE'; }
}

function reidratarLinhaVeiculoRecuperado_(idx, estado) {
    estado = estado || {};
    var tipo = estado.tipo || '';
    if (!tipo) return;
    onChangeTipoVeiculoRecuperado(idx, estado);
}

function onChangeTipoVeiculoRecuperado(idx, estadoOpt) {
    var estado = estadoOpt || {};
    var tipoSelect = document.getElementById('veh_tipo_' + idx);
    var marcaSelect = document.getElementById('veh_marca_' + idx);
    var modeloSelect = document.getElementById('veh_modelo_' + idx);
    var anoSelect = document.getElementById('veh_ano_' + idx);
    var valorInput = document.getElementById('veh_valor_' + idx);
    var fonteInput = document.getElementById('veh_fonte_' + idx);
    if (!tipoSelect || !marcaSelect) return;
    var apiType = tipoVeiculoApiProdutividade_(tipoSelect.value);
    marcaSelect.innerHTML = '<option value="">Carregando...</option>';
    if (modeloSelect) modeloSelect.innerHTML = '<option value="">Selecione a marca primeiro...</option>';
    if (anoSelect) anoSelect.innerHTML = '<option value="">Selecione o modelo primeiro...</option>';
    if (valorInput) { valorInput.value = ''; }
    if (valorInput && valorInput.dataset) delete valorInput.dataset.valorNumero;
    if (fonteInput) { fonteInput.value = apiType ? 'TABELA FIPE' : ''; fonteInput.readOnly = !!apiType; }
    atualizarModoManualVeiculoRecuperado_(idx, false);
    if (!apiType) { marcaSelect.innerHTML = '<option value="">Selecione o tipo primeiro...</option>'; return; }
    google.script.run.withSuccessHandler(function(lista) {
        popularSelectSimplesProdutividade_(marcaSelect, lista || [], 'Selecione...', 'code', 'name', estado.marcaCode || '', true);
        if (estado.marcaCode) onChangeMarcaVeiculoRecuperado(idx, estado);
    }).withFailureHandler(function(erro) {
        marcaSelect.innerHTML = '<option value="">Falha ao carregar marcas</option>';
        alert((erro && erro.message) || erro || 'Erro ao carregar marcas FIPE.');
    }).listarMarcasFipeProdutividade(apiType);
}

function normalizarNumeroMoedaProdutividade_(valor) {
    var txt = String(valor || '').trim();
    if (!txt) return '';
    txt = txt.replace(/R\$/gi, '').replace(/\s+/g, '').replace(/\./g, '').replace(',', '.');
    var n = Number(txt);
    return isNaN(n) ? '' : n.toFixed(2);
}

function validarVeiculosRecuperadosProdutividade_() {
    var nc = document.getElementById('nc_cnt_veiculos_recup');
    if (nc && nc.checked) return [];
    var qtd = numeroInteiroProdutividade_(document.getElementById('val_cnt_veiculos_recup') && document.getElementById('val_cnt_veiculos_recup').value);
    var erros = [];
    for (var i = 0; i < qtd; i++) {
        var tipo = (document.getElementById('veh_tipo_' + i) || {}).value || '';
        var marca = (document.getElementById('veh_marca_' + i) || {}).value || '';
        if (!tipo) { erros.push('Preencha o TIPO DO VEÍCULO do VEÍCULO ' + (i + 1) + '.'); continue; }
        if (!marca) { erros.push('Preencha a MARCA do VEÍCULO ' + (i + 1) + '.'); continue; }
        if (marca === '__MANUAL__') {
            var descricao = (document.getElementById('veh_desc_' + i) || {}).value || '';
            var valorManual = normalizarNumeroMoedaProdutividade_((document.getElementById('veh_valor_manual_' + i) || {}).value || '');
            var fonteManual = (document.getElementById('veh_fonte_' + i) || {}).value || '';
            if (!String(descricao).trim()) erros.push('Preencha a DESCRIÇÃO DO VEÍCULO ' + (i + 1) + '.');
            if (!valorManual) erros.push('Preencha o VALOR MANUAL do VEÍCULO ' + (i + 1) + '.');
            if (!String(fonteManual).trim()) erros.push('Preencha a FONTE_DE_DADOS do VEÍCULO ' + (i + 1) + '.');
        } else {
            var modelo = (document.getElementById('veh_modelo_' + i) || {}).value || '';
            var ano = (document.getElementById('veh_ano_' + i) || {}).value || '';
            var valor = (document.getElementById('veh_valor_' + i) || {}).dataset ? ((document.getElementById('veh_valor_' + i).dataset.valorNumero) || '') : '';
            if (!modelo) erros.push('Preencha o MODELO do VEÍCULO ' + (i + 1) + '.');
            if (!ano) erros.push('Preencha o ANO do VEÍCULO ' + (i + 1) + '.');
            if (!valor) erros.push('A consulta FIPE do VEÍCULO ' + (i + 1) + ' ainda não retornou valor.');
        }
    }
    return erros;
}

function extrairVeiculosRecuperadosProdutividade_(lote) {
    var nc = document.getElementById('nc_cnt_veiculos_recup');
    var qtd = numeroInteiroProdutividade_(document.getElementById('val_cnt_veiculos_recup') && document.getElementById('val_cnt_veiculos_recup').value);
    if (nc && nc.checked) {
        lote.push({ categoria: 'CONTADORES', tipo_produtividade: 'VEÍCULOS RECUPERADOS', quantidade: '', unidade: 'unid', crime: '', subtipo: '', modalidade: '', qtd_modalidade: '', nao_contabilizado: true });
        return;
    }
    if (qtd <= 0) return;
    var erros = validarVeiculosRecuperadosProdutividade_();
    if (erros.length) throw new Error(erros[0]);
    for (var i = 0; i < qtd; i++) {
        var tipo = (document.getElementById('veh_tipo_' + i) || {}).value || '';
        var marcaSelect = document.getElementById('veh_marca_' + i);
        var marcaCode = (marcaSelect || {}).value || '';
        var marcaText = marcaCode === '__MANUAL__' ? 'NÃO LISTADO / MODIFICADO' : ((((marcaSelect || {}).selectedOptions || [])[0]) ? (marcaSelect.selectedOptions[0].text || '') : '');
        var reg = { categoria: 'CONTADORES', tipo_produtividade: 'VEÍCULOS RECUPERADOS', quantidade: 1, unidade: 'unid', crime: '', subtipo: '', modalidade: '', qtd_modalidade: '', nao_contabilizado: false, tipo_do_veiculo: tipo, marca: '', modelo: '', ano: '', fonte_de_dados: '', valor_rs: '', descricao_outros: '' };
        if (marcaCode === '__MANUAL__') {
            var descricao = ((document.getElementById('veh_desc_' + i) || {}).value || '').trim();
            var valorManual = normalizarNumeroMoedaProdutividade_((document.getElementById('veh_valor_manual_' + i) || {}).value || '');
            var obs = ((document.getElementById('veh_obs_' + i) || {}).value || '').trim();
            var fonteManual = ((document.getElementById('veh_fonte_' + i) || {}).value || '').trim();
            reg.marca = 'NÃO LISTADO / MODIFICADO';
            reg.modelo = descricao;
            reg.ano = '';
            reg.fonte_de_dados = fonteManual;
            reg.valor_rs = valorManual;
            reg.descricao_outros = 'NÃO LISTADO / MODIFICADO | ' + descricao + ' | R$ ' + Number(valorManual).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + (obs ? ' | ' + obs : '');
        } else {
            var modeloSelect = document.getElementById('veh_modelo_' + i);
            var anoSelect = document.getElementById('veh_ano_' + i);
            var valorInput = document.getElementById('veh_valor_' + i);
            var modeloText = ((((modeloSelect || {}).selectedOptions || [])[0]) ? (modeloSelect.selectedOptions[0].text || '') : '');
            var anoText = ((((anoSelect || {}).selectedOptions || [])[0]) ? (anoSelect.selectedOptions[0].text || '') : '');
            var valorNumero = (valorInput && valorInput.dataset) ? (valorInput.dataset.valorNumero || '') : '';
            var valorLabel = (valorInput || {}).value || '';
            reg.marca = marcaText;
            reg.modelo = modeloText;
            reg.ano = anoText;
            reg.fonte_de_dados = 'TABELA FIPE';
            reg.valor_rs = valorNumero || normalizarNumeroMoedaProdutividade_(valorLabel);
            reg.descricao_outros = tipo + ' | ' + marcaText + ' | ' + modeloText + ' | ' + anoText + ' | ' + valorLabel;
        }
        lote.push(reg);
    }
}

function renderizarBlocoInquerito(containerId, titulo, crimes, prefixo) {

    crimes.forEach(function (crime, index) {
        var idUnico = `${prefixo}_${index}`;
        var textoExibicao = crime.subtipo || crime.crime || '';
        var modalidade = crime.modalidade || '';
        var isConcluido = prefixo === 'conc';

        html += `
      <div class="row align-items-center mb-2 bg-dark p-2 rounded border border-secondary" style="--bs-bg-opacity: .4;">
        <div class="col-md-7 text-light text-uppercase" style="font-size: 0.85rem;">${textoExibicao}</div>
        <div class="col-md-3">
          <div class="input-group input-group-sm">
            <input type="number"
                   id="val_${idUnico}"
                   class="form-control"
                   placeholder="Qtd"
                   data-crime="${crime.crime || ''}"
                   data-subtipo="${crime.subtipo || crime.crime || ''}"
                   data-modalidade="${modalidade}"
                   oninput="verificarModalidade(this, '${idUnico}')">
            <span class="input-group-text bg-secondary text-light">unid</span>
          </div>
        </div>
        <div class="col-md-2 text-end">
          <div class="form-check form-switch d-inline-block">
            <input class="form-check-input nc-switch" type="checkbox" id="nc_${idUnico}" onchange="toggleNCProdutividade('${idUnico}')">
            <label class="form-check-label text-light" for="nc_${idUnico}">NC</label>
          </div>
        </div>
      </div>

      <div class="row mb-2" id="div_mod_${idUnico}" style="display:none;">
        <div class="col-md-11 offset-md-1 bg-secondary bg-opacity-25 p-2 rounded border-start border-warning border-3">
          <label class="form-label text-warning mb-1" style="font-size: 0.8rem;" id="label_mod_${idUnico}"></label>
          <input type="number"
                 id="val_mod_${idUnico}"

                 placeholder="Qtd"
                 oninput="${isConcluido ? `atualizarDetalheInqueritoConcluido('${idUnico}')` : ''}">
        </div>
      </div>

      ${isConcluido ? `<div class="mb-3" id="div_conc_det_${idUnico}"></div>` : ''}
    `;
    });

    container.innerHTML = html;
}

function toggleNCProdutividade(idElemento) {
    var checkbox = document.getElementById(`nc_${idElemento}`);
    var inputNum = document.getElementById(`val_${idElemento}`);
    var divMod = document.getElementById(`div_mod_${idElemento}`);
    var inputMod = document.getElementById(`val_mod_${idElemento}`);
    var isChecked = checkbox.checked;

    if (isChecked) {
        if (inputNum) {
            inputNum.value = '';
            inputNum.disabled = true;
        }

        if (divMod) divMod.style.display = 'none';

        if (inputMod) {
            inputMod.value = '';
            inputMod.disabled = true;
        }
    } else {
        if (inputNum) inputNum.disabled = false;
        if (inputMod) inputMod.disabled = false;
    }

    if (idElemento === 'cnt_veiculos_recup') {
        atualizarDetalhesVeiculosRecuperados();
    }

    if (idElemento === 'apr_drogas') {
        var selectDrogas = document.getElementById('sel_apr_drogas');
        if (selectDrogas && isChecked) selectDrogas.value = '';
        atualizarApreensaoDrogasDetalhes();
    }

    if (idElemento === 'inq_remetido') {
        var inputRelatorio = document.getElementById('val_inq_remetido_relatorio');
        if (inputRelatorio && isChecked) inputRelatorio.value = '';
        atualizarPerguntaInqueritoRemetido();
    }

function numeroInteiroProdutividade_(valor) {
    var n = parseInt(valor, 10);
    return isNaN(n) ? 0 : n;
}
function montarTituloBlocoConclusao_(crime, subtipo, modalidade) {
    var partes = [];
    if (crime) partes.push(crime);
    if (subtipo && subtipo !== crime) partes.push(subtipo);
    if (modalidade) partes.push(modalidade);
    return partes.join(' | ');
}
function toggleAutoriaConclusaoProdutividade(idBase) {

        wrapAutoria.style.display = 'none';
        inputAutoria.value = '';

function setErroConclusaoProdutividade_(input, mensagem) {
    if (!input) return;
    input.classList.add('border-danger');

    var erro = document.getElementById(erroId);

    if (!erro) {
        erro = document.createElement('div');
        erro.id = erroId;
        erro.className = 'text-danger small mt-1';
        input.insertAdjacentElement('afterend', erro);
    }

    erro.textContent = mensagem || '';
}

function limparErroConclusaoProdutividade_(input) {
    if (!input) return;
    input.classList.remove('border-danger');

    var erro = document.getElementById(input.id + '_erro');
    if (erro) erro.remove();
}

function validarConclusaoTempoRealProdutividade_(idBase, titulo, quantidade) {
    var inputPortaria = document.getElementById('val_' + idBase + '_portaria');
    var inputAutoria = document.getElementById('val_' + idBase + '_autoria');

    if (!inputPortaria) return true;

    var total = numeroInteiroProdutividade_(quantidade);
    var qtdPortaria = numeroInteiroProdutividade_(inputPortaria.value);
    var qtdAutoria = numeroInteiroProdutividade_(inputAutoria && inputAutoria.value);

    limparErroConclusaoProdutividade_(inputPortaria);
    if (inputAutoria) limparErroConclusaoProdutividade_(inputAutoria);

    if (qtdPortaria > total) {
        setErroConclusaoProdutividade_(
            inputPortaria,
            'A quantidade informada em PORTARIA não pode ser maior que o total de inquéritos concluídos deste bloco (' + total + ').'
        );
        return false;
    }

    if (inputAutoria && qtdAutoria > qtdPortaria) {
        setErroConclusaoProdutividade_(
            inputAutoria,
            'A quantidade COM AUTORIA não pode ser maior que a quantidade informada em PORTARIA (' + qtdPortaria + ').'

        return false;
    }

    return true;

function aprovarUsuarioPortal(loginAlvo) {
    var selectPerfil = document.getElementById('perfil_usuario_' + loginAlvo);
    var selectLotacao = document.getElementById('lotacao_usuario_' + loginAlvo);
    var selectEquipe = document.getElementById('equipe_usuario_' + loginAlvo);

    var perfil = selectPerfil ? selectPerfil.value : 'DELEGACIA';
    var lotacao = selectLotacao ? selectLotacao.value : '';
    var equipe = selectEquipe ? selectEquipe.value : '';

    if (!lotacao) {
        alert('Confirme ou selecione a lotação do usuário antes de aprovar.');
        return;
    }

    if (normalizarTextoMod3(lotacao) === 'NUCLEO OPERACIONAL' && !equipe) {
        alert('Selecione a equipe do Núcleo Operacional antes de aprovar.');
        return;
    }

    var textoConfirmacao =
        'Confirmar aprovação/atualização do usuário?\n\n' +
        'Login: ' + loginAlvo + '\n' +
        'Perfil: ' + perfil + '\n' +
        'Lotação: ' + lotacao + '\n' +
        'Equipe: ' + (equipe || '-');

    if (!confirm(textoConfirmacao)) return;

    google.script.run
        .withSuccessHandler(function(resposta) {
            alert(resposta.mensagem || 'Usuário aprovado/atualizado com sucesso.');
            carregarUsuariosPortal();
        })
        .withFailureHandler(function(erro) {
            alert((erro && erro.message) || erro || 'Falha ao aprovar usuário.');
        })
        .aprovarUsuarioPortal(usuarioAtual.login, loginAlvo, perfil, lotacao, equipe);
}

function rejeitarUsuarioPortal(loginAlvo) {
    if (!confirm('Deseja realmente rejeitar este cadastro?'))
        return;
    google.script.run
        .withSuccessHandler(function (resposta) {
        alert(resposta.mensagem || 'Cadastro rejeitado com sucesso.');
        carregarUsuariosPortal();
    })
        .withFailureHandler(function (erro) {
        alert((erro === null || erro === void 0 ? void 0 : erro.message) || erro || 'Falha ao rejeitar cadastro.');
    })
        .rejeitarUsuarioPortal(usuarioAtual.login, loginAlvo);
}

function salvarDemandaGeralFrontend() {
    if (!usuarioAtual || !usuarioAtual.login) return exibirAvisoPortal('Usuário não autenticado.', 'erro');
    var payload = {
        usuarioLogin: usuarioAtual.login,
        equipe: ((document.getElementById('dgEquipe') || {}).value || ''),
        tipoDemanda: ((document.getElementById('dgTipoDemanda') || {}).value || ''),
        tipoProcedimento: ((document.getElementById('dgTipoProcedimento') || {}).value || ''),
        numeroProcedimento: ((document.getElementById('dgNumeroProcedimento') || {}).value || '').trim()
    };
    if (!payload.equipe || !payload.tipoDemanda || !payload.tipoProcedimento || !payload.numeroProcedimento) return exibirAvisoPortal('Preencha Equipe, Tipo de Demanda, Tipo de Procedimento e Nº do Procedimento.', 'aviso');
    var btn = document.getElementById('btnSalvarDemandaGeral');
    if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Salvando...'; }
    google.script.run.withSuccessHandler(function(ret) {
        if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fas fa-save"></i> Salvar Demanda Geral'; }
        if (!ret || ret.sucesso === false) return exibirAvisoPortal((ret && ret.erro) || 'Não foi possível salvar a demanda geral.', 'erro');
        ['dgEquipe','dgTipoDemanda','dgTipoProcedimento','dgNumeroProcedimento'].forEach(function(id){ var el=document.getElementById(id); if(el) el.value=''; });
        exibirAvisoPortal((ret && ret.mensagem) || 'Demanda geral cadastrada com sucesso.', 'sucesso');
        carregarDashboardDemandasGeraisFrontend();
    }).withFailureHandler(function(err) {
        if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fas fa-save"></i> Salvar Demanda Geral'; }
        exibirAvisoPortal((err && err.message) || err || 'Erro ao salvar a demanda geral.', 'erro');
    }).salvarDemandaGeralPortal(payload);
}

function preencherFiltrosDashboardDemandasPortal() {
    var b = DASH_DEMANDAS_STATE.bootstrap || {};

    preencherSelectDD_('ddAno', [''].concat(b.anos || []), 'Todos');
    preencherSelectDD_('ddMes', [''].concat(b.meses || []), 'Todos');
    preencherSelectDD_('ddSolicitanteNuip', [''].concat(b.solicitantes || []), 'Todos');

    var anoAtual = new Date().getFullYear();
    var selAno = document.getElementById('ddAno');
    if (selAno) selAno.value = String(anoAtual);

    onChangeTipoFiltroDashboardDemandas();
}

function preencherSelectDD_(id, lista, labelVazio) {
    var sel = document.getElementById(id);
    if (!sel) return;

    var html = '';
    (lista || []).forEach(function(item, idx) {
        var valor = String(item || '');
        var label = valor || (labelVazio || 'Todos');
        html += '<option value="' + escDD_(valor) + '">' + escDD_(label) + '</option>';
    });
    sel.innerHTML = html;
}

function onChangeTipoFiltroDashboardDemandas() {
    var tipo = (document.getElementById('ddTipoFiltro') || {}).value || '';
    var b = DASH_DEMANDAS_STATE.bootstrap || {};
    var lista = [''];

    return String(texto == null ? '' : texto)
        .replace(/&/g, '&amp;')

        .replace(/"/g, '&quot;')

function renderizarGraficoSolicitantesNuip(ranking) {
    var box = document.getElementById('chartSolicitantesNuip');
    if (!box) return;

    ranking = ranking || [];

    if (!ranking.length) {
        box.innerHTML = '<div class="text-muted small">Nenhuma solicitação encontrada para os filtros selecionados.</div>';
        return;
    }

    var lista = ranking.slice(0, 15);
    var maior = Math.max.apply(null, lista.map(function(item) {
        return Number(item.qtd || 0);
    }));

    var html = '';

    lista.forEach(function(item, index) {
        var nome = item.nome || 'NÃO INFORMADO';
        var qtd = Number(item.qtd || 0);
        var percentual = maior > 0 ? Math.round((qtd / maior) * 100) : 0;

        html += ''
            + '<div class="mb-3">'
            + '  <div class="d-flex justify-content-between align-items-center mb-1">'
            + '    <div class="small text-light">'
            + '      <strong>' + (index + 1) + 'º</strong> - ' + escDD_(nome)
            + '    </div>'
            + '    <div class="small text-warning fw-bold">' + qtd.toLocaleString('pt-BR') + '</div>'
            + '  </div>'
            + '  <div style="height: 18px; background:#2a2a2a; border-radius:999px; overflow:hidden; border:1px solid #444;">'
            + '    <div style="height:100%; width:' + percentual + '%; background:#d4af37; border-radius:999px;"></div>'
            + '  </div>'
            + '</div>';
    });

    box.innerHTML = html;
}

function gerarRelatorioGerencialFrontend() {
    if (!usuarioAtual || !usuarioAtual.login) {
        alert('Usuário não autenticado.');
        return;
    }

    var dataReferencia = (document.getElementById('relGerDataReferencia') || {}).value || '';
    var observacoes = (document.getElementById('relGerObservacoes') || {}).value || '';

    if (!dataReferencia) {
        alert('Informe a data de referência.');
        return;
    }

    var btn = document.getElementById('btnGerarRelatorioGerencial');
    var status = document.getElementById('relGerStatus');
    var resultado = document.getElementById('relGerResultado');

    if (btn) {
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Gerando relatório...';
    }

    if (status) {
        status.innerHTML = ''
            + '<div class="alert alert-secondary">'
            + '<i class="fas fa-spinner fa-spin me-2"></i>'
            + 'Coletando dados, calculando indicadores, gerando textos, tabelas, gráficos, DOC e PDF. Aguarde...'
            + '</div>';
    }

    if (resultado) resultado.innerHTML = '';

    var payload = {
        usuarioLogin: usuarioAtual.login,
        dataReferencia: dataReferencia,
        observacoesQualitativas: observacoes
    };

    google.script.run
        .withSuccessHandler(function(resp) {
            if (btn) {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-wand-magic-sparkles"></i> Gerar Relatório';
            }

            if (!resp || !resp.ok) {
                if (status) {
                    status.innerHTML = '<div class="alert alert-danger"><b>Erro:</b> ' + escRelGerencial_((resp && resp.erro) || 'Não foi possível gerar o relatório.') + '</div>';
                }
                return;
            }

            if (status) {
                status.innerHTML = '<div class="alert alert-success"><i class="fas fa-check-circle me-2"></i>' + escRelGerencial_(resp.mensagem || 'Relatório gerado com sucesso.') + '</div>';
            }

            if (resultado) {
                resultado.innerHTML = ''
                    + '<div class="card card-depatri p-4">'
                    + '  <h5 class="text-gold mb-3"><i class="fas fa-file-circle-check"></i> Arquivos gerados</h5>'
                    + '  <div class="d-flex flex-wrap gap-2">'
                    + '    <a class="btn btn-outline-light" target="_blank" href="' + escRelGerencial_(resp.docUrl || '#') + '">'
                    + '      <i class="fas fa-file-word"></i> Abrir DOC'
                    + '    </a>'
                    + '    <a class="btn btn-outline-warning" target="_blank" href="' + escRelGerencial_(resp.pdfUrl || '#') + '">'
                    + '      <i class="fas fa-file-pdf"></i> Abrir PDF'
                    + '    </a>'
                    + '  </div>'
                    + '</div>';
            }
        })
        .withFailureHandler(function(erro) {
            if (btn) {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-wand-magic-sparkles"></i> Gerar Relatório';
            }
            if (status) {
                status.innerHTML = '<div class="alert alert-danger"><b>Erro:</b> ' + escRelGerencial_((erro && erro.message) || erro || 'Falha ao gerar relatório.') + '</div>';
            }
        })
        .apiGerarRelatorioGerencial(payload);
}

    var link = document.querySelector("a[onclick=\"navegar('modSirp')\"]");

    var spans = link.querySelectorAll('span');
    for (var i = 0; i < spans.length; i++) {
        if (normalizarSirpFront_(spans[i].textContent).indexOf('SIRP') > -1) {
            spans[i].textContent = 'ANÁLISE DE ROTAS E COBERTURA DE CÂMERAS';
            return;
        }
    }

    for (var j = 0; j < link.childNodes.length; j++) {
        var no = link.childNodes[j];
        if (no.nodeType === 3 && normalizarSirpFront_(no.nodeValue).indexOf('SIRP') > -1) {
            no.nodeValue = ' ANÁLISE DE ROTAS E COBERTURA DE CÂMERAS';
            return;
        }
    }
}
