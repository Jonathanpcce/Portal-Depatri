function gerarRTDesenvFrontend() {
    var num = (DESENV_DEMANDAS_STATE.demandaAtual && DESENV_DEMANDAS_STATE.demandaAtual.numOcorrencia) || '';

    if (!num) {
        return alert('Abra uma demanda antes de gerar o RT.');
    }

    if (!confirm('Gerar Relatório Técnico para esta demanda?')) {
        return;
    }

    var box = document.getElementById('desenvLinksRtBox');

    if (box) {
        box.innerHTML = '<div class="alert alert-secondary"><i class="fas fa-spinner fa-spin"></i> Preparando RT...</div>';
    }

    google.script.run
        .withSuccessHandler(function(prep) {
            if (!prep || !prep.sucesso) {
                if (box) {
                    box.innerHTML = '<div class="alert alert-danger">Falha ao preparar RT.</div>';
                }
                return;
            }

            // CASO 1: tem pasta Drive.
            // Então gera QR Code personalizado.
            if (prep.linkDriveImagens) {
                if (box) {
                    box.innerHTML = '<div class="alert alert-secondary"><i class="fas fa-spinner fa-spin"></i> Carregando brasão oficial da PCCE...</div>';
                }

                google.script.run
                    .withSuccessHandler(function(retBrasao) {
                        if (!retBrasao || !retBrasao.sucesso || !retBrasao.dataUrl) {
                            if (box) {
                                box.innerHTML = '<div class="alert alert-danger">'
                                    + escRtDesenv_((retBrasao && retBrasao.erro) || 'Não foi possível carregar o brasão da PCCE.')
                                    + '</div>';
                            }
                            return;
                        }

                        prep.brasaoBase64 = retBrasao.dataUrl;

                        if (box) {
                            box.innerHTML = '<div class="alert alert-secondary"><i class="fas fa-spinner fa-spin"></i> Gerando QR Code personalizado DEPATRI...</div>';
                        }

                        gerarQrCardRtCanvas_(prep, function(qrBase64) {
                            finalizarGeracaoRtDesenvFrontend_(num, qrBase64, box);
                        });
                    })
                    .withFailureHandler(function(err) {
                        if (box) {
                            box.innerHTML = '<div class="alert alert-danger">'
                                + escRtDesenv_((err && err.message) || err || 'Erro ao carregar brasão da PCCE.')
                                + '</div>';
                        }
                    })
                    .obterBrasaoRtDesenvBase64();

                return;
            }

            // CASO 2: não tem pasta Drive.
            // Gera RT normalmente, sem QR Code e sem link de imagens.
            finalizarGeracaoRtDesenvFrontend_(num, '', box);
        })
        .withFailureHandler(function(err) {
            if (box) {
                box.innerHTML = '<div class="alert alert-danger">'
                    + escRtDesenv_((err && err.message) || err || 'Erro ao preparar RT.')
                    + '</div>';
            }
        })
        .prepararRTDesenvDemandas(usuarioAtual.login, num);
}

function finalizarGeracaoRtDesenvFrontend_(num, qrBase64, box) {
    if (box) {
        box.innerHTML = '<div class="alert alert-secondary"><i class="fas fa-spinner fa-spin"></i> Gerando documento e PDF...</div>';
    }

    google.script.run
        .withSuccessHandler(function(ret) {
            if (ret && ret.sucesso) {
                if (box) {
                    var botoes = '';

                    // DOC/DOCS = azul com letra branca
                    botoes += '<a class="btn btn-sm" target="_blank" href="' + escRtDesenv_(ret.urlDoc || '') + '" '
                        + 'style="background:#0d6efd; color:#ffffff; border:1px solid #0d6efd; font-weight:600;">'
                        + '<i class="fas fa-file-word me-1"></i> Abrir DOC'
                        + '</a>';

                    // PDF = vermelho com letra branca
                    botoes += '<a class="btn btn-sm" target="_blank" href="' + escRtDesenv_(ret.urlPdf || '') + '" '
                        + 'style="background:#dc3545; color:#ffffff; border:1px solid #dc3545; font-weight:600;">'
                        + '<i class="fas fa-file-pdf me-1"></i> Abrir PDF'
                        + '</a>';

                    // Pasta = amarelo/dourado com letra preta
                    if (ret.linkDriveImagens) {
                        botoes += '<a class="btn btn-sm" target="_blank" href="' + escRtDesenv_(ret.linkDriveImagens || '') + '" '
                            + 'style="background:#ffc107; color:#111111; border:1px solid #d39e00; font-weight:700;">'
                            + '<i class="fas fa-folder-open me-1"></i> Abrir Pasta'
                            + '</a>';
                    }

                    box.innerHTML = '<div class="alert alert-success" style="border-left:5px solid #198754;">'
                        + '<div><strong>RT ' + escRtDesenv_(ret.numeroRt || '') + ' gerado com sucesso.</strong></div>'
                        + '<div class="d-flex gap-2 flex-wrap mt-2 align-items-center">' + botoes + '</div>'
                        + '</div>';
                }

                abrirDemandaDesenv(num);

            } else {
                if (box) {
                    box.innerHTML = '<div class="alert alert-danger">'
                        + escRtDesenv_((ret && ret.erro) || 'Falha ao gerar RT.')
                        + '</div>';
                }
            }
        })
        .withFailureHandler(function(err) {
            if (box) {
                box.innerHTML = '<div class="alert alert-danger">'
                    + escRtDesenv_((err && err.message) || err || 'Erro ao finalizar RT.')
                    + '</div>';
            }
        })
        .finalizarRTDesenvDemandas(usuarioAtual.login, num, qrBase64 || '');
}

function abrirDemandaDesenv(numOcorrencia) {
    if (!numOcorrencia) return;

    google.script.run
        .withSuccessHandler(function(ret) {
            if (!ret || !ret.sucesso || !ret.demanda) {
                return alert((ret && ret.erro) || 'Demanda não encontrada.');
            }

            var d = ret.demanda;
            DESENV_DEMANDAS_STATE.demandaAtual = d;

            setValorDesenvSeguro_('desenvRowIndex', d.rowIndex || '');
            setValorDesenvSeguro_('desenvTipoOcorrencia', d.tipoOcorrencia || '');
            setValorDesenvSeguro_('desenvNumeroProcedimento', d.numeroProcedimento || '');
            setValorDesenvSeguro_('desenvData', converterDataBrParaIsoDesenv(d.data || ''));
            setValorDesenvSeguro_('desenvHora', d.hora || '');
            setValorDesenvSeguro_('desenvEquipe', d.equipe || '');
            setValorDesenvSeguro_('desenvDelegado', d.delegado || '');
            setValorDesenvSeguro_('desenvDemandaIninterrupta', d.demandaIninterrupta || 'NAO');

            setValorDesenvSeguro_('desenvCrimeRt', d.crime || '');
            setValorDesenvSeguro_('desenvDifusaoRt', d.difusao || '');

            setValorDesenvSeguro_('desenvDescricao', d.descricao || '');

            // Campo novo
            setValorDesenvSeguro_('desenvInformacoesIniciais', d.informacoesIniciais || '');

            // Compatibilidade com campo antigo, se ainda existir em alguma versão
            setValorDesenvSeguro_('desenvResumo', d.informacoesIniciais || d.resumo || '');

            setValorDesenvSeguro_('desenvStatusFinal', (d.status === 'PENDENTE' ? '' : d.status) || '');
            setValorDesenvSeguro_('desenvTextoCompleto', d.compilado || '');

            setTextoDesenvSeguro_('desenvNumAtualInfo', d.numOcorrencia || '');
            setTextoDesenvSeguro_('desenvModoEdicaoBadge', 'Edição');

            renderEvolucoesDesenv(d.evolucoes || []);
            limparFormularioEvolucaoDesenv();
        })
        .withFailureHandler(function(err) {
            alert((err && err.message) || err || 'Erro ao abrir demanda.');
        })
        .obterDemandaCompletaDesenvDemandas(usuarioAtual.login, numOcorrencia);
}

    ADMINISTRATIVO_STATE.bootstrap = null;
    ADMINISTRATIVO_STATE.cautelas = [];
    ADMINISTRATIVO_STATE.itensAdicionaisSelecionados = [];

    var dataPreview = document.getElementById('admCautelaDataPreview');
    if (dataPreview) dataPreview.value = gerarDataPreviewAdministrativo_();

    carregarAdministrativoPortal();
}

function carregarAdministrativoPortal() {
    var box = document.getElementById('admPendenciasBox');

    if (box) {
        box.innerHTML = '<div class="card card-depatri p-3 text-muted"><i class="fas fa-spinner fa-spin"></i> Carregando Administrativo...</div>';
    }

    google.script.run
        .withSuccessHandler(function(ret) {
            if (!ret || ret.sucesso === false) {
                if (box) {
                    box.innerHTML = '<div class="alert alert-danger">Erro: ' + escHtmlAdministrativo((ret && ret.erro) || 'Falha ao carregar.') + '</div>';
                }
                return;
            }

            ADMINISTRATIVO_STATE.bootstrap = ret;
            ADMINISTRATIVO_STATE.cautelas = ret.cautelas || [];

            renderPendenciasAdministrativo(ret);
            renderResumoAcessoAdministrativo(ret);
            popularCautelasAdministrativo(ret.cautelasConfig || {});
            renderTabelaCautelasAdministrativo(ADMINISTRATIVO_STATE.cautelas);

            var boxCadastro = document.getElementById('admCadastroCautelaBox');

            if (boxCadastro) {
                boxCadastro.style.display = ret.podeCadastrar ? '' : 'none';
            }
        })
        .withFailureHandler(function(err) {
            if (box) {
                box.innerHTML = '<div class="alert alert-danger">Erro: ' + escHtmlAdministrativo((err && err.message) || err || '') + '</div>';
            }
        })
        .obterBootstrapAdministrativo(usuarioAtual.login);
}

function renderResumoAcessoAdministrativo(ret) {
    var el = document.getElementById('admResumoAcesso');
    if (!el) return;

    if (ret && ret.podeVerTudo) {
        el.innerHTML = 'Visão geral liberada: ADMIN / ADMINISTRATIVO / DIREÇÃO.';
    } else {
        el.innerHTML = 'Você está visualizando apenas os objetos acautelados em seu nome.';
    }
}

function renderPendenciasAdministrativo(ret) {
    var box = document.getElementById('admPendenciasBox');
    if (!box) return;

    if (!ret || !ret.podeVerPendencias) {
        box.innerHTML = '';
        return;
    }

    var pendencias = ret.pendencias || {};
    var meses = pendencias.mesesAvaliados || [];

    var html = '';

    if (pendencias.todasEnviaram) {
        html += '<div class="alert alert-success border-success shadow-sm">';
        html += '<div class="fw-bold"><i class="fas fa-check-circle"></i> Produtividade em conformidade</div>';
        html += '<div>' + escHtmlAdministrativo(pendencias.mensagem || '') + '</div>';
        html += '</div>';

        box.innerHTML = html;
        return;
    }

    html += '<div class="card card-depatri p-3" style="border-left:6px solid #dc3545;">';
    html += '<h5 class="text-danger mb-1"><i class="fas fa-triangle-exclamation"></i> Pendências de produtividade</h5>';
    html += '<div class="text-muted small mb-3">Ano avaliado: ' + escHtmlAdministrativo(pendencias.anoAtual || '') + ' — meses de janeiro até ' + escHtmlAdministrativo(pendencias.mesAtual || '') + '.</div>';

    html += '<div class="table-responsive">';
    html += '<table class="table table-dark table-striped table-bordered align-middle mb-0">';
    html += '<thead><tr><th>Mês</th><th>Situação</th><th>Delegacias pendentes</th></tr></thead><tbody>';

    meses.forEach(function(item) {
        var pend = item.pendentes || [];
        var completo = pend.length === 0;

        html += '<tr>';
        html += '<td class="fw-bold">' + escHtmlAdministrativo(item.mes || '') + '</td>';
        html += '<td>' + (completo ? '<span class="badge bg-success">Completo</span>' : '<span class="badge bg-danger">Pendente</span>') + '</td>';
        html += '<td>';

        if (completo) {
            html += '<span class="text-success">Todas enviaram</span>';
        } else {
            pend.forEach(function(unidade) {
                html += '<span class="badge rounded-pill bg-danger me-1 mb-1">' + escHtmlAdministrativo(unidade) + '</span>';
            });
        }

        html += '</td>';
        html += '</tr>';
    });

    html += '</tbody></table></div></div>';

    box.innerHTML = html;
}

function popularCautelasAdministrativo(cautelas) {
    cautelas = cautelas || {};

    var item = document.getElementById('admCautelaItem');
    var responsavel = document.getElementById('admCautelaResponsavel');
    var adicional = document.getElementById('admItemAdicionalSelect');

    if (item) item.innerHTML = buildOptionsAdministrativo(cautelas.itens || [], 'Selecione o item principal');
    if (responsavel) responsavel.innerHTML = buildOptionsAdministrativo(cautelas.policiais || [], 'Selecione o responsável');
    if (adicional) adicional.innerHTML = buildOptionsAdministrativo(cautelas.itensAdicionais || [], 'Selecione item adicional');

    onChangeItemCautelaAdministrativo();
    onChangeResponsavelCautelaAdministrativo();
    renderItensAdicionaisAdministrativo();
}

function onChangeItemCautelaAdministrativo() {
    var cfg = (ADMINISTRATIVO_STATE.bootstrap && ADMINISTRATIVO_STATE.bootstrap.cautelasConfig) || {};
    var item = (document.getElementById('admCautelaItem') || {}).value || '';

    var modelos = (cfg.modelosPorItem && cfg.modelosPorItem[item]) || [];
    var series = (cfg.seriesPorItem && cfg.seriesPorItem[item]) || [];

    var modeloEl = document.getElementById('admCautelaModelo');
    var serieEl = document.getElementById('admCautelaSerie');
    var tomboEl = document.getElementById('admCautelaTombo');

    if (modeloEl) modeloEl.innerHTML = buildOptionsAdministrativo(modelos, item ? 'Selecione o modelo' : 'Selecione o item primeiro');
    if (serieEl) serieEl.innerHTML = buildOptionsAdministrativo(series, item ? 'Selecione a série/placa' : 'Selecione o item primeiro');
    if (tomboEl) tomboEl.value = '';
}

function onChangeSerieCautelaAdministrativo() {
    var cfg = (ADMINISTRATIVO_STATE.bootstrap && ADMINISTRATIVO_STATE.bootstrap.cautelasConfig) || {};
    var item = (document.getElementById('admCautelaItem') || {}).value || '';
    var serie = (document.getElementById('admCautelaSerie') || {}).value || '';

    var tombo = '';

    if (
        cfg.tombosPorItemSerie &&
        cfg.tombosPorItemSerie[item] &&
        cfg.tombosPorItemSerie[item][serie]
    ) {
        tombo = cfg.tombosPorItemSerie[item][serie];
    }

    var tomboEl = document.getElementById('admCautelaTombo');
    if (tomboEl) tomboEl.value = tombo || '';
}

function onChangeResponsavelCautelaAdministrativo() {
    var cfg = (ADMINISTRATIVO_STATE.bootstrap && ADMINISTRATIVO_STATE.bootstrap.cautelasConfig) || {};
    var nome = (document.getElementById('admCautelaResponsavel') || {}).value || '';
    var policiais = cfg.policiais || [];
    var info = null;

    for (var i = 0; i < policiais.length; i++) {
        if (String(policiais[i].nome || '') === String(nome || '')) {
            info = policiais[i];
            break;
        }
    }

    var policial = document.getElementById('admCautelaPolicial');
    var cargo = document.getElementById('admCautelaCargo');
    var matricula = document.getElementById('admCautelaMatricula');

    if (policial) policial.value = info ? (info.policial || '') : '';
    if (cargo) cargo.value = info ? (info.cargo || '') : '';
    if (matricula) matricula.value = info ? (info.matricula || '') : '';
}

function adicionarItemAdicionalAdministrativo() {
    var sel = document.getElementById('admItemAdicionalSelect');
    if (!sel) return;

    var valor = String(sel.value || '').trim();

    if (!valor) {
        return alert('Selecione um item adicional.');
    }

    if (ADMINISTRATIVO_STATE.itensAdicionaisSelecionados.indexOf(valor) === -1) {
        ADMINISTRATIVO_STATE.itensAdicionaisSelecionados.push(valor);
    }

    sel.value = '';
    renderItensAdicionaisAdministrativo();
}

function removerItemAdicionalAdministrativo(idx) {
    ADMINISTRATIVO_STATE.itensAdicionaisSelecionados.splice(idx, 1);
    renderItensAdicionaisAdministrativo();
}

function renderItensAdicionaisAdministrativo() {
    var box = document.getElementById('admItensAdicionaisLista');
    if (!box) return;

    var lista = ADMINISTRATIVO_STATE.itensAdicionaisSelecionados || [];

    if (!lista.length) {
        box.innerHTML = '<div class="small text-muted">Nenhum item adicional selecionado.</div>';
        return;
    }

    var html = '<div class="d-flex flex-wrap gap-2">';

    lista.forEach(function(item, idx) {
        html += '<span class="badge rounded-pill bg-secondary px-3 py-2">';
        html += escHtmlAdministrativo(item);
        html += ' <button type="button" class="btn btn-sm btn-link text-warning p-0 ms-2" onclick="removerItemAdicionalAdministrativo(' + idx + ')">';
        html += '<i class="fas fa-xmark"></i>';
        html += '</button>';
        html += '</span>';
    });

    html += '</div>';

    box.innerHTML = html;
}

function limparFormularioCautelaAdministrativo() {
    [
        'admCautelaItem',
        'admCautelaModelo',
        'admCautelaSerie',
        'admCautelaTombo',
        'admCautelaResponsavel',
        'admPlacaSigilosa',
        'admCautelaPolicial',
        'admCautelaCargo',
        'admCautelaMatricula'
    ].forEach(function(id) {
        var el = document.getElementById(id);
        if (el) el.value = '';
    });

    var confirmacao = document.getElementById('admConfirmacao');
    if (confirmacao) confirmacao.value = 'Pendente';

    var fixa = document.getElementById('admCautelaFixa');
    if (fixa) fixa.value = 'SIM';

    ADMINISTRATIVO_STATE.itensAdicionaisSelecionados = [];

    onChangeItemCautelaAdministrativo();
    onChangeResponsavelCautelaAdministrativo();
    renderItensAdicionaisAdministrativo();

    var resultado = document.getElementById('admCautelaResultado');
    if (resultado) resultado.innerHTML = '';
}

function gerarCautelaAdministrativoFrontend() {
    var btn = document.getElementById('btnGerarCautelaAdm');
    var resultado = document.getElementById('admCautelaResultado');

    var payload = {
        item: ((document.getElementById('admCautelaItem') || {}).value || ''),
        modelo: ((document.getElementById('admCautelaModelo') || {}).value || ''),
        serie: ((document.getElementById('admCautelaSerie') || {}).value || ''),
        tombo: ((document.getElementById('admCautelaTombo') || {}).value || ''),
        responsavel: ((document.getElementById('admCautelaResponsavel') || {}).value || ''),
        placaSigilosa: ((document.getElementById('admPlacaSigilosa') || {}).value || ''),
        confirmacao: ((document.getElementById('admConfirmacao') || {}).value || 'Pendente'),
        cautelaFixa: ((document.getElementById('admCautelaFixa') || {}).value || 'SIM'),
        itensAdicionais: ADMINISTRATIVO_STATE.itensAdicionaisSelecionados || []
    };

    if (!payload.item) return alert('Selecione o item principal.');
    if (!payload.modelo) return alert('Selecione o modelo.');
    if (!payload.serie) return alert('Selecione o Nº Série/Placa.');
    if (!payload.responsavel) return alert('Selecione o responsável.');

    if (btn) {
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Salvando...';
    }

    if (resultado) {
        resultado.innerHTML = '<div class="alert alert-secondary"><i class="fas fa-spinner fa-spin"></i> Processando cautela...</div>';
    }

    google.script.run
        .withSuccessHandler(function(ret) {
            if (btn) {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-save"></i> Salvar cautela';
            }

            if (!ret || ret.sucesso === false) {
                if (resultado) {
                    resultado.innerHTML = '<div class="alert alert-danger">' + escHtmlAdministrativo((ret && ret.erro) || 'Erro ao salvar cautela.') + '</div>';
                }
                return;
            }

            ADMINISTRATIVO_STATE.cautelas = ret.cautelas || ADMINISTRATIVO_STATE.cautelas;
            renderTabelaCautelasAdministrativo(ADMINISTRATIVO_STATE.cautelas);

            var msg = '<div class="alert alert-success">';
            msg += '<div class="fw-bold"><i class="fas fa-check-circle"></i> ' + escHtmlAdministrativo(ret.mensagem || 'Cautela salva.') + '</div>';

            if (ret.linkPdf) {
                msg += '<div class="small mt-2">' + escHtmlAdministrativo(ret.nomePdf || '') + '</div>';
                msg += '<a class="btn btn-sm btn-outline-danger mt-2" target="_blank" href="' + escHtmlAdministrativo(ret.linkPdf) + '">';
                msg += '<i class="fas fa-file-pdf"></i> Abrir PDF';
                msg += '</a>';
            }

            msg += '</div>';

            if (resultado) resultado.innerHTML = msg;

            pesquisarCautelasAdministrativoFrontend();
        })
        .withFailureHandler(function(err) {
            if (btn) {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-save"></i> Salvar cautela';
            }

            if (resultado) {
                resultado.innerHTML = '<div class="alert alert-danger">Erro: ' + escHtmlAdministrativo((err && err.message) || err || '') + '</div>';
            }
        })
        .gerarCautelaAdministrativo(usuarioAtual.login, payload);
}

function pesquisarCautelasAdministrativoFrontend() {
    var termo = ((document.getElementById('admBuscaCautelas') || {}).value || '');

    google.script.run
        .withSuccessHandler(function(ret) {
            if (!ret || ret.sucesso === false) {
                alert((ret && ret.erro) || 'Erro ao pesquisar cautelas.');
                return;
            }

            ADMINISTRATIVO_STATE.cautelas = ret.cautelas || [];
            renderTabelaCautelasAdministrativo(ADMINISTRATIVO_STATE.cautelas);
        })
        .withFailureHandler(function(err) {
            alert((err && err.message) || err || 'Erro ao pesquisar cautelas.');
        })
        .pesquisarCautelasAdministrativo(usuarioAtual.login, termo);
}

function renderTabelaCautelasAdministrativo(lista) {
    var box = document.getElementById('admTabelaCautelas');
    if (!box) return;

    lista = lista || [];

    if (!lista.length) {
        box.innerHTML = '<div class="text-muted">Nenhuma cautela localizada.</div>';
        return;
    }

    var html = '';

    html += '<div class="table-responsive">';
    html += '<table class="table table-dark table-striped table-bordered align-middle">';
    html += '<thead><tr>';
    html += '<th>Categoria</th>';
    html += '<th>Item/Nome</th>';
    html += '<th>Modelo</th>';
    html += '<th>Nº Série/Placa</th>';
    html += '<th>Responsável</th>';
    html += '<th>Placa sigilosa</th>';
    html += '<th>Confirmação</th>';
    html += '<th>Cautela fixa</th>';
    html += '<th>PDF</th>';
    html += '<th>Ação</th>';
    html += '</tr></thead><tbody>';

    lista.forEach(function(item) {
        var confirmNorm = String(item.confirmacao || '')
            .normalize('NFD')
            .replace(/[\u0300-\u036f]/g, '')
            .toUpperCase();

        var classeConfirm = confirmNorm === 'CONFIRMADO' ? 'bg-success' : 'bg-warning text-dark';

        var fixaNorm = String(item.cautelaFixa || '')
            .normalize('NFD')
            .replace(/[\u0300-\u036f]/g, '')
            .toUpperCase();

        var classeFixa = fixaNorm === 'SIM' ? 'bg-primary' : 'bg-secondary';

        html += '<tr>';
        html += '<td>' + escHtmlAdministrativo(item.categoria || '-') + '</td>';
        html += '<td>' + escHtmlAdministrativo(item.itemNome || '-') + '</td>';
        html += '<td>' + escHtmlAdministrativo(item.modelo || '-') + '</td>';
        html += '<td>' + escHtmlAdministrativo(item.seriePlaca || '-') + '</td>';
        html += '<td>' + escHtmlAdministrativo(item.responsavel || '-') + '</td>';
        html += '<td>' + escHtmlAdministrativo(item.placaSigilosa || '-') + '</td>';
        html += '<td><span class="badge ' + classeConfirm + '">' + escHtmlAdministrativo(item.confirmacao || '-') + '</span></td>';
        html += '<td><span class="badge ' + classeFixa + '">' + escHtmlAdministrativo(item.cautelaFixa || '-') + '</span></td>';

        html += '<td>';

        if (item.linkPdf) {
            html += '<a class="btn btn-sm btn-outline-danger" target="_blank" href="' + escHtmlAdministrativo(item.linkPdf) + '">';
            html += '<i class="fas fa-file-pdf"></i> PDF';
            html += '</a>';
        } else {
            html += '<span class="text-muted small">Sem PDF</span>';
        }

        html += '</td>';

        html += '<td>';

        if (confirmNorm !== 'CONFIRMADO') {
            html += '<button class="btn btn-sm btn-outline-success" onclick="confirmarCautelaAdministrativoFrontend(' + item.rowIndex + ')">';
            html += '<i class="fas fa-check"></i> Confirmar';
            html += '</button>';
        } else {
            html += '<span class="text-muted small">—</span>';
        }

        html += '</td>';
        html += '</tr>';
    });

    html += '</tbody></table></div>';

    box.innerHTML = html;
}

function confirmarCautelaAdministrativoFrontend(rowIndex) {
    if (!confirm('Confirmar esta cautela?')) return;

    google.script.run
        .withSuccessHandler(function(ret) {
            if (!ret || ret.sucesso === false) {
                alert((ret && ret.erro) || 'Erro ao confirmar cautela.');
                return;
            }

            ADMINISTRATIVO_STATE.cautelas = ret.cautelas || [];
            renderTabelaCautelasAdministrativo(ADMINISTRATIVO_STATE.cautelas);

            alert(ret.mensagem || 'Cautela confirmada.');
        })
        .withFailureHandler(function(err) {
            alert((err && err.message) || err || 'Erro ao confirmar cautela.');
        })
        .confirmarCautelaAdministrativo(usuarioAtual.login, rowIndex);
}

function configurarImagemComFallbackHomeDepatri_(elemento, urlPrincipal, urlAlternativa) {
  if (!elemento || !urlPrincipal) return;
  if (elemento.getAttribute('data-home-imagem-configurada') === urlPrincipal) return;

  elemento.setAttribute('data-home-imagem-configurada', urlPrincipal);
  elemento.setAttribute('data-home-fallback-aplicado', '0');
  elemento.onerror = function() {
    if (this.getAttribute('data-home-fallback-aplicado') === '1') {
      this.onerror = null;
      return;
    }
    this.setAttribute('data-home-fallback-aplicado', '1');
    this.src = urlAlternativa;
  };
  elemento.src = urlPrincipal;
}

function aplicarFundoInstitucionalHomeDepatri_(url) {
  DEPATRI_HOME_FUNDO_ATUAL_URL = url || DEPATRI_HOME_FUNDO_INSTITUCIONAL_URL;
  document.documentElement.style.setProperty(
    '--home-fundo-institucional-url',
    'url("' + DEPATRI_HOME_FUNDO_ATUAL_URL.replace(/"/g, '%22') + '")'
  );
}

function configurarImagensHomeDepatri_() {
  configurarImagemComFallbackHomeDepatri_(
    document.getElementById('depatriTopbarBrasao'),
    DEPATRI_HOME_BRASAO_TOPO_URL,
    DEPATRI_HOME_BRASAO_TOPO_FALLBACK_URL
  );
  configurarImagemComFallbackHomeDepatri_(
    document.getElementById('depatriHeroBrasao3d'),
    DEPATRI_HOME_BRASAO_3D_URL,
    DEPATRI_HOME_BRASAO_3D_FALLBACK_URL
  );

  aplicarFundoInstitucionalHomeDepatri_(DEPATRI_HOME_FUNDO_ATUAL_URL);
  if (DEPATRI_HOME_FUNDO_TESTADO) return;
  DEPATRI_HOME_FUNDO_TESTADO = true;

  var testeFundo = new Image();
  testeFundo.onload = function() {
    aplicarFundoInstitucionalHomeDepatri_(DEPATRI_HOME_FUNDO_INSTITUCIONAL_URL);
  };
  testeFundo.onerror = function() {
    aplicarFundoInstitucionalHomeDepatri_(DEPATRI_HOME_FUNDO_INSTITUCIONAL_FALLBACK_URL);
  };
  testeFundo.src = DEPATRI_HOME_FUNDO_INSTITUCIONAL_URL;
}

function normalizarDepatriHome_(texto) {
  try {
    return String(texto || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\s+/g, ' ').trim().toUpperCase();
  } catch (e) {
    return String(texto || '').replace(/\s+/g, ' ').trim().toUpperCase();
  }
}

function usuarioPodeAcessarDepatri_(idModulo) {

function usuarioPodeVerAcervoCautelasDepatri_() {

  return perfil === 'ADMIN' || perfil === 'ADMINISTRATIVO' || perfil === 'DIRECAO';
}

function renderizarPainelUsuarioHomeDepatri_(ret) {
  var box = document.getElementById('depatriHomeIndicadores');
  if (!box) return;
  if (!ret || ret.sucesso === false) {
    box.innerHTML = '<div class="depatri-home-profile-note text-danger">Não foi possível carregar os indicadores da Home.</div>';
    return;
  }

  atualizarCabecalhoPainelUsuarioHomeDepatri_(ret.usuario || usuarioAtual || {});

  var vis = ret.visibilidade || {};
  var html = '';
  if (vis.horasExtras) {
    var horas = ret.horasExtras || {};
    var totalHoras = Number(horas.totalHoras || 0);
    var corpoHoras = totalHoras > 0
      ? '<div class="depatri-side-value">' + escHtmlDepatri_(typeof formatarHorasCardServicoExtra_ === 'function' ? formatarHorasCardServicoExtra_(totalHoras) : totalHoras + 'h') + '</div>'
        + '<div class="depatri-side-cycle">' + escHtmlDepatri_(horas.cicloAtual || 'Ciclo atual') + '</div>'
      : '<div class="depatri-side-empty">' + escHtmlDepatri_(horas.mensagem || 'Não há hora extra cadastrada no ciclo atual.') + '</div>';
    html += htmlCardIndicadorHomeDepatri_('Horas extras', 'fa-clock', corpoHoras);
  }

  if (vis.acervoAcautelado) {
    var acervo = ret.acervoAcautelado || {};
    var itens = acervo.itens || [];
    var corpoAcervo = '';
    if (Number(acervo.total || 0) > 0) {
      corpoAcervo += '<div class="depatri-side-count">' + escHtmlDepatri_(acervo.total) + '</div><div class="depatri-side-meta mb-3">item(ns) sob sua responsabilidade</div><div class="depatri-side-list">';
      itens.forEach(function(item) {
        var detalhes = [item.modelo || '', item.seriePlaca || ''].filter(Boolean).join(' · ');
        corpoAcervo += '<div class="depatri-side-list-item"><strong>' + escHtmlDepatri_(item.nome || 'Item acautelado') + '</strong>'
          + (detalhes ? '<div class="depatri-side-meta">' + escHtmlDepatri_(detalhes) + '</div>' : '') + '</div>';
      });
      corpoAcervo += '</div>';
    } else {
      corpoAcervo = '<div class="depatri-side-empty">' + escHtmlDepatri_(acervo.mensagem || 'Não há acervo acautelado em seu nome.') + '</div>';
    }
    html += htmlCardIndicadorHomeDepatri_('Acervo acautelado', 'fa-briefcase', corpoAcervo);
  }

  if (vis.pendenciasProdutividade) {
    var pendencias = ret.pendenciasProdutividade || {};
    var corpoPendencias = '';
    if (Number(pendencias.totalPendencias || 0) > 0) {
      corpoPendencias += '<div class="depatri-side-count">' + escHtmlDepatri_(pendencias.totalPendencias) + '</div><div class="depatri-side-meta mb-3">pendência(s) localizada(s)</div><div class="depatri-side-list">';
      (pendencias.mesesAvaliados || []).filter(function(item) { return (item.pendentes || []).length > 0; }).slice(-3).forEach(function(item) {
        corpoPendencias += '<div class="depatri-side-list-item"><strong>' + escHtmlDepatri_(item.mes || '') + '</strong><div class="depatri-side-meta">' + escHtmlDepatri_((item.pendentes || []).join(', ')) + '</div></div>';
      });
      corpoPendencias += '</div>';
    } else {
      corpoPendencias = '<div class="depatri-side-empty">' + escHtmlDepatri_(pendencias.mensagem || 'Não há delegacia pendente cadastrada no Sistema DEPATRI.') + '</div>';
    }
    html += htmlCardIndicadorHomeDepatri_('Pendências de produtividade', 'fa-file-circle-exclamation', corpoPendencias);
  }

  if (!html) {
    html = '<div class="depatri-home-profile-note"><i class="fas fa-circle-info text-warning me-1"></i> Os indicadores administrativos desta área não se aplicam ao perfil Delegacia.</div>';
  }
  box.innerHTML = html;
}

function carregarPainelUsuarioHomeDepatri_() {
  var box = document.getElementById('depatriHomeIndicadores');
  if (!box || !usuarioAtual || !usuarioAtual.login) return;
  box.innerHTML = '<div class="depatri-home-profile-note"><i class="fas fa-spinner fa-spin text-warning me-1"></i> Carregando indicadores...</div>';
  google.script.run
    .withSuccessHandler(renderizarPainelUsuarioHomeDepatri_)
    .withFailureHandler(function() {
      if (box) box.innerHTML = '<div class="depatri-home-profile-note text-danger">Não foi possível carregar os indicadores da Home.</div>';
    })
    .obterPainelUsuarioHomeDepatri(usuarioAtual.login);

    + '    <div>' + escHtmlDepatri_(texto || '') + '</div></div>'
    + '  </div>'
    + '</div>';

function escHtmlDepatri_(texto) {
  return String(texto == null ? '' : texto)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function mostrarTelaHomeDepatri_() {
  var principal = document.getElementById('telaPrincipal');
  if (principal) principal.classList.add('tela-ativa');

  var todasAsTelas = document.querySelectorAll('.tela-sistema');
  Array.prototype.forEach.call(todasAsTelas, function(tela) {
    if (['telaPrincipal', 'telaLogin', 'telaCadastro', 'telaTrocaSenha', 'telaRecuperarSenha'].indexOf(tela.id) === -1) {
      tela.style.display = 'none';
      tela.classList.remove('tela-ativa');
    }
  });

  var home = document.getElementById('modHomeDepatri');
  if (home) {
    home.style.display = 'block';
    home.classList.add('tela-ativa');
  }
}

function cardHomeDepatri_(cfg) {
  var disabled = cfg.permitido === false;
  if (disabled) return '';
  var action = cfg.onclick || '';
  var busca = [cfg.titulo || '', cfg.descricao || ''].join(' ');
  return ''
    + '<div class="depatri-module-card" role="button" tabindex="0" aria-label="Abrir ' + escHtmlDepatri_(cfg.titulo || 'módulo') + '"'
    + ' data-home-busca="' + escHtmlDepatri_(busca) + '" onclick="' + action + '" onkeydown="acionarCardHomeDepatri_(event, this)">'
    + '  <div class="depatri-module-icon"><i class="fas ' + escHtmlDepatri_(cfg.icone || 'fa-folder') + '"></i></div>'
    + '  <div class="depatri-module-title">' + escHtmlDepatri_(cfg.titulo || '') + '</div>'
    + (cfg.descricao ? '<div class="depatri-module-desc">' + escHtmlDepatri_(cfg.descricao) + '</div>' : '')
    + '</div>';
}

function acionarCardHomeDepatri_(evento, card) {
  if (!evento || !card) return;
  if (evento.key !== 'Enter' && evento.key !== ' ') return;
  evento.preventDefault();
  card.click();
}

function filtrarModulosHomeDepatri_(valor) {
  var termo = normalizarDepatriHome_(valor || '');
  var cards = document.querySelectorAll('#depatriHomeGrid > .depatri-module-card');
  var visiveis = 0;
  Array.prototype.forEach.call(cards, function(card) {
    var conteudo = normalizarDepatriHome_(card.getAttribute('data-home-busca') || card.textContent || '');
    var mostrar = !termo || conteudo.indexOf(termo) > -1;
    card.hidden = !mostrar;
    if (mostrar) visiveis++;
  });

  var vazio = document.getElementById('depatriPesquisaModuloVazia');
  if (vazio) vazio.hidden = visiveis > 0;
}

  var container = document.getElementById('mod4');
  if (!container || !DEPATRI_MODO_DESENV) return;

  var antigo = document.getElementById('avisoModoDesenvDepatri');
  if (antigo) antigo.remove();

  var header = container.querySelector('.border-bottom.border-warning');
  if (header) {
    var texto = DEPATRI_MODO_DESENV === 'edicao'
      ? 'Nesta área devem aparecer somente demandas pendentes. Antes de editar, confira se a ocorrência selecionada corresponde à demanda correta.'
      : 'Use esta área para cadastrar uma nova demanda ativa. Confira os dados obrigatórios antes de salvar.';
    header.insertAdjacentHTML('afterend', '<div id="avisoModoDesenvDepatri">' + htmlAvisoDepatri_('ATENÇÃO', texto, 'fa-triangle-exclamation') + '</div>');
  }

  var filtroStatus = document.getElementById('desenvFiltroStatus');
  if (filtroStatus && DEPATRI_MODO_DESENV === 'edicao') {
    filtroStatus.value = 'PENDENTES';
    filtroStatus.disabled = true;
  }

  var row = container.querySelector('.row.g-4');
  if (row && row.children && row.children.length >= 2) {
    var colForm = row.children[0];
    var colLista = row.children[1];
    if (DEPATRI_MODO_DESENV === 'cadastro') {
      colForm.className = 'col-12';
      colLista.style.display = 'none';
      try { novaDemandaDesenv(); } catch (e) {}
    } else {
      colForm.className = 'col-lg-5';
      colLista.style.display = '';
      try { carregarListaDemandasDesenv(); } catch (e) {}
    }
  }
}

function demandaPendenteDepatri_(item) {
  var st = normalizarDepatriHome_((item && item.status) || 'PENDENTE');
  if (!st || st === 'PENDENTE') return true;
  if (st.indexOf('CONCLUID') > -1 || st.indexOf('FINALIZ') > -1 || st.indexOf('EVOLUID') > -1 || st.indexOf('NAO EVOL') > -1) return false;
  return true;
}

if (typeof carregarListaDemandasDesenv === 'function' && !window.__depatriCarregarListaDesenvBase) {
  window.__depatriCarregarListaDesenvBase = carregarListaDemandasDesenv;
  carregarListaDemandasDesenv = function() {
    if (DEPATRI_MODO_DESENV === 'edicao') {
      var filtroStatus = document.getElementById('desenvFiltroStatus');
      if (filtroStatus) filtroStatus.value = 'PENDENTES';
    }
    return window.__depatriCarregarListaDesenvBase.apply(this, arguments);
  };
}

if (typeof renderTabelaDemandasDesenv === 'function' && !window.__depatriRenderTabelaDesenvBase) {
  window.__depatriRenderTabelaDesenvBase = renderTabelaDemandasDesenv;
  renderTabelaDemandasDesenv = function(demandas) {
    if (DEPATRI_MODO_DESENV !== 'edicao') {
      return window.__depatriRenderTabelaDesenvBase.apply(this, arguments);
    }

    var lista = (demandas || []).filter(demandaPendenteDepatri_);
    var box = document.getElementById('desenvTabelaDemandas');
    if (!box) return;
    if (!lista.length) {
      box.innerHTML = '<div class="text-muted small">Nenhuma demanda pendente encontrada para edição.</div>';
      return;
    }

    var html = '<div class="table-responsive"><table class="table table-dark table-hover align-middle small"><thead><tr><th>Ocorrência</th><th>Data</th><th>Equipe</th><th>Status</th><th></th></tr></thead><tbody>';
    lista.forEach(function(item) {
      var num = String(item.numOcorrencia || '').replace(/'/g, "\\'");
      html += '<tr>'
        + '<td><div class="fw-bold">' + escHtmlDepatri_(item.numOcorrencia || '') + '</div><div class="text-muted">' + escHtmlDepatri_(item.tipoOcorrencia || '') + '</div></td>'
        + '<td>' + escHtmlDepatri_(item.data || '') + '<br><span class="text-muted">' + escHtmlDepatri_(item.hora || '') + '</span></td>'
        + '<td>' + escHtmlDepatri_(item.equipe || '') + '</td>'
        + '<td><span class="badge bg-warning text-dark">' + escHtmlDepatri_(item.status || 'PENDENTE') + '</span></td>'
        + '<td class="text-end"><button class="btn btn-sm btn-warning" onclick="abrirDemandaDesenv(\'' + num + '\')"><i class="fas fa-pen"></i> Editar</button></td>'
        + '</tr>';
    });
    html += '</tbody></table></div>';
    box.innerHTML = html;
  };
}

function iniciarWatcherModoServicoExtraDepatri_() {
  var tentativas = 0;
  var timer = setInterval(function() {
    tentativas++;
    if (document.getElementById('extraMinhasHorasLista') || document.getElementById('extraEquipe') || tentativas > 30) {
      aplicarModoServicoExtraDepatri_();
      clearInterval(timer);
    }
  }, 250);
}

function aplicarModoServicoExtraDepatri_() {
  var container = document.getElementById('mod6');
  if (!container) return;

  var total = document.getElementById('extraCicloAtualTotal');
  if (total) {
    var resumo = total.closest ? total.closest('.row.g-3.mb-4') : null;
    if (resumo) resumo.style.display = 'none';
  }

  var antigo = document.getElementById('avisoModoServicoDepatri');
  if (antigo) antigo.remove();
  var h3 = container.querySelector('h3');
  if (h3) {
    h3.insertAdjacentHTML('afterend', '<div id="avisoModoServicoDepatri">' + htmlAvisoDepatri_('ATENÇÃO', 'A quantidade total de horas extras não fica mais visível nesta aba. Use os cards da home para cadastrar relatório ou visualizar a lista individual.', 'fa-clock') + '</div>');
  }

  var listBox = document.getElementById('extraMinhasHorasLista');
  var listCard = listBox && listBox.closest ? listBox.closest('.card') : null;
  var formEl = document.getElementById('extraEquipe');
  var formCard = formEl && formEl.closest ? formEl.closest('.card') : null;

  if (DEPATRI_MODO_SERVICO_EXTRA === 'lista') {
    if (listCard) listCard.style.display = '';
    if (formCard) formCard.style.display = 'none';
  } else if (DEPATRI_MODO_SERVICO_EXTRA === 'cadastro') {
    if (listCard) listCard.style.display = 'none';
    if (formCard) formCard.style.display = '';
  }
}

function iniciarWatcherModoAdministrativoDepatri_() {
  var tentativas = 0;
  var timer = setInterval(function() {
    tentativas++;
    if (document.getElementById('admPendenciasBox') || document.getElementById('admTabelaCautelas') || tentativas > 30) {
      aplicarModoAdministrativoDepatri_();
      clearInterval(timer);
    }
  }, 250);
}

function aplicarModoAdministrativoDepatri_() {
  var container = document.getElementById('modAdministrativo');
  if (!container || !DEPATRI_MODO_ADMINISTRATIVO) return;

  var pend = document.getElementById('admPendenciasBox');
  var table = document.getElementById('admTabelaCautelas');
  var tableCard = table && table.closest ? table.closest('.card') : null;
  var cadastro = document.getElementById('admCadastroCautelaBox');

  var antigo = document.getElementById('avisoModoAdministrativoDepatri');
  if (antigo) antigo.remove();
  var header = container.querySelector('.border-bottom.border-warning');
  if (header) {
    var texto = 'Área administrativa do DEPATRI.';
    if (DEPATRI_MODO_ADMINISTRATIVO === 'pendencias') texto = 'Consulta de pendências de produtividade das unidades avaliadas.';
    if (DEPATRI_MODO_ADMINISTRATIVO === 'cadastrarCautela') texto = 'Área destinada ao cadastro de cautela e geração de documento quando aplicável.';
    if (DEPATRI_MODO_ADMINISTRATIVO === 'acervo') texto = 'Visão geral do acervo liberada somente para ADMIN / ADMINISTRATIVO / DIREÇÃO.';
    header.insertAdjacentHTML('afterend', '<div id="avisoModoAdministrativoDepatri">' + htmlAvisoDepatri_('ATENÇÃO', texto, 'fa-circle-info') + '</div>');
  }

  if (DEPATRI_MODO_ADMINISTRATIVO === 'pendencias') {
    if (pend) pend.style.display = '';
    if (tableCard) tableCard.style.display = 'none';
    if (cadastro) cadastro.style.display = 'none';
  }

  if (DEPATRI_MODO_ADMINISTRATIVO === 'cadastrarCautela') {
    if (pend) pend.style.display = 'none';
    if (tableCard) tableCard.style.display = 'none';
    if (cadastro) cadastro.style.display = '';
  }

  if (DEPATRI_MODO_ADMINISTRATIVO === 'acervo') {
    if (!usuarioPodeVerAcervoCautelasDepatri_()) {
      if (pend) pend.style.display = 'none';
      if (tableCard) tableCard.style.display = 'none';
      if (cadastro) cadastro.style.display = 'none';
      container.insertAdjacentHTML('beforeend', htmlAvisoDepatri_('ACESSO RESTRITO', 'A visão geral do Acervo é liberada somente para ADMIN / ADMINISTRATIVO / DIREÇÃO.', 'fa-lock'));
      return;
    }
    if (pend) pend.style.display = 'none';
    if (tableCard) tableCard.style.display = '';
    if (cadastro) cadastro.style.display = 'none';
  }
}

function renderCardsTiposDocumentoMod3Depatri() {
  if (typeof cacheMod3 === 'undefined') return;
  var select = document.getElementById('tipoOficio');
  if (!select) return;
  var tipos = [];
  try { tipos = tiposDocumentoPermitidosPerfilMod3_(cacheMod3.tiposDocumento || []); } catch (e) { tipos = cacheMod3.tiposDocumento || []; }

  var wrap = document.getElementById('mod3TipoCards');
  if (!wrap) {
    wrap = document.createElement('div');
    wrap.id = 'mod3TipoCards';
    wrap.className = 'depatri-subgrid mb-3';
    var card = select.closest ? select.closest('.card') : null;
    if (card) card.insertBefore(wrap, select);
  }

  wrap.innerHTML = (tipos || []).map(function(item) {
    var nome = item.nome || item.id || 'Documento';
    var id = String(item.id || '').replace(/'/g, "\\'");
    return cardHomeDepatri_({
      titulo: nome,
      icone: 'fa-file-lines',
      descricao: 'Abrir formulário deste documento',
      onclick: "selecionarTipoDocumentoMod3Depatri('" + id + "')",
      permitido: true
    });
  }).join('');

  select.style.display = 'none';
  var label = select.previousElementSibling;
  if (label && label.tagName && label.tagName.toLowerCase() === 'h5') {
    label.innerHTML = '1. Tipo de Documento <span class="badge bg-warning text-dark ms-2">cards independentes</span>';
  }
}

function selecionarTipoDocumentoMod3Depatri(id) {
  var select = document.getElementById('tipoOficio');
  if (!select) return;
  select.value = id;
  try { mudarFormularioOficio(); } catch (e) {}
  var area = document.getElementById('areaCamposOficio');
  if (area) area.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

    document.getElementById('telaLogin').classList.remove('tela-ativa');
    document.getElementById('telaCadastro').classList.remove('tela-ativa');
    document.getElementById('telaRecuperarSenha').classList.remove('tela-ativa');
    document.getElementById('telaTrocaSenha').classList.remove('tela-ativa');
    document.getElementById('telaPrincipal').classList.add('tela-ativa');

    var userInfo = document.getElementById('userInfo');
    if (userInfo) {
      var identificacaoTopo = [usuarioAtual.cargo || '', usuarioAtual.nome || ''].filter(Boolean).join(' ');
      var perfilTopo = usuarioAtual.perfil || usuarioAtual.delegacia || usuarioAtual.lotacao || '';
      userInfo.innerHTML = '<span class="depatri-topbar-user-primary">' + escHtmlDepatri_(identificacaoTopo || 'USUÁRIO') + '</span>'
        + '<span class="depatri-topbar-user-secondary">' + escHtmlDepatri_(perfilTopo) + '</span>';

// ============================================================================
// ESTABILIZAÇÃO DO CARREGAMENTO DO MÓDULO 4B
// Evita spinner infinito e apresenta o erro de forma recuperável.
// ============================================================================
var montarInterfaceMod4BaseConsolidado_ = montarInterfaceMod4;
montarInterfaceMod4 = function() {
    window.__desenvMod4CargaSeq = Number(window.__desenvMod4CargaSeq || 0) + 1;
    var seq = window.__desenvMod4CargaSeq;
    var retorno = montarInterfaceMod4BaseConsolidado_.apply(this, arguments);

    setTimeout(function() {
        if (seq !== window.__desenvMod4CargaSeq) return;
        var container = document.getElementById('mod4');
        if (!container) return;
        var texto = String(container.textContent || '');
        var aindaCarregando = texto.indexOf('Carregando módulo Desenvolvimento de Demandas Ativas') > -1;
        if (!aindaCarregando) return;

        container.innerHTML = ''
            + '<div class="alert alert-danger border-danger">'
            + '<div class="fw-bold mb-2"><i class="fas fa-triangle-exclamation"></i> O módulo não respondeu.</div>'
            + '<div class="small mb-3">Verifique se o MAESTRO.gs contém a função <code>carregarConfigDesenvDemandas</code> e se a implantação foi atualizada.</div>'
            + '<button class="btn btn-sm btn-outline-light" onclick="montarInterfaceMod4()"><i class="fas fa-rotate"></i> Tentar novamente</button>'
            + '</div>';
    }, 25000);

    return retorno;
};
