function inicializarMapaSirp() {
    if (!window.L) {
        var mapaEl = document.getElementById('sirpMapa');
        if (mapaEl) mapaEl.innerHTML = '<div class="p-4 text-danger">Leaflet não foi carregado. Confira o INDEX.html.</div>';
        return;
    }

    if (SIRP_STATE.mapa) {
        setTimeout(function() { SIRP_STATE.mapa.invalidateSize(); }, 200);
        return;
    }

    SIRP_STATE.mapa = L.map('sirpMapa', {
        zoomControl: true,
        preferCanvas: true
    }).setView(SIRP_CONFIG_FRONT.CENTRO_PADRAO, 13);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 20,
        attribution: '&copy; OpenStreetMap'
    }).addTo(SIRP_STATE.mapa);

    SIRP_STATE.rotaLayer = L.layerGroup().addTo(SIRP_STATE.mapa);
    SIRP_STATE.cameraLayer = L.layerGroup().addTo(SIRP_STATE.mapa);

    SIRP_STATE.mapa.on('click', function(evt) {
        limparSelecaoEnderecoSirp_(true);
        definirOrigemSirp(evt.latlng.lat, evt.latlng.lng, 'MAPA', '');
        mostrarMsgSirp_('Localização atual marcada no mapa. Escolha o raio e clique em ANALISAR.', 'secondary');
    });
}

function carregarDemandasSirp() {
    var select = document.getElementById('sirpDemanda');
    if (select) select.innerHTML = '<option value="">Carregando demandas...</option>';

    google.script.run
        .withSuccessHandler(function(ret) {
            SIRP_STATE.demandas = (ret && ret.demandas) || [];
            var html = '<option value="">Vincular demanda/ocorrência — opcional</option>';

            SIRP_STATE.demandas.forEach(function(item, idx) {
                var label = item.procedimentoConcat || ('Linha ' + item.rowIndex);
                if (item.bairro) label += ' — ' + item.bairro;
                html += '<option value="' + idx + '">' + escSirp(label) + '</option>';
            });

            if (select) select.innerHTML = html;
        })
        .withFailureHandler(function(erro) {
            if (select) select.innerHTML = '<option value="">Não foi possível carregar as demandas</option>';
            mostrarMsgSirp_('Erro ao carregar demandas: ' + ((erro && erro.message) || erro), 'danger');
        })
        .obterDemandasSirp(usuarioAtual.login);
}

function carregarCamerasSirp_() {
    google.script.run
        .withSuccessHandler(function(ret) {
            SIRP_STATE.cameras = (ret && ret.cameras) || [];
            SIRP_STATE.podeEditarCameras = !!(ret && ret.podeEditar);
        })
        .withFailureHandler(function(erro) {
            mostrarMsgSirp_('Erro ao carregar câmeras: ' + ((erro && erro.message) || erro), 'danger');
        })
        .obterCamerasSirp(usuarioAtual.login);
}

function obterRaioSelecionadoSirp_() {
    var raio = Number((document.getElementById('sirpRaio') || {}).value || 0);
    return SIRP_CONFIG_FRONT.RAIOS_PERMITIDOS.indexOf(raio) > -1 ? raio : 0;
}

function atualizarRaioVisualSirp_() {
    var raio = obterRaioSelecionadoSirp_();
    if (!raio || !SIRP_STATE.origem || !SIRP_STATE.mapa) return;

    if (SIRP_STATE.raioCircle) {
        SIRP_STATE.raioCircle.setRadius(raio);
    } else {
        criarCirculoRaioSirp_(raio);
    }

    SIRP_STATE.mapa.fitBounds(SIRP_STATE.raioCircle.getBounds(), { padding: [25, 25] });
}

function usarGpsSirp() {
    if (!navigator.geolocation) {
        mostrarMsgSirp_('GPS não disponível neste navegador. Informe um endereço.', 'danger');
        return;
    }

    mostrarMsgSirp_('Obtendo sua localização atual...', 'secondary');

    navigator.geolocation.getCurrentPosition(
        function(pos) {
            limparSelecaoEnderecoSirp_(true);
            definirOrigemSirp(pos.coords.latitude, pos.coords.longitude, 'GPS', '');
            mostrarMsgSirp_('Localização atual obtida. Escolha o raio e clique em ANALISAR.', 'success');
        },
        function(erro) {
            var motivo = erro && erro.code === 1
                ? 'A permissão de localização foi negada.'
                : 'Não foi possível obter sua localização.';
            mostrarMsgSirp_(motivo + ' Informe um endereço.', 'danger');
        },
        { enableHighAccuracy: true, timeout: 15000, maximumAge: 20000 }
    );
}

function limparSelecaoEnderecoSirp_(limparCampo) {
    if (SIRP_STATE.timerEndereco) {
        clearTimeout(SIRP_STATE.timerEndereco);
        SIRP_STATE.timerEndereco = null;
    }

    SIRP_STATE.sequenciaEndereco++;
    SIRP_STATE.enderecoSelecionado = null;
    SIRP_STATE.sugestoesEndereco = [];
    SIRP_STATE.sugestaoAtiva = -1;
    SIRP_STATE.ultimoEnderecoAnalisado = '';

    if (limparCampo) {
        var input = document.getElementById('sirpEndereco');
        if (input) input.value = '';
    }

    fecharSugestoesEnderecoSirp_();
}

function aoDigitarEnderecoSirp_() {
    var input = document.getElementById('sirpEndereco');
    var consulta = String((input || {}).value || '').replace(/\s+/g, ' ').trim();

    if (SIRP_STATE.timerEndereco) clearTimeout(SIRP_STATE.timerEndereco);

    SIRP_STATE.enderecoSelecionado = null;
    SIRP_STATE.ultimoEnderecoAnalisado = '';
    SIRP_STATE.sugestaoAtiva = -1;

    var sequencia = ++SIRP_STATE.sequenciaEndereco;

    if (consulta.length < 4) {
        SIRP_STATE.sugestoesEndereco = [];
        fecharSugestoesEnderecoSirp_();
        return;
    }

    renderizarSugestoesEnderecoSirp_(null, 'Procurando endereços...');

    SIRP_STATE.timerEndereco = setTimeout(function() {
        consultarSugestoesEnderecoSirp_(consulta)
            .then(function(lista) {
                if (sequencia !== SIRP_STATE.sequenciaEndereco) return;
                SIRP_STATE.sugestoesEndereco = lista;
                renderizarSugestoesEnderecoSirp_(lista);
            })
            .catch(function(erro) {
                if (sequencia !== SIRP_STATE.sequenciaEndereco) return;
                SIRP_STATE.sugestoesEndereco = [];
                renderizarSugestoesEnderecoSirp_([], 'Não foi possível consultar o endereço.');
                mostrarMsgSirp_((erro && erro.message) || String(erro), 'danger');
            });
    }, 650);
}

function consultarSugestoesEnderecoSirp_(consulta) {
    return new Promise(function(resolve, reject) {
        google.script.run
            .withSuccessHandler(function(ret) {
                resolve((ret && ret.sugestoes) || []);
            })
            .withFailureHandler(function(erro) {
                reject(new Error(
                    (erro && erro.message)
                    || 'O serviço de busca de endereços não respondeu.'
                ));
            })
            .buscarSugestoesEnderecoSirp(usuarioAtual.login, consulta);
    });
}

function renderizarSugestoesEnderecoSirp_(lista, mensagem) {
    var box = document.getElementById('sirpSugestoesEndereco');
    if (!box) return;

    SIRP_STATE.sugestaoAtiva = -1;

    if (mensagem) {
        box.innerHTML = '<div class="sirp-sugestao-info">' + escSirp(mensagem) + '</div>';
        abrirSugestoesEnderecoSirp_();
        return;
    }

    if (!lista || !lista.length) {
        box.innerHTML = '<div class="sirp-sugestao-info">Nenhum endereço encontrado. Acrescente bairro, cidade ou CEP.</div>';
        abrirSugestoesEnderecoSirp_();
        return;
    }

    box.innerHTML = lista.map(function(item, indice) {
        var meta = item.correspondenciaParcial
            ? 'Correspondência aproximada'
            : 'Endereço localizado';

        return ''
            + '<button type="button" class="sirp-sugestao" role="option" data-indice="' + indice + '"'
            + ' onclick="selecionarSugestaoEnderecoSirp(' + indice + ')">'
            + '  <span class="sirp-sugestao-icone"><i class="fas fa-map-marker-alt"></i></span>'
            + '  <span>'
            + '    <span class="sirp-sugestao-endereco">' + escSirp(item.endereco) + '</span>'
            + '    <span class="sirp-sugestao-meta">' + escSirp(meta) + '</span>'
            + '  </span>'
            + '</button>';
    }).join('');

    abrirSugestoesEnderecoSirp_();
}

function abrirSugestoesEnderecoSirp_() {
    var box = document.getElementById('sirpSugestoesEndereco');
    if (box) box.classList.add('aberto');
}

function fecharSugestoesEnderecoSirp_() {
    var box = document.getElementById('sirpSugestoesEndereco');
    if (box) box.classList.remove('aberto');
    SIRP_STATE.sugestaoAtiva = -1;
}

function navegarSugestoesEnderecoSirp_(direcao) {
    var botoes = Array.prototype.slice.call(
        document.querySelectorAll('#sirpSugestoesEndereco .sirp-sugestao')
    );
    if (!botoes.length) return;

    abrirSugestoesEnderecoSirp_();

    var novoIndice = SIRP_STATE.sugestaoAtiva + direcao;
    if (novoIndice < 0) novoIndice = botoes.length - 1;
    if (novoIndice >= botoes.length) novoIndice = 0;
    SIRP_STATE.sugestaoAtiva = novoIndice;

    botoes.forEach(function(botao, indice) {
        botao.classList.toggle('ativa', indice === novoIndice);
        botao.setAttribute('aria-selected', indice === novoIndice ? 'true' : 'false');
    });

    botoes[novoIndice].scrollIntoView({ block: 'nearest' });
}

function selecionarSugestaoEnderecoSirp(indice) {
    var item = SIRP_STATE.sugestoesEndereco[Number(indice)];
    if (!item) return;

    var input = document.getElementById('sirpEndereco');
    if (input) input.value = item.endereco;

    SIRP_STATE.enderecoSelecionado = item;
    SIRP_STATE.ultimoEnderecoAnalisado = item.endereco;
    definirOrigemSirp(item.lat, item.lng, 'ENDERECO', item.endereco);
    fecharSugestoesEnderecoSirp_();
    mostrarMsgSirp_('Endereço confirmado. Escolha o raio e clique em ANALISAR.', 'success');
}

function buscarEnderecoSirp() {
    return buscarEnderecoSirp_().then(function() {
        mostrarMsgSirp_('Endereço definido como localização atual.', 'success');
        return SIRP_STATE.origem;
    });
}

function buscarEnderecoSirp_() {
    var endereco = String((document.getElementById('sirpEndereco') || {}).value || '').trim();

    if (!endereco) {
        return Promise.reject(new Error('Informe um endereço ou use o GPS.'));
    }

    var selecionado = SIRP_STATE.enderecoSelecionado;
    if (
        selecionado &&
        normalizarSirpFront_(selecionado.endereco) === normalizarSirpFront_(endereco)
    ) {
        definirOrigemSirp(selecionado.lat, selecionado.lng, 'ENDERECO', selecionado.endereco);
        SIRP_STATE.ultimoEnderecoAnalisado = selecionado.endereco;
        return Promise.resolve(SIRP_STATE.origem);
    }

    mostrarMsgSirp_('Localizando o endereço...', 'secondary');

    return consultarSugestoesEnderecoSirp_(endereco)
        .then(function(lista) {
            SIRP_STATE.sugestoesEndereco = lista || [];

            if (!lista || !lista.length) {
                renderizarSugestoesEnderecoSirp_([]);
                throw new Error('Endereço não encontrado. Acrescente bairro, cidade ou CEP.');
            }

            if (lista.length === 1) {
                selecionarSugestaoEnderecoSirp(0);
                return SIRP_STATE.origem;
            }

            renderizarSugestoesEnderecoSirp_(lista);
            throw new Error('Selecione um dos endereços sugeridos antes de analisar.');
        });
}

function definirOrigemSirp(lat, lng, fonte, endereco) {
    lat = Number(lat);
    lng = Number(lng);

    if (isNaN(lat) || isNaN(lng)) {
        mostrarMsgSirp_('Coordenadas inválidas.', 'danger');
        return;
    }

    SIRP_STATE.origem = { lat: lat, lng: lng };
    SIRP_STATE.fonteLocalizacao = fonte || '';
    SIRP_STATE.enderecoBuscado = endereco || '';
    SIRP_STATE.resultadosTodos = [];
    SIRP_STATE.resultados = [];
    SIRP_STATE.rotas = [];
    SIRP_STATE.grafoRota = null;
    SIRP_STATE.analiseExecutada = false;
    SIRP_STATE.ultimaAnaliseSalva = false;

    if (!SIRP_STATE.mapa) inicializarMapaSirp();

    var origemIcon = L.divIcon({
        className: 'sirp-marker-wrap',
        html: '<div class="sirp-origem-pin"></div>',
        iconSize: [30, 34],
        iconAnchor: [15, 30],
        popupAnchor: [0, -30]
    });

    if (SIRP_STATE.origemMarker) {
        SIRP_STATE.origemMarker.setLatLng([lat, lng]);
        SIRP_STATE.origemMarker.setIcon(origemIcon);
    } else {
        SIRP_STATE.origemMarker = L.marker([lat, lng], { icon: origemIcon }).addTo(SIRP_STATE.mapa);
    }

    SIRP_STATE.origemMarker.bindPopup(
        '<strong>LOCALIZAÇÃO ATUAL</strong><br>'
        + 'Origem: ' + escSirp(fonte || 'MAPA')
    );

    var raio = obterRaioSelecionadoSirp_();
    if (raio) {
        criarCirculoRaioSirp_(raio);
        SIRP_STATE.mapa.fitBounds(SIRP_STATE.raioCircle.getBounds(), { padding: [25, 25] });
    } else {
        if (SIRP_STATE.raioCircle) {
            SIRP_STATE.mapa.removeLayer(SIRP_STATE.raioCircle);
            SIRP_STATE.raioCircle = null;
        }
        SIRP_STATE.mapa.setView([lat, lng], 17);
    }

    if (SIRP_STATE.cameraLayer) SIRP_STATE.cameraLayer.clearLayers();
    if (SIRP_STATE.rotaLayer) SIRP_STATE.rotaLayer.clearLayers();
    var painelFiltro = document.getElementById('sirpFiltrosCamera');
    if (painelFiltro) painelFiltro.classList.remove('visivel');
    renderizarTextoTecnicoSirp_([]);
    renderizarResultadoSirp([]);
}

function criarCirculoRaioSirp_(raio) {
    if (!SIRP_STATE.origem || !SIRP_STATE.mapa) return;

    if (SIRP_STATE.raioCircle) {
        SIRP_STATE.raioCircle.setLatLng([SIRP_STATE.origem.lat, SIRP_STATE.origem.lng]);
        SIRP_STATE.raioCircle.setRadius(raio);
        return;
    }

    SIRP_STATE.raioCircle = L.circle([SIRP_STATE.origem.lat, SIRP_STATE.origem.lng], {
        radius: raio,
        color: '#8b949e',
        weight: 2,
        dashArray: '7 7',
        fillColor: '#8b949e',
        fillOpacity: 0.045
    }).addTo(SIRP_STATE.mapa);
}

function calcularDistanciaMetrosSirp(lat1, lon1, lat2, lon2) {
    var R = 6371000;
    var p1 = lat1 * Math.PI / 180;
    var p2 = lat2 * Math.PI / 180;
    var dp = (lat2 - lat1) * Math.PI / 180;
    var dl = (lon2 - lon1) * Math.PI / 180;

    var a = Math.sin(dp / 2) * Math.sin(dp / 2)
        + Math.cos(p1) * Math.cos(p2)
        * Math.sin(dl / 2) * Math.sin(dl / 2);

    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function calcularAnguloSirp(lat1, lon1, lat2, lon2) {
    var p1 = lat1 * Math.PI / 180;
    var p2 = lat2 * Math.PI / 180;
    var dl = (lon2 - lon1) * Math.PI / 180;
    var y = Math.sin(dl) * Math.cos(p2);
    var x = Math.cos(p1) * Math.sin(p2) - Math.sin(p1) * Math.cos(p2) * Math.cos(dl);
    return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
}

function diferencaAngularSirp(a, b) {
    var diff = Math.abs(Number(a) - Number(b)) % 360;
    return diff > 180 ? 360 - diff : diff;
}

function classificarAcessoSirpFront_(valor) {
    var acesso = normalizarSirpFront_(valor);

    if (acesso === 'AGILIS') {
        return 'AGILIS';
    }

    if (!acesso || acesso === 'NAO INFORMADO' || acesso === 'DESCONHECIDO' || acesso === 'IGNORADO') {
        return 'NAO_INFORMADO';
    }

    if (
        acesso === 'SIM' ||
        acesso === 'S' ||
        acesso === 'TEM ACESSO' ||
        acesso === 'COM ACESSO' ||
        acesso === 'DISPONIVEL' ||
        acesso === 'COM_ACESSO'
    ) {
        return 'COM_ACESSO';
    }

    if (
        acesso === 'NAO' ||
        acesso === 'N' ||
        acesso === 'SEM ACESSO' ||
        acesso === 'INDISPONIVEL' ||
        acesso === 'SEM_ACESSO'
    ) {
        return 'SEM_ACESSO';
    }

    return 'NAO_INFORMADO';
}

function tipoCameraSirp_(valor) {
    var tipo = normalizarSirpFront_(valor);
    if (tipo.indexOf('LPR') > -1 || tipo.indexOf('OCR') > -1 || tipo.indexOf('PLACA') > -1) return 'LPR';
    if (tipo.indexOf('PTZ') > -1 || tipo.indexOf('DOME') > -1) return 'PTZ';
    if (
        tipo.indexOf('FOTOSSENSOR') > -1 ||
        tipo.indexOf('FOTO SENSOR') > -1 ||
        tipo.indexOf('RADAR') > -1 ||
        tipo.indexOf('FTLPC') > -1 ||
        tipo.indexOf('FTLZ') > -1
    ) return 'FOTOSSENSOR';
    return tipo || 'CÂMERA';
}

function chaveCameraSirp_(camera) {
    if (!camera) return '';
    var id = String(camera.idRegistro || '').trim();
    if (id) return 'ID:' + id;
    return 'LINHA:' + String(camera.rowIndex || '');
}

function obterCameraPorChaveSirp_(chave) {
    chave = String(chave || '');
    var grupos = [
        SIRP_STATE.cameras || [],
        SIRP_STATE.resultadosTodos || [],
        SIRP_STATE.resultados || []
    ];

    for (var g = 0; g < grupos.length; g++) {
        for (var i = 0; i < grupos[g].length; i++) {
            if (chaveCameraSirp_(grupos[g][i]) === chave) return grupos[g][i];
        }
    }
    return null;
}

function tiposCameraSelecionadosSirp_() {
    return Object.keys(SIRP_STATE.filtrosTipoCamera || {}).filter(function(tipo) {
        return !!SIRP_STATE.filtrosTipoCamera[tipo];
    });
}

function selecionarTodosTiposCameraSirp_() {
    SIRP_STATE.filtrosTipoCamera.LPR = true;
    SIRP_STATE.filtrosTipoCamera.PTZ = true;
    SIRP_STATE.filtrosTipoCamera.FOTOSSENSOR = true;

    ['sirpFiltroLpr', 'sirpFiltroPtz', 'sirpFiltroFotossensor'].forEach(function(id) {
        var campo = document.getElementById(id);
        if (campo) campo.checked = true;
    });
}

function alterarFiltroTipoCameraSirp_(tipo, marcado) {
    tipo = tipoCameraSirp_(tipo);
    if (!Object.prototype.hasOwnProperty.call(SIRP_STATE.filtrosTipoCamera, tipo)) return;

    SIRP_STATE.filtrosTipoCamera[tipo] = !!marcado;
    if (!tiposCameraSelecionadosSirp_().length) {
        SIRP_STATE.filtrosTipoCamera[tipo] = true;
        var ids = {
            LPR: 'sirpFiltroLpr',
            PTZ: 'sirpFiltroPtz',
            FOTOSSENSOR: 'sirpFiltroFotossensor'
        };
        var campo = document.getElementById(ids[tipo]);
        if (campo) campo.checked = true;
        mostrarMsgSirp_('Mantenha pelo menos um tipo de câmera selecionado.', 'danger');
        return;
    }

    if (SIRP_STATE.analiseExecutada) {
        aplicarFiltroTiposCameraSirp_(false);
    }
}

function aplicarFiltroTiposCameraSirp_(salvarResultado) {
    var selecionados = SIRP_STATE.filtrosTipoCamera || {};
    var todosSelecionados = !!(
        selecionados.LPR &&
        selecionados.PTZ &&
        selecionados.FOTOSSENSOR
    );
    SIRP_STATE.resultados = (SIRP_STATE.resultadosTodos || []).filter(function(camera) {
        return todosSelecionados || !!selecionados[tipoCameraSirp_(camera.tipoCamera)];
    });

    SIRP_STATE.rotas = gerarRotasAteCamerasSirp_(SIRP_STATE.resultados);
    renderizarRotasSirp_(SIRP_STATE.rotas);
    renderizarCamerasSirp(SIRP_STATE.resultados);
    renderizarResultadoSirp(SIRP_STATE.resultados);
    renderizarTextoTecnicoSirp_(SIRP_STATE.resultados);

    var painelFiltro = document.getElementById('sirpFiltrosCamera');
    if (painelFiltro) painelFiltro.classList.add('visivel');

    if (salvarResultado) salvarAnaliseSirp();
}

function corAcessoSirp_(status) {
    if (status === 'COM_ACESSO') return '#24c96b';
    if (status === 'SEM_ACESSO') return '#ef4444';
    if (status === 'AGILIS') return '#f3cf63';
    return '#8b949e';
}

function rotuloAcessoSirp_(status) {
    if (status === 'COM_ACESSO') return 'TEMOS ACESSO';
    if (status === 'SEM_ACESSO') return 'SEM ACESSO';
    if (status === 'AGILIS') return 'AGILIS';
    return 'ACESSO NÃO INFORMADO';
}

function svgCameraSirp_(tipo, status, classeExtra) {
    tipo = tipoCameraSirp_(tipo);
    var cor = corAcessoSirp_(status);
    var desenho;

    if (tipo === 'LPR') {
        desenho = ''
            + '<path d="M13 18h23l7 6-4 10H16l-7-6z" fill="#eef2f6" stroke="#10151c" stroke-width="2"/>'
            + '<circle cx="34" cy="27" r="5" fill="#111827" stroke="' + cor + '" stroke-width="2"/>'
            + '<circle cx="34" cy="27" r="2" fill="' + cor + '"/>'
            + '<path d="M15 34v6M35 34v6" stroke="#d7dde5" stroke-width="3" stroke-linecap="round"/>';
    } else {
        desenho = ''
            + '<path d="M14 18h28v9H14z" fill="#e7ebf0" stroke="#111827" stroke-width="2"/>'
            + '<path d="M16 27h24c0 10-5 16-12 16S16 37 16 27z" fill="#d7dde5" stroke="#111827" stroke-width="2"/>'
            + '<circle cx="28" cy="33" r="6" fill="#111827" stroke="' + cor + '" stroke-width="2"/>'
            + '<circle cx="28" cy="33" r="2.4" fill="' + cor + '"/>';
    }

    return ''
        + '<svg class="sirp-camera-svg ' + escSirp(classeExtra || '') + '" width="54" height="54" viewBox="0 0 56 56" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">'
        + '<circle cx="28" cy="28" r="25" fill="#101720" stroke="' + cor + '" stroke-width="4"/>'
        + desenho
        + '<rect x="16" y="44" width="24" height="9" rx="4.5" fill="' + cor + '"/>'
        + '<text x="28" y="51" text-anchor="middle" font-family="Arial,sans-serif" font-size="7" font-weight="800" fill="#fff">' + escSirp(tipo) + '</text>'
        + '</svg>';
}

function criarIconeCameraSirp_(camera) {
    var status = classificarAcessoSirpFront_(camera.statusAcesso || camera.acessoNuip);
    return L.divIcon({
        className: 'sirp-marker-wrap',
        html: svgCameraSirp_(camera.tipoCamera, status, ''),
        iconSize: [54, 54],
        iconAnchor: [27, 27],
        popupAnchor: [0, -25]
    });
}

function camerasDentroRaioSirp_(raio) {
    if (!SIRP_STATE.origem) return [];

    return (SIRP_STATE.cameras || []).map(function(camera) {
        var distancia = calcularDistanciaMetrosSirp(
            SIRP_STATE.origem.lat,
            SIRP_STATE.origem.lng,
            Number(camera.latitudeCamera),
            Number(camera.longitudeCamera)
        );

        return Object.assign({}, camera, {
            distanciaMetros: Math.round(distancia),
            statusAcesso: classificarAcessoSirpFront_(camera.statusAcesso || camera.acessoNuip),
            tipoCameraNormalizado: tipoCameraSirp_(camera.tipoCamera),
            rotaEncontrada: false,
            rotaSirp: null
        });
    }).filter(function(camera) {
        return camera.distanciaMetros <= raio;
    }).sort(function(a, b) {
        return a.distanciaMetros - b.distanciaMetros;
    });
}

function calcularCamerasProximasSirp() {
    if (SIRP_STATE.carregando) return;

    var raio = obterRaioSelecionadoSirp_();
    if (!raio) {
        mostrarMsgSirp_('Escolha primeiro o raio de 200, 500 ou 1.000 metros.', 'danger');
        return;
    }

    var endereco = String((document.getElementById('sirpEndereco') || {}).value || '').trim();
    var precisaBuscarEndereco = endereco && (
        !SIRP_STATE.origem ||
        SIRP_STATE.fonteLocalizacao !== 'ENDERECO' ||
        SIRP_STATE.ultimoEnderecoAnalisado !== endereco
    );

    var prepararOrigem;
    if (precisaBuscarEndereco) {
        prepararOrigem = buscarEnderecoSirp_();
    } else if (SIRP_STATE.origem) {
        prepararOrigem = Promise.resolve(SIRP_STATE.origem);
    } else {
        mostrarMsgSirp_('Informe um endereço ou use sua localização atual pelo GPS.', 'danger');
        return;
    }

    var origemPreparada = false;

    definirCarregandoSirp_(true);
    mostrarMsgSirp_('Gerando os caminhos possíveis...', 'secondary');

    prepararOrigem
        .then(function() {
            origemPreparada = true;
            criarCirculoRaioSirp_(raio);
            SIRP_STATE.resultadosTodos = camerasDentroRaioSirp_(raio);
            return obterMalhaViariaSirp_(SIRP_STATE.origem, raio);
        })
        .then(function(dadosOsm) {
            gerarTrechosAcessiveisSirp_(dadosOsm, SIRP_STATE.origem, raio);
            selecionarTodosTiposCameraSirp_();
            SIRP_STATE.analiseExecutada = true;
            SIRP_STATE.ultimaAnaliseSalva = false;
            aplicarFiltroTiposCameraSirp_(true);

            var comRota = SIRP_STATE.resultados.filter(function(camera) {
                return !!camera.rotaEncontrada;
            }).length;
            mostrarMsgSirp_(
                SIRP_STATE.resultados.length
                    ? 'Análise concluída: ' + SIRP_STATE.resultados.length + ' câmera(s) exibida(s) e ' + comRota + ' caminho(s) possível(is) localizado(s).'
                    : 'Nenhum caminho viário foi encontrado dentro do raio selecionado.',
                SIRP_STATE.resultados.length ? 'success' : 'secondary'
            );
        })
        .catch(function(erro) {
            if (origemPreparada) {
                SIRP_STATE.rotas = [];
                SIRP_STATE.grafoRota = null;
                renderizarRotasSirp_([]);
                SIRP_STATE.resultados = SIRP_STATE.resultadosTodos.slice();
                renderizarCamerasSirp(SIRP_STATE.resultadosTodos);
                renderizarResultadoSirp(SIRP_STATE.resultadosTodos);
                renderizarTextoTecnicoSirp_([]);
            }
            mostrarMsgSirp_((erro && erro.message) || String(erro), 'danger');
        })
        .then(function() {
            definirCarregandoSirp_(false);
        });
}

function definirCarregandoSirp_(carregando) {
    SIRP_STATE.carregando = !!carregando;
    var btn = document.getElementById('sirpBtnAnalisar');
    if (!btn) return;

    btn.disabled = !!carregando;
    btn.innerHTML = carregando
        ? '<i class="fas fa-spinner fa-spin"></i> ANALISANDO'
        : '<i class="fas fa-route"></i> ANALISAR';
}

function obterMalhaViariaSirp_(origem, raio) {
    return new Promise(function(resolve, reject) {
        google.script.run
            .withSuccessHandler(function(ret) {
                if (!ret || !Array.isArray(ret.elements)) {
                    reject(new Error('A malha viária retornou dados inválidos.'));
                    return;
                }
                resolve(ret);
            })
            .withFailureHandler(function(erro) {
                reject(new Error(
                    (erro && erro.message)
                    || 'Não foi possível carregar a malha viária nos servidores disponíveis.'
                ));
            })
            .obterMalhaViariaSirp(
                usuarioAtual.login,
                origem.lat,
                origem.lng,
                raio
            );
    });
}

function inserirFilaSirp_(fila, item) {
    fila.push(item);
    var idx = fila.length - 1;

    while (idx > 0) {
        var pai = Math.floor((idx - 1) / 2);
        if (fila[pai].distancia <= fila[idx].distancia) break;
        var tmp = fila[pai];
        fila[pai] = fila[idx];
        fila[idx] = tmp;
        idx = pai;
    }
}

function retirarFilaSirp_(fila) {
    if (!fila.length) return null;
    var primeiro = fila[0];
    var ultimo = fila.pop();

    if (fila.length) {
        fila[0] = ultimo;
        var idx = 0;

        while (true) {
            var esq = idx * 2 + 1;
            var dir = esq + 1;
            var menor = idx;

            if (esq < fila.length && fila[esq].distancia < fila[menor].distancia) menor = esq;
            if (dir < fila.length && fila[dir].distancia < fila[menor].distancia) menor = dir;
            if (menor === idx) break;

            var tmp = fila[idx];
            fila[idx] = fila[menor];
            fila[menor] = tmp;
            idx = menor;
        }
    }

    return primeiro;
}

function gerarTrechosAcessiveisSirp_(dadosOsm, origem, raio) {
    var elementos = (dadosOsm && dadosOsm.elements) || [];
    var nos = {};
    var adj = {};
    var arestas = {};

    elementos.forEach(function(el) {
        if (el.type === 'node') {
            nos[String(el.id)] = { id: String(el.id), lat: Number(el.lat), lng: Number(el.lon) };
        }
    });

    elementos.forEach(function(el) {
        if (el.type !== 'way' || !el.nodes || el.nodes.length < 2) return;

        var highway = normalizarSirpFront_((el.tags || {}).highway).toLowerCase();
        if (!highway || SIRP_CONFIG_FRONT.VIAS_EXCLUIDAS[highway]) return;

        var nomeVia = (el.tags || {}).name || (el.tags || {}).ref || 'Via sem identificação';

        for (var i = 0; i < el.nodes.length - 1; i++) {
            var aId = String(el.nodes[i]);
            var bId = String(el.nodes[i + 1]);
            var a = nos[aId];
            var b = nos[bId];
            if (!a || !b) continue;

            var tamanho = calcularDistanciaMetrosSirp(a.lat, a.lng, b.lat, b.lng);
            if (!tamanho || tamanho > 500) continue;

            var chave = aId < bId ? aId + '|' + bId : bId + '|' + aId;
            if (!arestas[chave]) {
                arestas[chave] = {
                    chave: chave,
                    a: aId,
                    b: bId,
                    tamanho: tamanho,
                    nomeVia: nomeVia
                };
            }

            if (!adj[aId]) adj[aId] = [];
            if (!adj[bId]) adj[bId] = [];
            adj[aId].push({ para: bId, tamanho: tamanho, chave: chave });
            adj[bId].push({ para: aId, tamanho: tamanho, chave: chave });
        }
    });

    var inicioId = null;
    var menorDistancia = Infinity;

    Object.keys(adj).forEach(function(id) {
        var no = nos[id];
        if (!no) return;
        var distancia = calcularDistanciaMetrosSirp(origem.lat, origem.lng, no.lat, no.lng);
        if (distancia < menorDistancia) {
            menorDistancia = distancia;
            inicioId = id;
        }
    });

    if (!inicioId || menorDistancia > 120) {
        SIRP_STATE.grafoRota = null;
        return [];
    }

    var distancias = {};
    var anteriores = {};
    var visitados = {};
    var fila = [];
    distancias[inicioId] = 0;
    inserirFilaSirp_(fila, { id: inicioId, distancia: 0 });

    while (fila.length) {
        var atual = retirarFilaSirp_(fila);
        if (visitados[atual.id]) continue;
        visitados[atual.id] = true;
        if (atual.distancia > raio) continue;

        (adj[atual.id] || []).forEach(function(ligacao) {
            var nova = atual.distancia + ligacao.tamanho;
            if (nova > raio + ligacao.tamanho) return;
            if (distancias[ligacao.para] === undefined || nova < distancias[ligacao.para]) {
                distancias[ligacao.para] = nova;
                anteriores[ligacao.para] = {
                    anterior: atual.id,
                    chave: ligacao.chave
                };
                inserirFilaSirp_(fila, { id: ligacao.para, distancia: nova });
            }
        });
    }

    var trechos = [];

    Object.keys(arestas).forEach(function(chave) {
        var aresta = arestas[chave];
        var da = distancias[aresta.a];
        var db = distancias[aresta.b];
        if ((da === undefined || da > raio) && (db === undefined || db > raio)) return;

        var noA = nos[aresta.a];
        var noB = nos[aresta.b];
        var inicio;
        var fim;

        if (da !== undefined && da <= raio && db !== undefined && db <= raio) {
            inicio = [noA.lat, noA.lng];
            fim = [noB.lat, noB.lng];
        } else if (da !== undefined && da <= raio) {
            inicio = [noA.lat, noA.lng];
            fim = interpolarCoordenadaSirp_(noA, noB, Math.max(0, Math.min(1, (raio - da) / aresta.tamanho)));
        } else {
            inicio = [noB.lat, noB.lng];
            fim = interpolarCoordenadaSirp_(noB, noA, Math.max(0, Math.min(1, (raio - db) / aresta.tamanho)));
        }

        if (calcularDistanciaMetrosSirp(inicio[0], inicio[1], fim[0], fim[1]) < 2) return;

        trechos.push({
            id: chave,
            nomeVia: aresta.nomeVia,
            inicio: inicio,
            fim: fim,
            comCamera: false,
            cameras: []
        });
    });

    SIRP_STATE.grafoRota = {
        nos: nos,
        adj: adj,
        arestas: arestas,
        inicioId: inicioId,
        distancias: distancias,
        anteriores: anteriores,
        raio: raio
    };

    return trechos;
}

function interpolarCoordenadaSirp_(a, b, proporcao) {
    return [
        a.lat + (b.lat - a.lat) * proporcao,
        a.lng + (b.lng - a.lng) * proporcao
    ];
}

function distanciaPontoSegmentoSirp_(ponto, inicio, fim) {
    return projetarPontoSegmentoSirp_(ponto, inicio, fim).distancia;
}

function projetarPontoSegmentoSirp_(ponto, inicio, fim) {
    var latRef = (inicio[0] + fim[0] + ponto.lat) / 3 * Math.PI / 180;
    var metrosLat = 111320;
    var metrosLng = 111320 * Math.cos(latRef);
    var ax = inicio[1] * metrosLng;
    var ay = inicio[0] * metrosLat;
    var bx = fim[1] * metrosLng;
    var by = fim[0] * metrosLat;
    var px = ponto.lng * metrosLng;
    var py = ponto.lat * metrosLat;
    var dx = bx - ax;
    var dy = by - ay;
    var denom = dx * dx + dy * dy;
    var t = denom ? ((px - ax) * dx + (py - ay) * dy) / denom : 0;
    t = Math.max(0, Math.min(1, t));
    var cx = ax + t * dx;
    var cy = ay + t * dy;
    return {
        distancia: Math.sqrt(Math.pow(px - cx, 2) + Math.pow(py - cy, 2)),
        proporcao: t,
        coordenada: [
            inicio[0] + (fim[0] - inicio[0]) * t,
            inicio[1] + (fim[1] - inicio[1]) * t
        ]
    };
}

function reconstruirCaminhoCameraSirp_(camera) {
    var grafo = SIRP_STATE.grafoRota;
    if (!grafo) return null;

    var pontoCamera = {
        lat: Number(camera.latitudeCamera),
        lng: Number(camera.longitudeCamera)
    };
    var melhor = null;

    Object.keys(grafo.arestas || {}).forEach(function(chave) {
        var aresta = grafo.arestas[chave];
        var noA = grafo.nos[aresta.a];
        var noB = grafo.nos[aresta.b];
        if (!noA || !noB) return;

        var projecao = projetarPontoSegmentoSirp_(
            pontoCamera,
            [noA.lat, noA.lng],
            [noB.lat, noB.lng]
        );
        if (projecao.distancia > SIRP_CONFIG_FRONT.TOLERANCIA_CAMERA_METROS) return;

        [
            {
                id: aresta.a,
                distanciaParcial: projecao.proporcao * aresta.tamanho
            },
            {
                id: aresta.b,
                distanciaParcial: (1 - projecao.proporcao) * aresta.tamanho
            }
        ].forEach(function(opcao) {
            var distanciaAteNo = grafo.distancias[opcao.id];
            if (distanciaAteNo === undefined || distanciaAteNo > grafo.raio) return;

            var distanciaTotal = distanciaAteNo + opcao.distanciaParcial;
            if (distanciaTotal > grafo.raio + SIRP_CONFIG_FRONT.TOLERANCIA_CAMERA_METROS) return;

            var pontuacao = distanciaTotal + projecao.distancia;
            if (!melhor || pontuacao < melhor.pontuacao) {
                melhor = {
                    aresta: aresta,
                    noAcessoId: opcao.id,
                    projecao: projecao,
                    distanciaTotal: distanciaTotal,
                    pontuacao: pontuacao
                };
            }
        });
    });

    if (!melhor) return null;

    var passosInvertidos = [];
    var atualId = melhor.noAcessoId;
    var seguranca = 0;

    while (atualId !== grafo.inicioId && grafo.anteriores[atualId] && seguranca < 5000) {
        var anteriorInfo = grafo.anteriores[atualId];
        passosInvertidos.push({
            de: anteriorInfo.anterior,
            para: atualId,
            chave: anteriorInfo.chave
        });
        atualId = anteriorInfo.anterior;
        seguranca++;
    }

    if (atualId !== grafo.inicioId) return null;

    var segmentos = passosInvertidos.reverse().map(function(passo) {
        var de = grafo.nos[passo.de];
        var para = grafo.nos[passo.para];
        var aresta = grafo.arestas[passo.chave] || {};
        return {
            inicio: [de.lat, de.lng],
            fim: [para.lat, para.lng],
            nomeVia: aresta.nomeVia || 'Via sem identificação'
        };
    });

    var noAcesso = grafo.nos[melhor.noAcessoId];
    var coordenadaAcesso = [noAcesso.lat, noAcesso.lng];
    if (
        calcularDistanciaMetrosSirp(
            coordenadaAcesso[0],
            coordenadaAcesso[1],
            melhor.projecao.coordenada[0],
            melhor.projecao.coordenada[1]
        ) > 2
    ) {
        segmentos.push({
            inicio: coordenadaAcesso,
            fim: melhor.projecao.coordenada,
            nomeVia: melhor.aresta.nomeVia || 'Via sem identificação'
        });
    }

    if (melhor.projecao.distancia > 2) {
        segmentos.push({
            inicio: melhor.projecao.coordenada,
            fim: [pontoCamera.lat, pontoCamera.lng],
            nomeVia: melhor.aresta.nomeVia || camera.enderecoCamera || 'Acesso à câmera'
        });
    }

    return {
        segmentos: segmentos,
        distanciaRotaMetros: Math.round(melhor.distanciaTotal + melhor.projecao.distancia)
    };
}

function gerarRotasAteCamerasSirp_(cameras) {
    var unicos = {};
    var rotas = [];

    (cameras || []).forEach(function(camera) {
        var rotaCamera = reconstruirCaminhoCameraSirp_(camera);
        camera.rotaSirp = rotaCamera;
        camera.rotaEncontrada = !!(rotaCamera && rotaCamera.segmentos && rotaCamera.segmentos.length);
        if (!camera.rotaEncontrada) return;

        var chaveCamera = chaveCameraSirp_(camera);
        rotaCamera.segmentos.forEach(function(segmento) {
            var chaveSegmento = [
                segmento.inicio[0].toFixed(6),
                segmento.inicio[1].toFixed(6),
                segmento.fim[0].toFixed(6),
                segmento.fim[1].toFixed(6),
                normalizarSirpFront_(segmento.nomeVia)
            ].join('|');

            if (!unicos[chaveSegmento]) {
                unicos[chaveSegmento] = {
                    id: chaveSegmento,
                    inicio: segmento.inicio,
                    fim: segmento.fim,
                    nomeVia: segmento.nomeVia,
                    comCamera: true,
                    cameras: []
                };
                rotas.push(unicos[chaveSegmento]);
            }

            if (unicos[chaveSegmento].cameras.indexOf(chaveCamera) === -1) {
                unicos[chaveSegmento].cameras.push(chaveCamera);
            }
        });
    });

    return rotas;
}

function classificarCoberturaTrechosSirp_(trechos, cameras) {
    (trechos || []).forEach(function(trecho) {
        trecho.cameras = [];

        (cameras || []).forEach(function(camera) {
            var distancia = distanciaPontoSegmentoSirp_(
                { lat: Number(camera.latitudeCamera), lng: Number(camera.longitudeCamera) },
                trecho.inicio,
                trecho.fim
            );

            if (distancia <= SIRP_CONFIG_FRONT.TOLERANCIA_CAMERA_METROS) {
                trecho.cameras.push(camera.idRegistro || camera.nomeReferencia || camera.nomeCameraEspecifica || 'CÂMERA');
            }
        });

        trecho.comCamera = trecho.cameras.length > 0;
    });
}

function renderizarRotasSirp_(trechos) {
    if (!SIRP_STATE.mapa) return;

    if (!SIRP_STATE.rotaLayer) {
        SIRP_STATE.rotaLayer = L.layerGroup().addTo(SIRP_STATE.mapa);
    } else {
        SIRP_STATE.rotaLayer.clearLayers();
    }

    var linhasComCamera = (trechos || []).map(function(trecho) {
        return [trecho.inicio, trecho.fim];
    });

    if (linhasComCamera.length) {
        L.polyline(linhasComCamera, {
            color: '#24c96b',
            weight: 6,
            opacity: 0.96,
            lineCap: 'round'
        }).bindTooltip('Caminho possível até a câmera', { sticky: true })
            .addTo(SIRP_STATE.rotaLayer);
    }
}

function renderizarCamerasSirp(resultados) {
    if (!SIRP_STATE.mapa) return;

    if (!SIRP_STATE.cameraLayer) {
        SIRP_STATE.cameraLayer = L.layerGroup().addTo(SIRP_STATE.mapa);
    } else {
        SIRP_STATE.cameraLayer.clearLayers();
    }

    (resultados || []).forEach(function(item) {
        var lat = Number(item.latitudeCamera);
        var lng = Number(item.longitudeCamera);
        if (isNaN(lat) || isNaN(lng)) return;

        var status = classificarAcessoSirpFront_(item.statusAcesso || item.acessoNuip);
        var tipo = tipoCameraSirp_(item.tipoCamera);
        var cor = corAcessoSirp_(status);
        var chaveCodificada = encodeURIComponent(chaveCameraSirp_(item));
        var popup = ''
            + '<div style="min-width:270px;color:#111827;">'
            + '<div class="sirp-popup-topo">'
            + '  <div class="sirp-popup-camera">'
            +      svgCameraSirp_(tipo, status, '')
            + '    <div><strong>' + escSirp(item.nomeReferencia || item.nomeCameraEspecifica || 'CÂMERA') + '</strong>'
            + '    <div style="font-size:11px;color:' + cor + ';font-weight:800;">' + escSirp(tipo) + ' · ' + escSirp(rotuloAcessoSirp_(status)) + '</div></div>'
            + '  </div>'
            + (SIRP_STATE.podeEditarCameras
                ? '  <button class="sirp-editar-camera" type="button" title="Atualizar dados da câmera" aria-label="Atualizar dados da câmera" onclick="abrirEdicaoCameraSirp_(\'' + escSirp(chaveCodificada) + '\')"><i class="fas fa-pen"></i></button>'
                : '')
            + '</div>'
            + '<strong>Câmera:</strong> ' + escSirp(item.nomeCameraEspecifica || '-') + '<br>'
            + '<strong>Distância:</strong> ' + escSirp(item.distanciaMetros) + ' m<br>'
            + '<strong>Órgão:</strong> ' + escSirp(item.orgaoGestorCamera || '-') + '<br>'
            + '<strong>Endereço:</strong> ' + escSirp(item.enderecoCamera || '-') + '<br>'
            + '<strong>OBS_CAMERA:</strong> ' + escSirp(item.obsCamera || 'Não informada')
            + '</div>';

        L.marker([lat, lng], { icon: criarIconeCameraSirp_(item) })
            .bindPopup(popup)
            .addTo(SIRP_STATE.cameraLayer);
    });

    if (SIRP_STATE.raioCircle) {
        SIRP_STATE.mapa.fitBounds(SIRP_STATE.raioCircle.getBounds(), { padding: [25, 25] });
    }
}

function renderizarResultadoSirp(resultados) {
    resultados = resultados || [];

    var comAcesso = resultados.filter(function(i) {
        return i.statusAcesso === 'COM_ACESSO' || i.statusAcesso === 'AGILIS';
    }).length;
    var semAcesso = resultados.filter(function(i) { return i.statusAcesso === 'SEM_ACESSO'; }).length;
    var naoInformado = resultados.filter(function(i) { return i.statusAcesso === 'NAO_INFORMADO'; }).length;

    atualizarTextoSirp_('sirpTotalCameras', resultados.length);
    atualizarTextoSirp_('sirpComAcesso', comAcesso);
    atualizarTextoSirp_('sirpSemAcesso', semAcesso);
    atualizarTextoSirp_('sirpAcessoIgnorado', naoInformado);

    var box = document.getElementById('sirpTabelaResultado');
    if (!box) return;

    if (!resultados.length) {
        box.innerHTML = '<div class="text-muted small">Nenhuma câmera encontrada no raio selecionado.</div>';
        return;
    }

    var html = '';

    resultados.forEach(function(item) {
        var status = classificarAcessoSirpFront_(item.statusAcesso || item.acessoNuip);
        var cor = corAcessoSirp_(status);
        var tipo = tipoCameraSirp_(item.tipoCamera);

        html += ''
            + '<div class="sirp-camera-item">'
            + '  <div class="sirp-camera-mini">' + svgCameraSirp_(tipo, status, '') + '</div>'
            + '  <div>'
            + '    <div class="sirp-camera-nome">' + escSirp(item.nomeReferencia || item.nomeCameraEspecifica || 'CÂMERA') + '</div>'
            + '    <div class="sirp-camera-meta">' + escSirp(tipo) + ' · ' + escSirp(item.distanciaMetros) + ' m · ' + escSirp(item.orgaoGestorCamera || 'Órgão não informado') + '</div>'
            + (item.obsCamera ? '    <div class="sirp-camera-obs">' + escSirp(item.obsCamera) + '</div>' : '')
            + '  </div>'
            + '  <span class="sirp-chip" style="color:' + cor + ';">' + escSirp(rotuloAcessoSirp_(status)) + '</span>'
            + '</div>';
    });

    box.innerHTML = html;
}

function agruparViasRotaSirp_(segmentos) {
    var grupos = [];

    (segmentos || []).forEach(function(segmento) {
        var nome = String(segmento.nomeVia || '').trim() || 'Via sem identificação';
        var ultimo = grupos[grupos.length - 1];
        if (ultimo && normalizarSirpFront_(ultimo.nome) === normalizarSirpFront_(nome)) {
            ultimo.segmentos.push(segmento);
            ultimo.fim = segmento.fim;
            return;
        }

        grupos.push({
            nome: nome,
            inicio: segmento.inicio,
            fim: segmento.fim,
            segmentos: [segmento]
        });
    });

    return grupos.filter(function(grupo) {
        return normalizarSirpFront_(grupo.nome) !== 'ACESSO A CAMERA';
    });
}

function direcaoConversaoSirp_(grupoAnterior, grupoAtual) {
    if (!grupoAnterior || !grupoAtual) return '';
    var ultimoAnterior = grupoAnterior.segmentos[grupoAnterior.segmentos.length - 1];
    var primeiroAtual = grupoAtual.segmentos[0];
    if (!ultimoAnterior || !primeiroAtual) return '';

    var anguloAnterior = calcularAnguloSirp(
        ultimoAnterior.inicio[0],
        ultimoAnterior.inicio[1],
        ultimoAnterior.fim[0],
        ultimoAnterior.fim[1]
    );
    var anguloAtual = calcularAnguloSirp(
        primeiroAtual.inicio[0],
        primeiroAtual.inicio[1],
        primeiroAtual.fim[0],
        primeiroAtual.fim[1]
    );
    var delta = ((anguloAtual - anguloAnterior + 540) % 360) - 180;

    if (delta > 25) return 'à direita';
    if (delta < -25) return 'à esquerda';
    return 'em frente';
}

function gerarTextoTecnicoCameraSirp_(camera) {
    var nomeCamera = String(camera.nomeReferencia || camera.nomeCameraEspecifica || camera.idRegistro || 'câmera não identificada').trim();
    var tipo = tipoCameraSirp_(camera.tipoCamera);
    var rota = camera.rotaSirp;
    var texto;

    if (!rota || !rota.segmentos || !rota.segmentos.length) {
        return '';
    }

    var vias = agruparViasRotaSirp_(rota.segmentos).filter(function(grupo) {
        return normalizarSirpFront_(grupo.nome) !== 'VIA SEM IDENTIFICACAO';
    });

    if (vias.length) {
        texto = 'Considerando o percurso possível, caso o alvo siga pela ' + vias[0].nome;
        var limite = Math.min(vias.length, 4);

        for (var i = 1; i < limite; i++) {
            var direcao = direcaoConversaoSirp_(vias[i - 1], vias[i]);
            texto += direcao === 'em frente'
                ? ' e prossiga em frente pela ' + vias[i].nome
                : ' e converta ' + direcao + ' para a ' + vias[i].nome;
        }

        if (vias.length > limite) {
            texto += ', prosseguindo pelas vias intermediárias indicadas no mapa';
        }

        texto += ', haverá passagem pela câmera ' + nomeCamera;
    } else {
        texto = 'No percurso possível indicado no mapa, haverá passagem pela câmera ' + nomeCamera;
    }

    if (tipo && tipo !== 'CÂMERA') {
        texto += ', do tipo ' + tipo;
    }
    texto += '.';

    var status = classificarAcessoSirpFront_(camera.statusAcesso || camera.acessoNuip);
    if (status === 'COM_ACESSO') {
        texto += ' Há acesso institucional às imagens.';
    } else if (status === 'SEM_ACESSO') {
        texto += ' Não há acesso institucional às imagens.';
    } else if (status === 'AGILIS') {
        texto += ' O acesso às imagens ocorre pelo Agilis.';
    }

    var obs = String(camera.obsCamera || '').trim();
    var obsNormalizada = normalizarSirpFront_(obs);
    var obsIndicaSemAgilis = (
        obsNormalizada.indexOf('SEM IMAGENS AGILIS') > -1 ||
        obsNormalizada.indexOf('NAO ESTA NO AGILIS') > -1 ||
        obsNormalizada.indexOf('FORA DO AGILIS') > -1
    );
    var obsIndicaComAgilis = (
        obsNormalizada.indexOf('COM IMAGENS AGILIS') > -1 ||
        obsNormalizada.indexOf('IMAGENS DISPONIVEIS NO AGILIS') > -1
    );

    if (status !== 'AGILIS' && obsIndicaSemAgilis) {
        texto += ' Não há imagens disponíveis no Agilis.';
    } else if (status !== 'AGILIS' && obsIndicaComAgilis) {
        texto += ' Há imagens disponíveis no Agilis.';
    } else if (obs && !obsIndicaSemAgilis && !obsIndicaComAgilis) {
        texto += ' Observação operacional: ' + obs.replace(/[.]+$/, '') + '.';
    }

    return texto;
}

function renderizarTextoTecnicoSirp_(cameras) {
    var box = document.getElementById('sirpTextoTecnico');
    if (!box) return;

    var textos = (cameras || []).map(gerarTextoTecnicoCameraSirp_).filter(Boolean);
    if (!textos.length) {
        box.classList.remove('visivel');
        box.innerHTML = '';
        return;
    }

    box.innerHTML = ''
        + '<div class="sirp-texto-titulo"><i class="fas fa-file-alt"></i> ORIENTAÇÃO TÉCNICA DOS PERCURSOS</div>'
        + textos.map(function(texto, indice) {
            return '<div class="sirp-texto-item"><strong>' + (indice + 1) + '.</strong> ' + escSirp(texto) + '</div>';
        }).join('');
    box.classList.add('visivel');
}

function abrirEdicaoCameraSirp_(chaveCodificada) {
    if (!SIRP_STATE.podeEditarCameras) {
        mostrarMsgSirp_('Somente usuários ADMIN e integrantes do NUIP podem alterar os dados das câmeras.', 'danger');
        return;
    }

    var chave;
    try {
        chave = decodeURIComponent(String(chaveCodificada || ''));
    } catch (e) {
        chave = String(chaveCodificada || '');
    }

    var camera = obterCameraPorChaveSirp_(chave);
    if (!camera) {
        mostrarMsgSirp_('Não foi possível localizar a câmera selecionada.', 'danger');
        return;
    }

    var tipo = tipoCameraSirp_(camera.tipoCamera);
    var status = classificarAcessoSirpFront_(camera.statusAcesso || camera.acessoNuip);
    atualizarValorCampoSirp_('sirpEditChave', chave);
    atualizarValorCampoSirp_('sirpEditTipo', ['LPR', 'PTZ', 'FOTOSSENSOR'].indexOf(tipo) > -1 ? tipo : '');
    atualizarValorCampoSirp_('sirpEditOrgao', camera.orgaoGestorCamera || '');
    atualizarValorCampoSirp_('sirpEditAcesso', status);
    atualizarValorCampoSirp_('sirpEditObs', camera.obsCamera || '');

    var titulo = document.getElementById('sirpModalTitulo');
    if (titulo) {
        titulo.innerHTML = '<i class="fas fa-pen"></i> ' + escSirp(camera.nomeReferencia || camera.nomeCameraEspecifica || 'ATUALIZAR CÂMERA');
    }

    var modal = document.getElementById('sirpModalEdicaoCamera');
    if (modal) modal.classList.add('aberto');
}

function atualizarValorCampoSirp_(id, valor) {
    var campo = document.getElementById(id);
    if (campo) campo.value = valor == null ? '' : String(valor);
}

function fecharEdicaoCameraSirp_() {
    var modal = document.getElementById('sirpModalEdicaoCamera');
    if (modal) modal.classList.remove('aberto');
}

function salvarEdicaoCameraSirp_() {
    if (!SIRP_STATE.podeEditarCameras) {
        fecharEdicaoCameraSirp_();
        mostrarMsgSirp_('Somente usuários ADMIN e integrantes do NUIP podem alterar os dados das câmeras.', 'danger');
        return;
    }

    var chave = String((document.getElementById('sirpEditChave') || {}).value || '');
    var camera = obterCameraPorChaveSirp_(chave);
    var tipo = String((document.getElementById('sirpEditTipo') || {}).value || '');
    var orgao = String((document.getElementById('sirpEditOrgao') || {}).value || '').trim();
    var acesso = String((document.getElementById('sirpEditAcesso') || {}).value || 'NAO_INFORMADO');
    var obsCamera = String((document.getElementById('sirpEditObs') || {}).value || '').trim();

    if (!camera) {
        mostrarMsgSirp_('Não foi possível localizar a câmera selecionada.', 'danger');
        return;
    }
    if (['LPR', 'PTZ', 'FOTOSSENSOR'].indexOf(tipo) === -1) {
        mostrarMsgSirp_('Selecione LPR, PTZ ou FOTOSSENSOR.', 'danger');
        return;
    }

    var btn = document.getElementById('sirpBtnSalvarCamera');
    if (btn) {
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> SALVANDO';
    }

    function restaurarBotao() {
        if (!btn) return;
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-save"></i> SALVAR';
    }

    google.script.run
        .withSuccessHandler(function(retorno) {
            var atualizada = (retorno && retorno.camera) || {};
            [
                SIRP_STATE.cameras || [],
                SIRP_STATE.resultadosTodos || [],
                SIRP_STATE.resultados || []
            ].forEach(function(lista) {
                lista.forEach(function(item) {
                    if (chaveCameraSirp_(item) === chave) Object.assign(item, atualizada);
                });
            });

            fecharEdicaoCameraSirp_();
            aplicarFiltroTiposCameraSirp_(false);
            mostrarMsgSirp_('Dados da câmera atualizados com sucesso.', 'success');
            restaurarBotao();
        })
        .withFailureHandler(function(erro) {
            mostrarMsgSirp_('Não foi possível atualizar a câmera: ' + ((erro && erro.message) || erro), 'danger');
            restaurarBotao();
        })
        .atualizarCameraSirp(
            usuarioAtual.login,
            {
                idRegistro: camera.idRegistro || '',
                rowIndex: camera.rowIndex || 0
            },

function salvarAnaliseSirp() {
    var totalTrechos = (SIRP_STATE.rotas || []).length;
    var trechosComCamera = (SIRP_STATE.rotas || []).filter(function(t) { return t.comCamera; }).length;
    var trechosSemCamera = totalTrechos - trechosComCamera;
    var rotasResumo = (SIRP_STATE.rotas || []).slice(0, 1500).map(function(trecho) {
        return {
            id: trecho.id,
            nomeVia: trecho.nomeVia,
            comCamera: !!trecho.comCamera,
            cameras: trecho.cameras || []
        };
    });

    var payload = {
        demanda: demandaSelecionadaSirp_(),
        origem: SIRP_STATE.origem || {},
        fonteLocalizacao: SIRP_STATE.fonteLocalizacao || '',
        enderecoBuscado: SIRP_STATE.enderecoBuscado || ((document.getElementById('sirpEndereco') || {}).value || ''),
        raioMetros: obterRaioSelecionadoSirp_(),
        sentidoAngulo: 0,
        sentidoTexto: '',
        resultados: SIRP_STATE.resultados || [],
        rotas: rotasResumo,
        totalTrechos: totalTrechos,
        trechosComCamera: trechosComCamera,
        trechosSemCamera: trechosSemCamera,
        obsAnalise: ''
    };

    google.script.run
        .withSuccessHandler(function() {
            SIRP_STATE.ultimaAnaliseSalva = true;
        })
        .withFailureHandler(function(erro) {
            mostrarMsgSirp_('A análise foi exibida, mas não pôde ser salva: ' + ((erro && erro.message) || erro), 'danger');
        })
        .salvarAnaliseSirp(usuarioAtual.login, payload);
}

    SIRP_STATE.enderecoBuscado = '';
    SIRP_STATE.ultimoEnderecoAnalisado = '';

    SIRP_STATE.resultados = [];

    SIRP_STATE.grafoRota = null;
    SIRP_STATE.analiseExecutada = false;
    SIRP_STATE.ultimaAnaliseSalva = false;

    var demanda = document.getElementById('sirpDemanda');
    if (demanda) demanda.value = '';

    var raio = document.getElementById('sirpRaio');
    if (raio) raio.value = '';

    if (SIRP_STATE.origemMarker && SIRP_STATE.mapa) {
        SIRP_STATE.mapa.removeLayer(SIRP_STATE.origemMarker);
        SIRP_STATE.origemMarker = null;
    }

    if (SIRP_STATE.raioCircle && SIRP_STATE.mapa) {
        SIRP_STATE.mapa.removeLayer(SIRP_STATE.raioCircle);
        SIRP_STATE.raioCircle = null;
    }

    if (SIRP_STATE.cameraLayer) SIRP_STATE.cameraLayer.clearLayers();
    if (SIRP_STATE.rotaLayer) SIRP_STATE.rotaLayer.clearLayers();

    renderizarResultadoSirp([]);

function selecionarValorAproximadoDesenv_(id, valor) {
    var sel = document.getElementById(id);
    if (!sel) return;
    var alvo = normalizarDesenvFrontend(valor || '');
    if (!alvo) return;
    for (var i = 0; i < sel.options.length; i++) {
        var opt = sel.options[i];
        var normOpt = normalizarDesenvFrontend(opt.value || opt.text || '');
        if (normOpt === alvo || normOpt.indexOf(alvo) > -1 || alvo.indexOf(normOpt) > -1) {
            sel.value = opt.value;
            return;
        }
    }
}

function gerarInformacoesIniciaisDesenvFrontend() {
    var arquivo = ((document.getElementById('desenvArquivoBO') || {}).files || [])[0] || null;
    var texto = (document.getElementById('desenvTextoBO') || {}).value || '';
    if (!arquivo && !texto.trim()) return alert('Forneça um arquivo ou texto bruto para gerar as informações iniciais.');

    var btns = document.querySelectorAll('button[onclick="gerarInformacoesIniciaisDesenvFrontend()"]');
    Array.prototype.forEach.call(btns, function(b){ b.disabled = true; b.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Gerando informações...'; });

    var payload = { texto: texto, arquivoBase64: null, mimeType: null };
    var executar = function () {
        google.script.run
            .withSuccessHandler(function (ret) {
                Array.prototype.forEach.call(btns, function(b){ b.disabled = false; b.innerHTML = '<i class="fas fa-wand-magic-sparkles"></i> Gerar informações iniciais'; });
                if (ret && ret.sucesso) {
                    var d = ret.dados || {};
                    var tipoProcedimento = d.tipoOcorrencia || d.tipo_procedimento || d.tipoProcedimento || '';
                    var numeroProcedimento = d.numeroProcedimento || d.numero_procedimento || '';
                    if (tipoProcedimento) selecionarValorAproximadoDesenv_('desenvTipoOcorrencia', tipoProcedimento);
                    if (numeroProcedimento) document.getElementById('desenvNumeroProcedimento').value = numeroProcedimento;
                    if (d.data) document.getElementById('desenvData').value = d.data;
                    if (d.hora) document.getElementById('desenvHora').value = d.hora;
                    document.getElementById('desenvResumo').value = d.informacoes_iniciais || ret.textoGerado || '';
                    alert('Informações iniciais geradas. Confira os campos antes de salvar.');
                } else {
                    alert((ret && ret.erro) || 'Falha ao gerar informações iniciais.');
                }
            })
            .withFailureHandler(function (err) {
                Array.prototype.forEach.call(btns, function(b){ b.disabled = false; b.innerHTML = '<i class="fas fa-wand-magic-sparkles"></i> Gerar informações iniciais'; });
                alert((err && err.message) || err || 'Erro ao chamar IA.');
            })
            .processarIADesenvDemandas(usuarioAtual.login, 'gerarInformacoesIniciais', payload);
    };

    if (arquivo) {
        lerArquivoBase64Desenv(arquivo, function (base64, mimeType) {
            payload.arquivoBase64 = base64;
            payload.mimeType = mimeType;
            executar();
        });
    } else {
        executar();
    }
}

function salvarDemandaDesenvFrontend() {
    var rowIndex = (document.getElementById('desenvRowIndex') || {}).value || '';

    var tipoOcorrencia = (document.getElementById('desenvTipoOcorrencia') || {}).value || '';
    var numeroProcedimento = (document.getElementById('desenvNumeroProcedimento') || {}).value || '';
    var numMontado = montarIdentificadorDesenvFrontend(tipoOcorrencia, numeroProcedimento);

    var demandaAtual = DESENV_DEMANDAS_STATE.demandaAtual || null;

    var modoEdicao = !!(
        demandaAtual &&
        demandaAtual.rowIndex &&
        rowIndex &&
        String(demandaAtual.rowIndex) === String(rowIndex)
    );

    var numExistente = modoEdicao
        ? String(demandaAtual.numOcorrencia || '').trim()
        : '';

    var payload = {
        usuarioLogin: usuarioAtual.login,

        acao: modoEdicao ? 'EDITAR_DEMANDA' : 'NOVA_DEMANDA',
        rowIndex: modoEdicao ? rowIndex : '',

        tipoOcorrencia: tipoOcorrencia,
        numeroProcedimento: numeroProcedimento,
        numOcorrencia: numMontado,
        numOcorrenciaOriginal: modoEdicao ? numExistente : '',

        delegado: (document.getElementById('desenvDelegado') || {}).value || '',
        demandaIninterrupta: (document.getElementById('desenvDemandaIninterrupta') || {}).value || 'NAO',
        descricao: (document.getElementById('desenvDescricao') || {}).value || '',
        informacoesIniciais: (document.getElementById('desenvResumo') || {}).value || '',
        resumo: (document.getElementById('desenvResumo') || {}).value || '',
        data: (document.getElementById('desenvData') || {}).value || '',
        hora: (document.getElementById('desenvHora') || {}).value || '',
        equipe: (document.getElementById('desenvEquipe') || {}).value || '',
        status: (document.getElementById('desenvStatusFinal') || {}).value || 'PENDENTE',
        crime: (document.getElementById('desenvCrimeRt') || {}).value || '',
        difusao: (document.getElementById('desenvDifusaoRt') || {}).value || ''
    };

    google.script.run
        .withSuccessHandler(function (ret) {
            alert((ret && ret.mensagem) || 'Demanda salva com sucesso.');
            carregarListaDemandasDesenv();
            if (ret && ret.numOcorrencia) {
                DEPATRI_MODO_DESENV = 'edicao';
                try { aplicarModoDesenvDemandasDepatri_(); } catch (e) {}
                abrirDemandaDesenv(ret.numOcorrencia);
                setTimeout(function() {
                    var alvo = document.getElementById('desenvModoEdicaoBadge');
                    if (alvo && alvo.scrollIntoView) alvo.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }, 500);
            }
        })
        .withFailureHandler(function (err) {
            alert((err && err.message) || err || 'Erro ao salvar demanda.');
        })
        .salvarDemandaDesenvDemandas(payload);
}

function salvarEvolucaoDesenvFrontend() {
    var num = (DESENV_DEMANDAS_STATE.demandaAtual && DESENV_DEMANDAS_STATE.demandaAtual.numOcorrencia)
        || montarIdentificadorDesenvFrontend(
            (document.getElementById('desenvTipoOcorrencia') || {}).value || '',
            (document.getElementById('desenvNumeroProcedimento') || {}).value || ''
        ) || '';

    if (!num) {
        return alert('Salve ou abra uma demanda antes de adicionar evolução.');
    }

    var textoEvolucao = ((document.getElementById('desenvEvolucaoTexto') || {}).value || '').trim();

    if (!textoEvolucao && (!RT_EVOLUCAO_IMAGENS_STATE.pendentes || !RT_EVOLUCAO_IMAGENS_STATE.pendentes.length)) {
        return alert('Digite o desenvolvimento da diligência ou adicione ao menos uma imagem.');
    }

    var rowIndexCampo = (document.getElementById('desenvEvolucaoRowIndex') || {}).value || '';
    var idEvolucaoCampo = (document.getElementById('desenvEvolucaoId') || {}).value || '';

    var modoEdicao = DESENV_EVOLUCAO_EDITANDO === true && rowIndexCampo;

    var payload = {
        usuarioLogin: usuarioAtual.login,
        acao: modoEdicao ? 'EDITAR_EVOLUCAO' : 'NOVA_EVOLUCAO',
        editar: modoEdicao,
        rowIndex: modoEdicao ? rowIndexCampo : '',
        idEvolucao: modoEdicao ? idEvolucaoCampo : '',
        numOcorrencia: num,
        desenvolvimento: textoEvolucao,
        imagens: (RT_EVOLUCAO_IMAGENS_STATE.pendentes || []).map(function(img) {
            return {
                nome: img.nome,
                mimeType: 'image/png',
                base64: img.base64,
                legenda: img.legenda || ''
            };
        })
    };

    var btn = document.querySelector('button[onclick="salvarEvolucaoDesenvFrontend()"]');
    var htmlOriginal = btn ? btn.innerHTML : '';

    if (btn) {
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Salvando...';
    }

    google.script.run
        .withSuccessHandler(function(ret) {
            if (btn) {
                btn.disabled = false;
                btn.innerHTML = htmlOriginal || 'Salvar evolução';
            }

            alert((ret && ret.mensagem) || 'Evolução salva.');

            limparFormularioEvolucaoDesenv();
            abrirDemandaDesenv(num);
        })
        .withFailureHandler(function(err) {
            if (btn) {
                btn.disabled = false;
                btn.innerHTML = htmlOriginal || 'Salvar evolução';
            }

            alert((err && err.message) || err || 'Erro ao salvar evolução.');
        })
        .salvarEvolucaoDesenvDemandas(payload);
}

function carregarArquivosImagemEvolucaoRt(input) {
    var arquivos = input && input.files ? Array.prototype.slice.call(input.files) : [];
    if (!arquivos.length) return;
    var validos = arquivos.filter(function(file) { return file && String(file.type || '').toLowerCase().indexOf('image/') === 0; });
    if (!validos.length) { if (input) input.value = ''; return alert('Selecione apenas arquivos de imagem.'); }
    validos.forEach(function(file) {
        var reader = new FileReader();
        reader.onload = function(evt) {
            var dataUrl = String((evt && evt.target && evt.target.result) || '');
            if (!dataUrl) return;
            RT_EVOLUCAO_IMAGENS_STATE.pendentes.push({ nome: file.name || ('imagem_' + (RT_EVOLUCAO_IMAGENS_STATE.pendentes.length + 1) + '.png'), base64: dataUrl, legenda: '' });
            renderImagensPendentesRtDesenv_();
        };
        reader.onerror = function() { alert('Não foi possível ler a imagem ' + (file.name || '') + '.'); };
        reader.readAsDataURL(file);
    });
    if (input) input.value = '';
}

function carregarScriptRt_(src, globalName, cb) {
    if (globalName && window[globalName]) return cb();
    var s = document.createElement('script');
    s.src = src;
    s.onload = cb;
    s.onerror = function(){ alert('Falha ao carregar biblioteca externa: ' + src); };
    document.head.appendChild(s);
}

function carregarImagemRtCard_(src, cb, erroCb) {
    var img = new Image();
    img.onload = function() {
        cb(img);
    };
    img.onerror = function() {
        if (erroCb) erroCb();
    };
    img.src = src;
}

function roundRectRtCard_(ctx, x, y, w, h, r, fill, stroke) {
    if (w < 2 * r) r = w / 2;
    if (h < 2 * r) r = h / 2;

    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();

    if (fill) ctx.fill();
    if (stroke) ctx.stroke();
}

function desenharPadraoDiagonalRtCard_(ctx, w, h) {
    ctx.save();
    ctx.globalAlpha = 0.09;
    ctx.strokeStyle = '#d4af37';
    ctx.lineWidth = 1;

    for (var i = -h; i < w; i += 24) {
        ctx.beginPath();
        ctx.moveTo(i, h);
        ctx.lineTo(i + h, 0);
        ctx.stroke();
    }

    ctx.restore();
}

function drawImageContainRtCard_(ctx, img, x, y, w, h) {
    if (!img) return;

    var iw = img.width || 1;
    var ih = img.height || 1;

    var escala = Math.min(w / iw, h / ih);
    var nw = iw * escala;
    var nh = ih * escala;

    var dx = x + (w - nw) / 2;
    var dy = y + (h - nh) / 2;

    ctx.drawImage(img, dx, dy, nw, nh);
}

function drawImageContainSemFundoBrancoRtCard_(ctx, img, x, y, w, h) {
    drawImageContainRtCard_(ctx, img, x, y, w, h);
}

function quebrarTextoRtCard_(ctx, texto, maxWidth) {
    texto = String(texto || '').trim();
    if (!texto) return [''];

    var palavras = texto.split(/\s+/);
    var linhas = [];
    var linhaAtual = '';

    for (var i = 0; i < palavras.length; i++) {
        var teste = linhaAtual ? (linhaAtual + ' ' + palavras[i]) : palavras[i];
        if (ctx.measureText(teste).width <= maxWidth) {
            linhaAtual = teste;
        } else {
            if (linhaAtual) linhas.push(linhaAtual);
            linhaAtual = palavras[i];
        }
    }

    if (linhaAtual) linhas.push(linhaAtual);
    return linhas;
}

function desenharCardQrDepatriRt_(dados, brasaoImg, qrImg, cb) {
    var card = document.createElement('canvas');

    // Proporção semelhante ao modelo desejado
    card.width = 600;
    card.height = 860;

    var ctx = card.getContext('2d');
    ctx.clearRect(0, 0, card.width, card.height);

    // Card principal
    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = '#d4af37';
    ctx.lineWidth = 3;
    roundRectRtCard_(ctx, 8, 8, 584, 844, 18, true, true);

    // Cabeçalho escuro
    ctx.save();
    roundRectRtCard_(ctx, 8, 8, 584, 300, 18, false, false);
    ctx.clip();

    var grad = ctx.createLinearGradient(8, 8, 592, 308);
    grad.addColorStop(0, '#050505');
    grad.addColorStop(0.6, '#111111');
    grad.addColorStop(1, '#1b1b1b');
    ctx.fillStyle = grad;
    ctx.fillRect(8, 8, 584, 300);

    desenharPadraoDiagonalRtCard_(ctx, 600, 320);

    // Curva dourada
    ctx.beginPath();
    ctx.moveTo(8, 225);
    ctx.bezierCurveTo(140, 275, 280, 270, 592, 215);
    ctx.lineTo(592, 308);
    ctx.lineTo(8, 308);
    ctx.closePath();
    ctx.fillStyle = '#c7a441';
    ctx.fill();

    // Curva branca
    ctx.beginPath();
    ctx.moveTo(8, 255);
    ctx.bezierCurveTo(160, 295, 320, 290, 592, 248);
    ctx.lineTo(592, 308);
    ctx.lineTo(8, 308);
    ctx.closePath();
    ctx.fillStyle = '#ffffff';
    ctx.fill();

    ctx.restore();

    // Brasão
    if (brasaoImg) {
        drawImageContainSemFundoBrancoRtCard_(ctx, brasaoImg, 220, 16, 160, 105);
    }

    // Texto superior
    ctx.textAlign = 'center';
    ctx.fillStyle = '#f8f9fa';
    ctx.font = 'bold 18px Arial, sans-serif';
    ctx.fillText('POLÍCIA CIVIL DO ESTADO DO CEARÁ', 300, 155);

    // Linhas douradas laterais
    ctx.strokeStyle = '#d4af37';
    ctx.lineWidth = 2.5;

    ctx.beginPath();
    ctx.moveTo(55, 195);
    ctx.lineTo(165, 195);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(435, 195);
    ctx.lineTo(545, 195);
    ctx.stroke();

    // DEPATRI
    ctx.fillStyle = '#d4af37';
    ctx.font = 'bold 44px Arial, sans-serif';
    ctx.fillText('DEPATRI', 300, 215);

    // Caixa da pasta
    var numeroRtExib = String(dados.numeroRt || '').trim().replace(/\//g, '.');
    var pastaTexto = 'PASTA: RT ' + numeroRtExib + ' - IMAGENS';

    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = '#d4af37';
    ctx.lineWidth = 2;
    roundRectRtCard_(ctx, 30, 338, 540, 64, 10, true, true);

    // Ícone pasta
    ctx.fillStyle = '#111111';
    ctx.beginPath();
    ctx.arc(58, 370, 15, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#d4af37';
    ctx.fillRect(50, 365, 15, 8);
    ctx.fillRect(50, 361, 9, 4);

    ctx.fillStyle = '#111111';
    ctx.textAlign = 'left';
    ctx.font = 'bold 14px Arial, sans-serif';
    ctx.fillText(pastaTexto, 82, 375);

    // Linha dourada separadora
    ctx.strokeStyle = '#d4af37';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(52, 415);
    ctx.lineTo(548, 415);
    ctx.stroke();

    // Moldura elegante do QR
    ctx.fillStyle = '#f5f5f5';
    ctx.strokeStyle = '#555555';
    ctx.lineWidth = 2;
    roundRectRtCard_(ctx, 88, 438, 424, 305, 14, true, true);

    // Área branca interna do QR
    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = '#d7d7d7';
    ctx.lineWidth = 1;
    roundRectRtCard_(ctx, 104, 454, 392, 273, 12, true, true);

    if (qrImg) {
        drawImageContainRtCard_(ctx, qrImg, 122, 470, 356, 240);
    }

    // Texto inferior no lugar do link
    ctx.textAlign = 'center';
    ctx.fillStyle = '#8c7425';
    ctx.font = 'bold 16px Arial, sans-serif';
    ctx.fillText('APONTE A CÂMERA', 300, 790);

    ctx.fillStyle = '#555555';
    ctx.font = '14px Arial, sans-serif';
    ctx.fillText('PARA LER O QR CODE', 300, 813);

    cb(card.toDataURL('image/png'));
}
function gerarQrCardRtCanvas_(dados, cb) {
    carregarScriptRt_('https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js', 'QRCode', function() {
        var temp = document.createElement('div');
        temp.style.position = 'fixed';
        temp.style.left = '-9999px';
        temp.style.top = '-9999px';
        temp.style.width = '420px';
        temp.style.height = '420px';
        document.body.appendChild(temp);

        try {
            new QRCode(temp, {
                text: dados.linkDriveImagens || '',
                width: 420,
                height: 420,
                correctLevel: QRCode.CorrectLevel.H
            });
        } catch (erroQr) {
            try { document.body.removeChild(temp); } catch (e) {}
            alert('Erro ao gerar QR Code: ' + (erroQr.message || erroQr));
            return;
        }

        setTimeout(function() {
            var qrCanvas = temp.querySelector('canvas');
            var qrImgEl = temp.querySelector('img');
            var qrDataUrl = '';

            try {
                if (qrCanvas) {
                    qrDataUrl = qrCanvas.toDataURL('image/png');
                } else if (qrImgEl && qrImgEl.src) {
                    qrDataUrl = qrImgEl.src;
                }
            } catch (e) {
                qrDataUrl = '';
            }

            try {
                document.body.removeChild(temp);
            } catch (e) {}

            if (!qrDataUrl) {
                alert('Não foi possível gerar o QR Code.');
                return;
            }

            carregarImagemRtCard_(dados.brasaoBase64 || '', function(brasaoImg) {
                carregarImagemRtCard_(qrDataUrl, function(qrImg) {
                    try {
                        desenharCardQrDepatriRt_(dados, brasaoImg, qrImg, cb);
                    } catch (erroCard) {
                        console.error('Erro ao desenhar card QR:', erroCard);
                        alert('Erro ao desenhar o card do QR Code: ' + (erroCard.message || erroCard));
                    }
                }, function() {

                });
            }, function() {
                carregarImagemRtCard_(qrDataUrl, function(qrImg) {
                    try {
                        desenharCardQrDepatriRt_(dados, null, qrImg, cb);
                    } catch (erroCard) {
                        console.error('Erro ao desenhar card QR sem brasão:', erroCard);

                    }

                });
            });

        }, 250);
    });
}

function arquivoParaBase64RtDesenv_(file) {
    return new Promise(function(resolve, reject) {
        var reader = new FileReader();

        reader.onload = function(evt) {
            try {
                var resultado = String((evt && evt.target && evt.target.result) || '');
                var partes = resultado.split(',');

                resolve({
                    nome: file.name,
                    mimeType: file.type || 'application/octet-stream',
                    base64: partes.length > 1 ? partes[1] : resultado
                });
            } catch (e) {
                reject(e);
            }
        };

        reader.onerror = function() {
            reject(new Error('Falha ao ler o arquivo: ' + file.name));
        };

        reader.readAsDataURL(file);
    });
}
