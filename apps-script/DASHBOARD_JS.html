function usuarioPodeVerDashboardPortal() {

function aplicarVisibilidadeDashboardPortal() {
  var podeVer = usuarioPodeVerDashboardPortal();

}

function carregarBootstrapDashboardPortal() {
  if (!usuarioAtual) return;
  mostrarLoadingDashboardPortal(true);


  google.script.run
    .withSuccessHandler(function(ret) {
      preencherFiltrosDashboardPortal(ret || {});
      carregarConfigPainelDepatriPortal_();
    })
    .withFailureHandler(function(err) {
      mostrarLoadingDashboardPortal(false);
      alert((err && err.message) || err || 'Erro ao carregar configuração inicial do dashboard.');
    })
    .obterDashboardBootstrap(usuarioAtual.login);
}


function carregarConfigPainelDepatriPortal_() {
  google.script.run
    .withSuccessHandler(function(ret) {
      DASHBOARD_PORTAL_STATE.bootstrapped = true;
      DASHBOARD_PORTAL_STATE.painelConfig = ret || {};
      DASHBOARD_PORTAL_STATE.painelCanEdit = !!(ret && ret.podeEditar);
      preencherVisoesDashboardPortal(ret || {});
      sincronizarFiltrosDashboardComAcesso();
      carregarDadosDashboardPortal(true);
    })
    .withFailureHandler(function(err) {
      DASHBOARD_PORTAL_STATE.bootstrapped = true;
      mostrarLoadingDashboardPortal(false);
      alert((err && err.message) || err || 'Erro ao carregar configurações do Painel DEPATRI.');
    })
    .obterDashboardDepatriConfig(usuarioAtual.login);
}


function preencherFiltrosDashboardPortal(ret) {
  var selDelegacia = document.getElementById('dashDelegacia');
  var selMes = document.getElementById('dashMes');
  var selAno = document.getElementById('dashAno');
  if (!selDelegacia || !selMes || !selAno) return;


  var htmlDelegacias = '<option value="">Todas</option>';
  (ret.delegacias || []).forEach(function(item) { htmlDelegacias += '<option value="' + escDashboard(item) + '">' + escDashboard(item) + '</option>'; });


  var htmlMeses = '<option value="">Todos</option>';
  (ret.meses || []).forEach(function(item) { htmlMeses += '<option value="' + escDashboard(item) + '">' + escDashboard(item) + '</option>'; });


  var htmlAnos = '<option value="">Todos</option>';
  (ret.anos || []).forEach(function(item) { htmlAnos += '<option value="' + escDashboard(item) + '">' + escDashboard(item) + '</option>'; });


  selDelegacia.innerHTML = htmlDelegacias;
  selMes.innerHTML = htmlMeses;
  selAno.innerHTML = htmlAnos;


  var anoAtual = String(new Date().getFullYear());
  if ([].slice.call(selAno.options).some(function(o) { return o.value === anoAtual; })) selAno.value = anoAtual;


  selDelegacia.setAttribute('data-classe', ret.classeAcesso || '');
  selDelegacia.setAttribute('data-fixada', ret.delegaciaFixada || '');
  selDelegacia.setAttribute('data-equipe-fixada', ret.equipeFixada || '');
}


function preencherVisoesDashboardPortal(ret) {
  var sel = document.getElementById('dashVisao');
  if (!sel) return;
  var atual = sel.value || 'GERAL';
  var html = '';
  (ret.visoes || [{ chave: 'GERAL', nome: 'Geral – Dashboard Operacional' }]).forEach(function(v) {
    html += '<option value="' + escDashboard(v.chave) + '">' + escDashboard(v.nome) + '</option>';
  });
  sel.innerHTML = html;
  sel.value = atual && [].slice.call(sel.options).some(function(o) { return o.value === atual; }) ? atual : 'GERAL';
}


function onChangeVisaoDashboardPortal() {
  sincronizarFiltrosDashboardComAcesso();
  carregarDadosDashboardPortal(true);
}


function sincronizarFiltrosDashboardComAcesso() {
  var selVisao = document.getElementById('dashVisao');
  var selDelegacia = document.getElementById('dashDelegacia');
  var wrapDelegacia = document.getElementById('dashDelegaciaWrap');
  var editor = document.getElementById('dashEditorDepatri');
  if (!selDelegacia || !selVisao) return;


  var visao = selVisao.value || 'GERAL';
  DASHBOARD_PORTAL_STATE.visaoAtual = visao;
  if (editor) { editor.style.display = 'none'; editor.innerHTML = ''; }


  if (visao !== 'GERAL') {
    if (wrapDelegacia) wrapDelegacia.style.display = 'none';
    selDelegacia.disabled = true;
    selDelegacia.value = '';
    return;
  }


  if (wrapDelegacia) wrapDelegacia.style.display = '';
  var classe = selDelegacia.getAttribute('data-classe') || '';
  var fixada = selDelegacia.getAttribute('data-fixada') || '';


  if (classe === 'PROPRIA' && fixada) {
    selDelegacia.value = fixada;
    selDelegacia.disabled = true;
  } else if (classe === 'EQUIPE') {
    selDelegacia.value = '';
    selDelegacia.disabled = true;
  } else {
    selDelegacia.disabled = false;
  }
}


function obterFiltrosDashboardPortal() {
  return {
    visao: ((document.getElementById('dashVisao') || {}).value || 'GERAL'),
    delegacia: ((document.getElementById('dashDelegacia') || {}).value || ''),
    mes: ((document.getElementById('dashMes') || {}).value || ''),
    ano: ((document.getElementById('dashAno') || {}).value || '')
  };
}


function erroConexaoTransitorioDashboardPortal_(err) {
  var mensagem = String((err && err.message) || err || '');
  return /HTTP\s*0|NetworkError|Failed to fetch|falha na conex[aã]o/i.test(mensagem);
}

function tratarFalhaCarregamentoDashboardPortal_(err, mensagemPadrao, tentativa) {
  DASHBOARD_PORTAL_STATE.loading = false;
  mostrarLoadingDashboardPortal(false);

  var mensagem = String((err && err.message) || err || mensagemPadrao);
  if (typeof console !== 'undefined' && console.error) {
    console.error('[DEPATRI] Falha ao carregar o dashboard:', err || mensagem);
  }

  if (erroConexaoTransitorioDashboardPortal_(err) && Number(tentativa || 0) < 1) {
    setTimeout(function() {
      carregarDadosDashboardPortal(true, Number(tentativa || 0) + 1);
    }, 900);
    return;
  }

  alert(mensagem);
}

function carregarDadosDashboardPortal(forcar, tentativa) {
  if (!usuarioAtual || DASHBOARD_PORTAL_STATE.loading) return;
  if (!document.getElementById('modDashboard') || document.getElementById('modDashboard').style.display === 'none') return;


  var filtros = obterFiltrosDashboardPortal();
  DASHBOARD_PORTAL_STATE.loading = true;
  mostrarLoadingDashboardPortal(true);


  if (filtros.visao && filtros.visao !== 'GERAL') {
    google.script.run
      .withSuccessHandler(function(ret) {
        DASHBOARD_PORTAL_STATE.loading = false;
        mostrarLoadingDashboardPortal(false);
        renderizarPainelDepatriPortal(ret || {});
      })
      .withFailureHandler(function(err) {
        tratarFalhaCarregamentoDashboardPortal_(err, 'Erro ao carregar Painel DEPATRI.', tentativa);
      })
      .obterDashboardPainelDepatriDados(usuarioAtual.login, filtros);
    return;
  }


  google.script.run
    .withSuccessHandler(function(ret) {
      DASHBOARD_PORTAL_STATE.loading = false;
      mostrarLoadingDashboardPortal(false);
      renderizarDashboardPortal(ret || {});
    })
    .withFailureHandler(function(err) {
      tratarFalhaCarregamentoDashboardPortal_(err, 'Erro ao carregar dados do dashboard.', tentativa);
    })
    .obterDashboardDados(usuarioAtual.login, filtros);
}

  var box = document.getElementById('dashLoading');
  if (box) box.style.display = exibir ? '' : 'none';
  var painel = document.getElementById('painelDepatriWrapper');
  if (painel) painel.classList.toggle('painel-loading', !!exibir);
}

  if (depatri) depatri.style.display = 'none';

    meta.innerHTML = 'Atualizado em ' + escDashboard(m.atualizadoEm || '-') +
      ' · Produtividade: ' + formatNumeroDashboard(m.totalProdutividade || 0, 0) +

  var graficos = ret.graficos || {};
  renderChartApreensoes(graficos.apreensoesPorTipo || []);
  renderChartFiosComparativo(graficos.fiosValorComparativo2025x2026 || { meses: [], serie2025: [], serie2026: [] });

    return Number(valor || 0).toLocaleString('pt-BR', { minimumFractionDigits: 0, maximumFractionDigits: 2 }) + ' kg';
  }
  return formatNumeroDashboard(valor, 0);
}

    (card.metricas || []).forEach(function(metrica, indiceMetrica) {
      var negativo = Number(metrica.evolucao || 0) < 0;
      var classeTipo = metrica.tipo === 'moeda' ? 'tipo-moeda' : (metrica.tipo === 'peso' ? 'tipo-peso' : '');
      var temDadosAnterior = metrica.temDadosAnterior !== false;
      var slotIndex = metrica.slotIndex == null ? indiceMetrica : Number(metrica.slotIndex);
      var botoesEdicao = DASHBOARD_PORTAL_STATE.painelCanEdit

          + '</span>'
        : '';

        ? '<span class="pd-card-drf-evolucao ' + (negativo ? 'negativo' : '') + '"><i class="fas ' + (negativo ? 'fa-arrow-down' : 'fa-arrow-up') + '"></i> ' + formatEvolucaoDepatri(metrica.evolucao) + '</span>'
        : (temDadosAnterior
          ? '<span class="pd-card-drf-evolucao sem-comp">Sem base percentual</span>'
          : '<span class="pd-card-drf-evolucao sem-comp">Sem comparativo</span>');

      html += '<article class="pd-card-drf-metrica">'
        + '  <div class="pd-card-drf-label"><span class="pd-card-drf-label-text">' + escDashboard(nomeContadorLivreDepatri_(metrica.fonteCardId || card.id, metrica.metricaId || metrica.id, metrica.rotuloPadrao || metrica.rotulo)) + '</span>' + botoesEdicao + '</div>'
        + '  <div class="pd-card-drf-valor ' + classeTipo + '">' + formatValorMetricaDrf_(metrica.valor || 0, metrica.tipo) + '</div>'
        + '  <div class="pd-card-drf-comp">'
        + '    <div><div class="pd-card-drf-mini">' + escDashboard(rotuloPeriodoAnterior) + '</div><div class="pd-card-drf-mini-valor">' + anteriorHtml + '</div></div>'

function formatEvolucaoDepatri(valor) {
  var n = Number(valor || 0);
  var sinal = n >= 0 ? '+' : '-';
  return sinal + Math.abs(n).toLocaleString('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + '%';
}

function obterConfigVisaoDepatri_(visao) {
  return DASHBOARD_PORTAL_STATE.painelConfig &&
    DASHBOARD_PORTAL_STATE.painelConfig.config &&
    DASHBOARD_PORTAL_STATE.painelConfig.config[visao];
}

function encontrarCardConfiguradoDepatri_(cfg, cardId) {
  var cards = (cfg && cfg.cards) || [];
  for (var i = 0; i < cards.length; i++) {
    if (String(cards[i].id || '') === String(cardId || '')) return cards[i];
  }
  return null;
}

function copiarRotulosContadorDepatri_(rotulos) {
  var copia = {};
  Object.keys(rotulos || {}).forEach(function(chave) {
    copia[chave] = rotulos[chave];
  });
  return copia;
}

function obterCardDadosPainelDepatri_(cardId) {
  var cards = (DASHBOARD_PORTAL_STATE.painelDados && DASHBOARD_PORTAL_STATE.painelDados.cards) || [];
  for (var i = 0; i < cards.length; i++) {
    if (String(cards[i].id || '') === String(cardId || '')) return cards[i];
  }
  return null;
}

function obterMetricaDadosPainelDepatri_(cardId, slotIndex) {
  var card = obterCardDadosPainelDepatri_(cardId);
  return card && card.metricas && card.metricas[Number(slotIndex)] || null;
}

function obterMetricaCatalogoGlobalDepatri_(fonteCardId, metricaId) {
  var card = obterCatalogoCardProdutividadeDepatri_(fonteCardId);
  var encontrada = null;
  (card && card.metricas || []).some(function(metrica) {
    if (String(metrica.id || '') !== String(metricaId || '')) return false;
    encontrada = metrica;
    return true;
  });
  return encontrada;
}

function metricasPadraoCardDepatri_(cardConfigurado) {
  var catalogoCard = obterCatalogoCardProdutividadeDepatri_(cardConfigurado && cardConfigurado.id);
  var rotulosLegados = cardConfigurado && cardConfigurado.rotulos || {};
  return (catalogoCard && catalogoCard.metricas || []).map(function(metrica) {
    var personalizado = String(rotulosLegados[metrica.id] || '').trim();
    return {
      fonteCardId: catalogoCard.id,
      metricaId: metrica.id,
      rotuloPersonalizado: personalizado && personalizado !== metrica.rotulo ? personalizado : ''
    };
  });
}

function metricasAtuaisCardDepatri_(cardConfigurado) {
  var cardDados = obterCardDadosPainelDepatri_(cardConfigurado && cardConfigurado.id);
  if (cardDados && Array.isArray(cardDados.metricas) && cardDados.metricas.length) {
    return cardDados.metricas.map(function(metrica) {
      return {
        fonteCardId: String(metrica.fonteCardId || cardConfigurado.id || ''),
        metricaId: String(metrica.metricaId || metrica.id || ''),
        rotuloPersonalizado: String(metrica.rotuloPersonalizado || '')
      };
    });
  }
  if (Array.isArray(cardConfigurado && cardConfigurado.metricasSelecionadas) && cardConfigurado.metricasSelecionadas.length) {
    return cardConfigurado.metricasSelecionadas.map(function(metrica) {
      return {
        fonteCardId: String(metrica.fonteCardId || ''),
        metricaId: String(metrica.metricaId || ''),
        rotuloPersonalizado: String(metrica.rotuloPersonalizado || '')
      };
    });
  }
  return metricasPadraoCardDepatri_(cardConfigurado);
}

function montarPayloadCardsAtuaisDepatri_(cfg) {
  return (cfg && cfg.cards || []).map(function(card, posicao) {
    return {
      cardId: card.id,
      ordem: posicao + 1,
      titulo: card.titulo || '',
      rotulos: copiarRotulosContadorDepatri_(card.rotulos || {}),
      metricasSelecionadas: metricasAtuaisCardDepatri_(card)
    };
  });
}

function abrirEditorContadorDepatri(botao) {
  return abrirSeletorContadorDepatri(botao);
}

function editorRotuloLegadoDesativadoDepatri_(botao) {
  if (!DASHBOARD_PORTAL_STATE.painelCanEdit) {
    return alert('Apenas a DIREÇÃO ou o ADMIN podem editar.');
  }

  var visao = ((document.getElementById('dashVisao') || {}).value || '');
  var cardId = String(botao && botao.getAttribute('data-card-id') || '').trim();
  var slotIndex = Number(botao && botao.getAttribute('data-slot-index'));
  var cfg = obterConfigVisaoDepatri_(visao);
  var catalogoCard = obterCatalogoCardProdutividadeDepatri_(cardId);
  var cardConfigurado = encontrarCardConfiguradoDepatri_(cfg, cardId);
  var metricaAtual = obterMetricaDadosPainelDepatri_(cardId, slotIndex);

  if (!visao || !cfg || !catalogoCard || !cardConfigurado || !metricaAtual) {
    return alert('Não foi possível localizar a configuração deste contador. Atualize a página e tente novamente.');
  }

  var rotuloPadrao = String(metricaAtual.rotuloPadrao || metricaAtual.rotulo || metricaAtual.id || '');
  var rotuloAtual = String(metricaAtual.rotulo || rotuloPadrao);
  DASHBOARD_PORTAL_STATE.painelEditorContador = {
    visao: visao,
    cardId: cardId,
    slotIndex: slotIndex,
    rotuloPadrao: rotuloPadrao
  };

  var box = document.getElementById('dashEditorDepatri');
  if (!box) return;
  box.innerHTML = ''
    + '<div class="pd-admin-box">'
    + '  <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">'
    + '    <div><strong>Editar nome do contador</strong><div class="small text-muted">Card: ' + escDashboard(cardConfigurado.titulo || catalogoCard.titulo || cardId) + '</div></div>'
    + '    <button type="button" class="btn btn-sm btn-outline-secondary" onclick="fecharEditorPainelDepatri()">Fechar</button>'
    + '  </div>'
    + '  <label class="form-label text-dark" for="pdEditRotuloContador">Nome exibido</label>'
    + '  <input type="text" maxlength="100" class="form-control" id="pdEditRotuloContador" value="' + escDashboard(rotuloAtual) + '" placeholder="' + escDashboard(rotuloPadrao) + '">'
    + '  <div class="small text-muted mt-2">Deixe vazio para restaurar o nome padrão: <strong>' + escDashboard(rotuloPadrao) + '</strong>.</div>'
    + '  <div class="d-flex justify-content-end gap-2 mt-3">'
    + '    <button type="button" class="btn btn-outline-secondary" onclick="fecharEditorPainelDepatri()">Cancelar</button>'
    + '    <button type="button" id="pdSalvarRotuloContador" class="btn btn-success" onclick="salvarRotuloContadorDepatri()"><i class="fas fa-save"></i> Salvar nome</button>'
    + '  </div>'
    + '</div>';
  box.style.display = '';
  box.scrollIntoView({ behavior: 'smooth', block: 'start' });

  var input = document.getElementById('pdEditRotuloContador');
  if (input) {
    input.focus();
    input.select();
  }
}

function salvarRotuloContadorDepatri() {
  if (!DASHBOARD_PORTAL_STATE.painelCanEdit || DASHBOARD_PORTAL_STATE.salvandoConfig) return;

  var editor = DASHBOARD_PORTAL_STATE.painelEditorContador;
  var cfg = editor && obterConfigVisaoDepatri_(editor.visao);
  var input = document.getElementById('pdEditRotuloContador');
  if (!editor || !cfg || !input) return alert('Editor de contador inválido. Abra o lápis novamente.');

  var novoRotulo = String(input.value || '').trim().slice(0, 100);
  var encontrouCard = false;
  var cards = montarPayloadCardsAtuaisDepatri_(cfg);
  cards.forEach(function(card) {
    if (String(card.cardId || '') === editor.cardId && card.metricasSelecionadas[editor.slotIndex]) {
      encontrouCard = true;
      card.metricasSelecionadas[editor.slotIndex].rotuloPersonalizado =
        (!novoRotulo || novoRotulo === editor.rotuloPadrao) ? '' : novoRotulo;
    }
  });

  if (!encontrouCard || !cards.length) {
    return alert('O card deste contador não está mais selecionado. Atualize a página e tente novamente.');
  }

  var btn = document.getElementById('pdSalvarRotuloContador');
  DASHBOARD_PORTAL_STATE.salvandoConfig = true;
  if (btn) {
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Salvando...';
  }

  google.script.run
    .withSuccessHandler(function(ret) {
      DASHBOARD_PORTAL_STATE.salvandoConfig = false;
      fecharEditorPainelDepatri();
      alert((ret && ret.mensagem) || 'Nome do contador salvo.');
      carregarConfigPainelDepatriPortal_();
    })
    .withFailureHandler(function(err) {
      DASHBOARD_PORTAL_STATE.salvandoConfig = false;
      if (btn) {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-save"></i> Salvar nome';
      }
      if (typeof console !== 'undefined' && console.error) {
        console.error('[DEPATRI] Falha ao salvar o nome do contador:', err);
      }
      alert((err && err.message) || err || 'Erro ao salvar o nome do contador.');
    })
    .salvarDashboardDepatriConfig(usuarioAtual.login, {
      unidade: editor.visao,
      nome: cfg.nome || '',
      cards: cards
    });
}

function fecharSeletorContadorDepatri_() {
  var popover = document.getElementById('pdContadorSeletorPopover');
  if (popover && popover.parentNode) popover.parentNode.removeChild(popover);
  DASHBOARD_PORTAL_STATE.painelSeletorContador = null;
}

function montarOpcoesSeletorContadorDepatri_(valorAtual) {
  var catalogo = (DASHBOARD_PORTAL_STATE.painelConfig && DASHBOARD_PORTAL_STATE.painelConfig.catalogoCards) || [];
  var html = '';
  catalogo.forEach(function(card) {
    if (!(card.metricas || []).length) return;
    html += '<section class="pd-contador-grupo">'
      + '<div class="pd-contador-grupo-titulo">' + escDashboard(card.titulo || card.id) + '</div>'
      + '<div class="pd-contador-grupo-lista">';
    (card.metricas || []).forEach(function(metrica) {
      var valor = String(card.id || '') + '::' + String(metrica.id || '');
      html += '<button type="button" class="pd-contador-opcao ' + (valor === valorAtual ? 'ativo' : '') + '"'
        + ' data-valor="' + escDashboard(valor) + '"'
        + ' onclick="salvarSelecaoContadorDepatri(this)">'
        + '<span>' + escDashboard(metrica.rotulo || metrica.id) + '</span></button>';
    });
    html += '</div></section>';
  });
  return html || '<div class="small text-muted p-2">Nenhum contador disponível.</div>';
}

function abrirSeletorContadorDepatri(botao) {
  if (!DASHBOARD_PORTAL_STATE.painelCanEdit || DASHBOARD_PORTAL_STATE.salvandoConfig) return;
  fecharSeletorContadorDepatri_();

  var visao = ((document.getElementById('dashVisao') || {}).value || '');
  var cardId = String(botao && botao.getAttribute('data-card-id') || '').trim();
  var slotIndex = Number(botao && botao.getAttribute('data-slot-index'));
  var cfg = obterConfigVisaoDepatri_(visao);
  var metricaAtual = obterMetricaDadosPainelDepatri_(cardId, slotIndex);
  if (!visao || !cfg || !metricaAtual) {
    return alert('Não foi possível localizar este contador. Atualize a página e tente novamente.');
  }

  var valorAtual = String(metricaAtual.fonteCardId || cardId) + '::' + String(metricaAtual.metricaId || metricaAtual.id || '');
  DASHBOARD_PORTAL_STATE.painelSeletorContador = {
    visao: visao,
    cardId: cardId,
    slotIndex: slotIndex,
    valorAtual: valorAtual
  };

  var popover = document.createElement('div');
  popover.id = 'pdContadorSeletorPopover';
  popover.className = 'pd-contador-popover';
  popover.innerHTML = ''
    + '<div class="pd-contador-popover-topo"><span>Selecionar contador</span><button type="button" class="pd-contador-popover-fechar" onclick="fecharSeletorContadorDepatri_()" aria-label="Fechar"><i class="fas fa-xmark"></i></button></div>'
    + '<div id="pdContadorListaGlobal" class="pd-contador-opcoes">'
    + montarOpcoesSeletorContadorDepatri_(valorAtual)
    + '</div>'
    + '<div id="pdContadorSeletorStatus" class="pd-contador-popover-status">Você pode repetir o mesmo contador em outras posições.</div>';
  document.body.appendChild(popover);

  var rect = botao.getBoundingClientRect();
  var largura = popover.offsetWidth || 430;
  var altura = popover.offsetHeight || 480;
  var left = Math.max(12, Math.min(window.innerWidth - largura - 12, rect.right - largura));
  var top = rect.bottom + 6;
  if (top + altura > window.innerHeight - 12) top = Math.max(12, rect.top - altura - 6);
  popover.style.left = left + 'px';
  popover.style.top = top + 'px';

  var atual = popover.querySelector('.pd-contador-opcao.ativo');
  if (atual) atual.scrollIntoView({ block: 'nearest' });
}

function salvarSelecaoContadorDepatri(controle) {
  if (!DASHBOARD_PORTAL_STATE.painelCanEdit || DASHBOARD_PORTAL_STATE.salvandoConfig) return;
  var editor = DASHBOARD_PORTAL_STATE.painelSeletorContador;
  var cfg = editor && obterConfigVisaoDepatri_(editor.visao);
  var valor = String(controle && (controle.getAttribute('data-valor') || controle.value) || '');
  if (!editor || !cfg || valor.indexOf('::') < 0) return;
  if (valor === editor.valorAtual) return fecharSeletorContadorDepatri_();

  var partes = valor.split('::');
  var fonteCardId = partes.shift();
  var metricaId = partes.join('::');
  if (!obterMetricaCatalogoGlobalDepatri_(fonteCardId, metricaId)) {
    return alert('Contador inválido. Atualize a página e tente novamente.');
  }

  var encontrouSlot = false;
  var cards = montarPayloadCardsAtuaisDepatri_(cfg);
  cards.forEach(function(card) {
    if (String(card.cardId || '') !== editor.cardId || !card.metricasSelecionadas[editor.slotIndex]) return;
    encontrouSlot = true;
    card.metricasSelecionadas[editor.slotIndex] = {
      fonteCardId: fonteCardId,
      metricaId: metricaId,
      rotuloPersonalizado: ''
    };
  });
  if (!encontrouSlot) return alert('A posição deste contador não foi localizada. Atualize a página e tente novamente.');

  DASHBOARD_PORTAL_STATE.salvandoConfig = true;
  var opcoes = document.querySelectorAll('#pdContadorListaGlobal .pd-contador-opcao');
  Array.prototype.forEach.call(opcoes, function(opcao) { opcao.disabled = true; });
  var status = document.getElementById('pdContadorSeletorStatus');
  if (status) status.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Salvando seleção...';

  google.script.run
    .withSuccessHandler(function() {
      DASHBOARD_PORTAL_STATE.salvandoConfig = false;
      fecharSeletorContadorDepatri_();
      carregarConfigPainelDepatriPortal_();
    })
    .withFailureHandler(function(err) {
      DASHBOARD_PORTAL_STATE.salvandoConfig = false;
      Array.prototype.forEach.call(opcoes, function(opcao) { opcao.disabled = false; });
      if (status) status.textContent = 'Falha ao salvar.';
      if (typeof console !== 'undefined' && console.error) {
        console.error('[DEPATRI] Falha ao trocar o contador:', err);
      }
      alert((err && err.message) || err || 'Erro ao trocar o contador.');
    })
    .salvarDashboardDepatriConfig(usuarioAtual.login, {
      unidade: editor.visao,
      nome: cfg.nome || '',
      cards: cards
    });
}

function abrirEditorPainelDepatri() {
  if (!DASHBOARD_PORTAL_STATE.painelCanEdit) return alert('Apenas a DIREÇÃO ou o ADMIN podem editar.');
  var visao = ((document.getElementById('dashVisao') || {}).value || '');
  if (!visao || visao === 'GERAL') return;

  if (['DRF', 'DRFV', 'DAS', 'DDF'].indexOf(visao) > -1) {

    + '  </div>'
    + '  <div class="mb-3"><label class="form-label text-dark">Nome da unidade no painel</label><input type="text" class="form-control" id="pdEditNomeUnidade" value="' + escDashboard(cfg.nome || '') + '"></div>'
    + '  <div class="table-responsive"><table class="table table-sm align-middle">'
    + '    <thead><tr><th>Ativo</th><th>Ordem</th><th>crimeChave</th><th>crimeExibicao</th><th>Ícone FontAwesome</th></tr></thead><tbody>';


  (cfg.crimes || []).forEach(function(c, idx) {
    html += '<tr data-pd-edit-row="' + idx + '">'
      + '<td><input type="checkbox" class="form-check-input pd-edit-ativo" ' + (c.ativo !== false ? 'checked' : '') + '></td>'
      + '<td><input type="number" class="form-control form-control-sm pd-edit-ordem" value="' + escDashboard(c.ordem || (idx + 1)) + '" style="width:80px"></td>'
      + '<td><input type="text" class="form-control form-control-sm pd-edit-chave" value="' + escDashboard(c.crimeChave || '') + '" readonly></td>'
      + '<td><input type="text" class="form-control form-control-sm pd-edit-exibicao" value="' + escDashboard(c.crimeExibicao || c.crimeChave || '') + '"></td>'
      + '<td><input type="text" class="form-control form-control-sm pd-edit-icone" value="' + escDashboard(c.icone || 'fa-chart-column') + '" placeholder="fa-car-side"></td>'
      + '</tr>';
  });


  html += '    </tbody></table></div>'
    + '  <div class="d-flex justify-content-end gap-2">'
    + '    <button class="btn btn-outline-secondary" onclick="fecharEditorPainelDepatri()">Cancelar</button>'
    + '    <button id="pdSalvarEditorPainel" class="btn btn-success" onclick="salvarEditorPainelDepatri()"><i class="fas fa-save"></i> Salvar configuração</button>'
    + '  </div>'
    + '</div>';


  box.innerHTML = html;
  box.style.display = '';
  box.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function nomeContadorLivreDepatri_(fonte, id, fallback) {
  var card = obterCatalogoCardProdutividadeDepatri_(fonte);
  var metrica = obterMetricaCatalogoGlobalDepatri_(fonte, id);
  var nome = metrica ? metrica.rotulo : (fallback || id);
  // Qualifica rótulos curtos como "Recuperados" e "Com relatório".
  if (fonte === 'acervo_inqueritos') return 'ÚLTIMO ACERVO DE INQUÉRITOS INFORMADO';
  var qualificar = ['inqueritos_remetidos', 'veiculos', 'interceptacoes', 'quebras_sigilo', 'indiciamentos_flagrante', 'indiciamentos_portaria', 'inqueritos_instaurados', 'inqueritos_concluidos'];
  return card && qualificar.indexOf(fonte) > -1 ? card.titulo + ' — ' + nome : nome;
}

function abrirSeletorCardsProdutividadeDepatri_(visao, cfg) {
  var box = document.getElementById('dashEditorDepatri');
  if (!box) return;
  DASHBOARD_PORTAL_STATE.contadoresLivres = [];
  (cfg.cards || []).forEach(function(card) {
    metricasAtuaisCardDepatri_(card).forEach(function(m) {
      DASHBOARD_PORTAL_STATE.contadoresLivres.push(m.fonteCardId + '::' + m.metricaId);
    });
  });
  box.innerHTML = '<div class="pd-admin-box"><strong>Organizar contadores</strong>'
    + '<p>Escolha os indicadores e a ordem de exibição nesta página. O nome acompanha automaticamente o contador.</p>'
    + '<div id="pdListaLivre" class="pd-selector-grid"></div>'
    + '<div class="d-flex gap-2 mt-3"><button class="btn btn-outline-primary" onclick="adicionarContadorLivreDepatri_()">Adicionar contador</button>'
    + '<button id="pdSalvarEditorPainel" class="btn btn-success" onclick="salvarEditorPainelDepatri()">Salvar configuração</button>'
    + '<button class="btn btn-outline-secondary" onclick="fecharEditorPainelDepatri()">Cancelar</button></div></div>';
  renderEditorLivreDepatri_();
  box.style.display = '';
  box.scrollIntoView({behavior: 'smooth', block: 'start'});
}

function renderEditorLivreDepatri_() {
  var lista = DASHBOARD_PORTAL_STATE.contadoresLivres || [];
  var catalogo = DASHBOARD_PORTAL_STATE.painelConfig.catalogoCards || [];
  document.getElementById('pdListaLivre').innerHTML = lista.map(function(valor, i) {
    var opcoes = '';
    catalogo.forEach(function(card) {
      (card.metricas || []).forEach(function(m) {
        var chave = card.id + '::' + m.id;
        opcoes += '<option value="' + escDashboard(chave) + '" ' + (chave === valor ? 'selected' : '') + '>'
          + escDashboard(nomeContadorLivreDepatri_(card.id, m.id)) + '</option>';
      });
    });
    return '<div class="pd-selector-slot"><label>Posição ' + (i + 1) + '</label>'
      + '<select class="form-select" onchange="DASHBOARD_PORTAL_STATE.contadoresLivres[' + i + ']=this.value">' + opcoes + '</select>'
      + '<div class="d-flex gap-2 mt-2"><button class="btn btn-sm btn-outline-secondary" onclick="moverContadorLivreDepatri_(' + i + ',-1)" ' + (i === 0 ? 'disabled' : '') + '>Anterior</button>'
      + '<button class="btn btn-sm btn-outline-secondary" onclick="moverContadorLivreDepatri_(' + i + ',1)" ' + (i === lista.length - 1 ? 'disabled' : '') + '>Próximo</button>'
      + '<button class="btn btn-sm btn-outline-danger" onclick="removerContadorLivreDepatri_(' + i + ')">Remover</button></div></div>';
  }).join('');
}
function adicionarContadorLivreDepatri_() {
  var lista = DASHBOARD_PORTAL_STATE.contadoresLivres;
  if (lista.length >= 96) return alert('Limite de 96 contadores.');
  var card = DASHBOARD_PORTAL_STATE.painelConfig.catalogoCards[0];
  lista.push(card.id + '::' + card.metricas[0].id);
  renderEditorLivreDepatri_();
}
function removerContadorLivreDepatri_(i) {
  if (DASHBOARD_PORTAL_STATE.contadoresLivres.length <= 1) return alert('Mantenha pelo menos um contador.');
  DASHBOARD_PORTAL_STATE.contadoresLivres.splice(i, 1);
  renderEditorLivreDepatri_();
}
function moverContadorLivreDepatri_(i, direcao) {
  var lista = DASHBOARD_PORTAL_STATE.contadoresLivres, j = i + direcao;
  if (j < 0 || j >= lista.length) return;
  var valor = lista[i]; lista[i] = lista[j]; lista[j] = valor;
  renderEditorLivreDepatri_();
}
function payloadContadoresLivresDepatri_() {
  var lista = DASHBOARD_PORTAL_STATE.contadoresLivres || [];
  var catalogo = DASHBOARD_PORTAL_STATE.painelConfig.catalogoCards;
  var cards = [];
  lista.forEach(function(valor, i) {
    var grupo = Math.floor(i / 12), partes = valor.split('::');
    if (!cards[grupo]) cards[grupo] = {cardId: catalogo[grupo].id, ordem: grupo + 1, rotulos: {}, metricasSelecionadas: []};
    cards[grupo].metricasSelecionadas.push({fonteCardId: partes.shift(), metricaId: partes.join('::'), rotuloPersonalizado: ''});
  });
  return cards;
}

function obterCatalogoCardProdutividadeDepatri_(cardId) {
  var catalogo = (DASHBOARD_PORTAL_STATE.painelConfig && DASHBOARD_PORTAL_STATE.painelConfig.catalogoCards) || [];
  for (var i = 0; i < catalogo.length; i++) {
    if (catalogo[i].id === cardId) return catalogo[i];
  }
  return null;
}

function atualizarEditorRotulosCardDepatri_(posicao) {
  var select = document.getElementById('pdCardSlot' + posicao);
  var custom = document.getElementById('pdCardCustom' + posicao);
  if (!select || !custom) return;

  var cardId = String(select.value || '').trim();
  var catalogoCard = obterCatalogoCardProdutividadeDepatri_(cardId);
  if (!cardId || !catalogoCard) {
    custom.innerHTML = '';
    custom.style.display = 'none';
    return;
  }

  var configurados = DASHBOARD_PORTAL_STATE.painelEditorCards || [];
  var configurado = {};
  for (var i = 0; i < configurados.length; i++) {
    if (String(configurados[i].id || '') === cardId) {
      configurado = configurados[i];
      break;
    }
  }
  var titulo = configurado.titulo || catalogoCard.titulo || '';
  var configuradoParaMetricas = Object.assign({}, configurado, { id: cardId });
  var selecoes = metricasAtuaisCardDepatri_(configuradoParaMetricas);
  var html = ''
    + '<div class="pd-selector-custom-titulo">Personalizar nomes</div>'
    + '<div class="pd-selector-custom-campo">'
    + '  <label for="pdCardTitulo' + posicao + '">Título principal do card</label>'
    + '  <input id="pdCardTitulo' + posicao + '" type="text" maxlength="100" class="form-control form-control-sm pd-card-titulo" value="' + escDashboard(titulo) + '" placeholder="' + escDashboard(catalogoCard.titulo || '') + '">'
    + '</div>';

  if (selecoes.length) {
    html += '<div class="pd-selector-custom-titulo">Nomes dos indicadores</div><div class="pd-selector-custom-metricas">';
    selecoes.forEach(function(selecao, slotIndex) {
      var metrica = obterMetricaCatalogoGlobalDepatri_(selecao.fonteCardId, selecao.metricaId);
      if (!metrica) return;
      var fonteCard = obterCatalogoCardProdutividadeDepatri_(selecao.fonteCardId);
      var rotuloPadrao = metrica.rotulo || metrica.id || '';
      var valor = selecao.rotuloPersonalizado || rotuloPadrao;
      var descricao = (fonteCard && fonteCard.titulo ? fonteCard.titulo + ' — ' : '') + rotuloPadrao;
      html += '<div class="pd-selector-custom-campo">'
        + '<label>Contador ' + (slotIndex + 1) + ': ' + escDashboard(descricao) + '</label>'
        + '<input type="text" maxlength="100" class="form-control form-control-sm pd-card-rotulo"'
        + ' data-slot-index="' + slotIndex + '"'
        + ' data-fonte-card-id="' + escDashboard(selecao.fonteCardId) + '"'
        + ' data-metrica-id="' + escDashboard(selecao.metricaId) + '"'
        + ' data-rotulo-padrao="' + escDashboard(rotuloPadrao) + '"'
        + ' value="' + escDashboard(valor) + '" placeholder="' + escDashboard(rotuloPadrao) + '">'
        + '</div>';
    });
    html += '</div>';
  }

  custom.innerHTML = html;
  custom.style.display = '';
}


function fecharEditorPainelDepatri() {
  fecharSeletorContadorDepatri_();
  var box = document.getElementById('dashEditorDepatri');
  if (box) { box.style.display = 'none'; box.innerHTML = ''; }
  DASHBOARD_PORTAL_STATE.painelEditorContador = null;
  DASHBOARD_PORTAL_STATE.salvandoConfig = false;
}


function salvarEditorPainelDepatri() {
  if (!DASHBOARD_PORTAL_STATE.painelCanEdit) return alert('Apenas a DIREÇÃO ou o ADMIN podem editar.');
  if (DASHBOARD_PORTAL_STATE.salvandoConfig) return;
  var visao = ((document.getElementById('dashVisao') || {}).value || '');
  var cfg = DASHBOARD_PORTAL_STATE.painelConfig && DASHBOARD_PORTAL_STATE.painelConfig.config && DASHBOARD_PORTAL_STATE.painelConfig.config[visao];
  var nome = ((document.getElementById('pdEditNomeUnidade') || {}).value || (cfg && cfg.nome) || '').trim();
  var cards = [];

  if (['DRF', 'DRFV', 'DAS', 'DDF'].indexOf(visao) > -1) {
    cards = payloadContadoresLivresDepatri_();
    if (!cards.length) return alert('Selecione pelo menos um contador.');
  } else {
    var rows = document.querySelectorAll('[data-pd-edit-row]');
    Array.prototype.forEach.call(rows, function(row) {
      cards.push({
        ativo: !!(row.querySelector('.pd-edit-ativo') && row.querySelector('.pd-edit-ativo').checked),
        ordem: Number((row.querySelector('.pd-edit-ordem') || {}).value || 999),
        crimeChave: ((row.querySelector('.pd-edit-chave') || {}).value || '').trim(),
        crimeExibicao: ((row.querySelector('.pd-edit-exibicao') || {}).value || '').trim(),
        icone: ((row.querySelector('.pd-edit-icone') || {}).value || '').trim()
      });
    });
  }

  var btnSalvar = document.getElementById('pdSalvarEditorPainel');
  DASHBOARD_PORTAL_STATE.salvandoConfig = true;
  if (btnSalvar) {
    btnSalvar.disabled = true;
    btnSalvar.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Salvando...';
  }

  google.script.run
    .withSuccessHandler(function(ret) {
      DASHBOARD_PORTAL_STATE.salvandoConfig = false;
      fecharEditorPainelDepatri();
      alert((ret && ret.mensagem) || 'Configuração salva.');
      carregarConfigPainelDepatriPortal_();
    })
    .withFailureHandler(function(err) {
      DASHBOARD_PORTAL_STATE.salvandoConfig = false;
      if (btnSalvar) {
        btnSalvar.disabled = false;
        btnSalvar.innerHTML = '<i class="fas fa-save"></i> Salvar configuração';
      }
      if (typeof console !== 'undefined' && console.error) {
        console.error('[DEPATRI] Falha ao salvar a configuração do painel:', err);
      }
      alert((err && err.message) || err || 'Erro ao salvar configuração.');
    })
    .salvarDashboardDepatriConfig(usuarioAtual.login, { unidade: visao, nome: nome, cards: cards });
}


// ============================================================================
// UTILITÁRIOS E GRÁFICOS GERAIS
// ============================================================================
function escDashboard(texto) {
  return String(texto == null ? '' : texto)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}


function formatNumeroDashboard(valor, casas) {
  var numero = Number(valor || 0);
  return numero.toLocaleString('pt-BR', { minimumFractionDigits: casas || 0, maximumFractionDigits: casas || 0 });
}


function formatMoedaDashboard(valor) {
  var numero = Number(valor || 0);
  return numero.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL', minimumFractionDigits: 2, maximumFractionDigits: 2 });
}


function formatValorCardDashboard(valor, tipo) {
  if (tipo === 'moeda') return formatMoedaDashboard(valor);
  if (tipo === 'numero_2') return formatNumeroDashboard(valor, 2);
  return formatNumeroDashboard(valor, 0);
}


function getChartDashboard(id) {
  var el = document.getElementById(id);
  if (!el || !window.echarts) return null;
  if (!DASHBOARD_PORTAL_STATE.charts[id]) DASHBOARD_PORTAL_STATE.charts[id] = echarts.init(el, null, { renderer: 'canvas' });
  return DASHBOARD_PORTAL_STATE.charts[id];
}


function destruirChartsDashboardPortal_() {
  Object.keys(DASHBOARD_PORTAL_STATE.charts || {}).forEach(function(id) {
    try { DASHBOARD_PORTAL_STATE.charts[id].dispose(); } catch (e) {}
  });
  DASHBOARD_PORTAL_STATE.charts = {};
}


function baseOptionDashboard() {
  return { backgroundColor: 'transparent', animationDuration: 500, textStyle: { color: '#f8f9fa' }, tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } }, grid: { left: 40, right: 20, top: 35, bottom: 40, containLabel: true } };
}


function setOptionDashboard(id, option) {
  var chart = getChartDashboard(id);
  if (!chart) return;

function renderChartInqueritos(data) {
  var instaurados = data.instaurados || [], concluidos = data.concluidos || [], mapa = {};
  instaurados.forEach(function(i) { mapa[i.nome] = mapa[i.nome] || { inst: 0, conc: 0 }; mapa[i.nome].inst = i.valor; });
  concluidos.forEach(function(i) { mapa[i.nome] = mapa[i.nome] || { inst: 0, conc: 0 }; mapa[i.nome].conc = i.valor; });
  var categorias = Object.keys(mapa).sort(function(a, b) { return ((mapa[b].inst || 0) + (mapa[b].conc || 0)) - ((mapa[a].inst || 0) + (mapa[a].conc || 0)); }).slice(0, 12);
  var base = baseOptionDashboard();
  setOptionDashboard('chartInqueritos', Object.assign(base, { legend: { top: 0, textStyle: { color: '#f8f9fa' } }, xAxis: { type: 'value', axisLabel: { color: '#adb5bd' } }, yAxis: { type: 'category', data: categorias, axisLabel: { color: '#adb5bd' } }, series: [{ name: 'Instaurados', type: 'bar', data: categorias.map(function(c) { return mapa[c].inst || 0; }), barMaxWidth: 20 }, { name: 'Concluídos', type: 'bar', data: categorias.map(function(c) { return mapa[c].conc || 0; }), barMaxWidth: 20 }] }));
}

function renderChartIndiciamentos(lista) { var base = baseOptionDashboard(); setOptionDashboard('chartIndiciamentos', Object.assign(base, { xAxis: { type: 'category', data: (lista || []).map(function(i) { return i.nome; }), axisLabel: { color: '#adb5bd', interval: 0, rotate: 12 } }, yAxis: { type: 'value', axisLabel: { color: '#adb5bd' } }, series: [{ type: 'bar', data: (lista || []).map(function(i) { return i.valor; }), barMaxWidth: 42 }] })); }

function renderChartPrisoesTipoPenal(lista) { var base = baseOptionDashboard(); setOptionDashboard('chartPrisoesTipoPenal', Object.assign(base, { xAxis: { type: 'value', axisLabel: { color: '#adb5bd' } }, yAxis: { type: 'category', data: (lista || []).map(function(i) { return i.nome; }), axisLabel: { color: '#adb5bd' } }, series: [{ type: 'bar', data: (lista || []).map(function(i) { return i.valor; }), barMaxWidth: 18 }] })); }
function renderChartPrisoesTempo(lista) { var base = baseOptionDashboard(); setOptionDashboard('chartPrisoesTempo', Object.assign(base, { xAxis: { type: 'category', data: (lista || []).map(function(i) { return i.nome; }), axisLabel: { color: '#adb5bd' } }, yAxis: { type: 'value', axisLabel: { color: '#adb5bd' } }, series: [{ type: 'line', smooth: true, areaStyle: {}, data: (lista || []).map(function(i) { return i.valor; }) }] })); }

  var base = baseOptionDashboard();
  setOptionDashboard('chartEquipes', Object.assign(base, { legend: { type: 'scroll', top: 0, textStyle: { color: '#f8f9fa' } }, xAxis: { type: 'category', data: categorias, axisLabel: { color: '#adb5bd', interval: 0, rotate: 12 } }, yAxis: { type: 'value', axisLabel: { color: '#adb5bd' } }, series: [ { name: 'Demandas evoluídas', type: 'bar', data: (lista || []).map(function(i) { return i.dados.evoluidas; }) }, { name: 'Relatórios', type: 'bar', data: (lista || []).map(function(i) { return i.dados.relatorios; }) }, { name: 'Suspeitos identificados', type: 'bar', data: (lista || []).map(function(i) { return i.dados.suspeitosIdentificados; }) }, { name: 'Suspeitos presos', type: 'bar', data: (lista || []).map(function(i) { return i.dados.suspeitosPresos; }) }, { name: 'Veículos rec./apr.', type: 'bar', data: (lista || []).map(function(i) { return i.dados.veiculos; }) }, { name: 'Armas', type: 'bar', data: (lista || []).map(function(i) { return i.dados.armas; }) } ] }));
}


function filtrarTabelaDashboardPortal() {
  var termo = ((document.getElementById('dashFiltroTabela') || {}).value || '').trim().toUpperCase();
  DASHBOARD_PORTAL_STATE.pesquisaTabela = termo;


  var linhas = (DASHBOARD_PORTAL_STATE.tabelaCompleta || []).filter(function(item) {
    if (!termo) return true;
    var texto = [item.data, item.delegacia, item.ano, item.mes, item.tipoDado, item.categoriaPrincipal, item.subcategoria, item.equipe, item.status, item.procedimento].join(' ').toUpperCase();
    return texto.indexOf(termo) > -1;
  });


  var body = document.getElementById('dashTabelaBody');
  if (!body) return;


  if (!linhas.length) {
    body.innerHTML = '<tr><td colspan="12" class="text-center text-muted">Nenhum registro encontrado para o filtro atual.</td></tr>';
  } else {
    body.innerHTML = linhas.map(function(item) {
      return '<tr>'
        + '<td>' + escDashboard(item.data || '') + '</td>'
        + '<td>' + escDashboard(item.delegacia || '') + '</td>'
        + '<td>' + escDashboard(item.ano || '') + '</td>'
        + '<td>' + escDashboard(item.mes || '') + '</td>'
        + '<td>' + escDashboard(item.tipoDado || '') + '</td>'
        + '<td>' + escDashboard(item.categoriaPrincipal || '') + '</td>'
        + '<td>' + escDashboard(item.subcategoria || '') + '</td>'
        + '<td class="text-end">' + formatNumeroDashboard(item.quantidade || 0, 0) + '</td>'
        + '<td class="text-end">' + (Number(item.valor || 0) > 0 ? formatMoedaDashboard(item.valor || 0) : '-') + '</td>'
        + '<td>' + escDashboard(item.equipe || '') + '</td>'
        + '<td>' + escDashboard(item.status || '') + '</td>'
        + '<td>' + escDashboard(item.procedimento || '') + '</td>'
        + '</tr>';
    }).join('');
  }


  var resumo = document.getElementById('dashResumoTabela');
  if (resumo) resumo.innerHTML = 'Registros exibidos: ' + formatNumeroDashboard(linhas.length, 0);
}


function resizeChartsDashboardPortal() {
  Object.keys(DASHBOARD_PORTAL_STATE.charts || {}).forEach(function(id) { try { DASHBOARD_PORTAL_STATE.charts[id].resize(); } catch (e) {} });
}


function iniciarAutoRefreshDashboardPortal() {
  if (DASHBOARD_PORTAL_STATE.intervalo) return;
  DASHBOARD_PORTAL_STATE.intervalo = setInterval(function() {
    var tela = document.getElementById('modDashboard');
    if (!tela || tela.style.display === 'none') return;
    carregarDadosDashboardPortal();
  }, 120000);
}


function __dashboardNotifySave__() {
  var tela = document.getElementById('modDashboard');
  if (!tela || tela.style.display === 'none') return;
  carregarDadosDashboardPortal(true);
}


window.addEventListener('resize', function() { resizeChartsDashboardPortal(); });
</script>
