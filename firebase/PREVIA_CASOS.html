<body><header class="topbar"><div class="brand"><span class="brand-mark">D</span><div>PORTAL DEPATRI<small>Prévia com dados fictícios</small></div></div></header>
<main><p>DEMONSTRAÇÃO · Use dados fictícios. Os cadastros e PDFs ficam nesta aba e desaparecem ao recarregar a página.</p>
<nav class="module-nav" aria-label="Módulos"><button type="button" data-module="cases" aria-pressed="true">Casos prioritários</button><button type="button" class="secondary" data-module="demands" aria-pressed="false">Demandas Ativas</button></nav>
<div id="cases"></div><div id="demands" hidden></div></main>
<script type="module">
const key = value => String(value ?? '').normalize('NFKC').normalize('NFD')
  .replace(/[\u0300-\u036f]/g, '').trim().replace(/\s+/g, ' ').toUpperCase();

class CasesStore {
  constructor(call, uuid = () => crypto.randomUUID()) {
    this.call = call; this.uuid = uuid; this.listeners = new Set();
    this.epoch = 0; this.version = 0; this.busy = false; this.pending = null;
    this.state = {casos: [], tipos: [], podeCadastrar: false, sessionCleared: false};
  }
  snapshot() { return structuredClone(this.state); }
  emit() { for (const listener of this.listeners) listener(this.snapshot()); }
  subscribe(listener) { this.listeners.add(listener); listener(this.snapshot()); return () => this.listeners.delete(listener); }
  reset() {
    this.epoch++; this.version++; this.pending = null;
    this.state = {casos: [], tipos: [], podeCadastrar: false, sessionCleared: true}; this.emit();
  }
  async refresh() {
    const epoch = this.epoch, version = ++this.version, cases = new Map(), seen = new Set();
    let cursor = null, page;
    do {
      page = await this.call('obterBootstrapCasosPrioritarios', {cursor});
      if (epoch !== this.epoch || version !== this.version) return this.snapshot();
      for (const c of page.casos) cases.set(c.id, c);
      cursor = page.proximaPagina;
      if (cursor) {
        const token = JSON.stringify(cursor);
        if (seen.has(token)) throw new Error('Não foi possível atualizar a lista completa.');
        seen.add(token);
      }
    } while (cursor);
    this.state = {casos: [...cases.values()].sort((a, b) => a.nomeCaso.localeCompare(b.nomeCaso, 'pt-BR')),
      tipos: page.tipos, podeCadastrar: page.podeCadastrar === true, sessionCleared: false};
    this.emit(); return this.snapshot();
  }
  async create(input) {
    if (!this.state.podeCadastrar) throw new Error('Seu perfil permite apenas consultar casos.');
    if (this.busy) throw new Error('Aguarde a conclusão do cadastro.');
    const payload = {nomeCaso: input.nomeCaso.trim(), tipoCrime: input.tipoCrime, subtipoCrime: input.subtipoCrime || ''};
    const signature = JSON.stringify([key(payload.nomeCaso), key(payload.tipoCrime), key(payload.subtipoCrime)]);
    if (this.pending?.signature !== signature) this.pending = {signature, id: this.uuid()};
    const epoch = this.epoch;
    this.busy = true;
    try {
      const saved = await this.call('salvarCasoPrioritarioSemEventos', {...payload, solicitacaoId: this.pending.id});
      if (epoch !== this.epoch) throw new Error('A sessão mudou. Entre novamente para consultar o cadastro.');
      this.pending = null; this.version++;
      // A gravação confirmada alimenta todos os seletores imediatamente.
      this.state.casos = [...this.state.casos.filter(c => c.id !== saved.id), saved]
        .sort((a, b) => a.nomeCaso.localeCompare(b.nomeCaso, 'pt-BR'));
      this.emit();
      let listaAtualizada = true;
      try { await this.refresh(); } catch { listaAtualizada = false; }
      if (epoch !== this.epoch) throw new Error('A sessão mudou. Entre novamente para consultar o cadastro.');
      return {...saved, listaAtualizada};
    } finally { this.busy = false; }
  }
  async demands(casoId, cursor = null) {
    const epoch = this.epoch;
    const result = await this.call('listarDemandasCasoPrioritario', {casoId, cursor});
    if (epoch !== this.epoch) throw new Error('Sessão encerrada.');
    return result;
  }
  async bindDemand(demandaId, casoId) {
    const epoch = this.epoch;
    const result = await this.call('vincularCasoDemanda', {demandaId, casoId});
    if (epoch !== this.epoch) throw new Error('Sessão encerrada.');
    return result;
  }
}

function option(select, value, label, caseId = '') {
  const el = select.ownerDocument.createElement('option');
  el.value = value; el.textContent = label; el.dataset.casoId = caseId;
  select.append(el); return el;
}
function bindCaseSelector(store, select, {placeholder = 'Selecione um caso', valueMode = 'id'} = {}) {
  if (!['id', 'nome'].includes(valueMode)) throw new Error('Formato de seletor inválido.');
  const syncId = () => { select.dataset.casoId = select.selectedOptions[0]?.dataset.casoId || ''; };
  const unsubscribe = store.subscribe(({casos, sessionCleared}) => {
    const previous = sessionCleared ? '' : select.value, previousId = sessionCleared ? '' : select.dataset.casoId || '';
    const previousLabel = select.selectedOptions[0]?.textContent;
    select.replaceChildren(); option(select, '', placeholder);
    for (const c of casos) option(select, valueMode === 'id' ? c.id : c.nomeCaso, c.nomeCaso, c.id);
    const match = [...select.options].find(o => previousId ? o.dataset.casoId === previousId : o.value === previous);
    if (match) select.value = match.value;
    else if (previous) {
      // Preserva a referência histórica para revisão, sem convertê-la em um caso arbitrário.
      const old = option(select, previous, previousLabel || `${previous} (registro anterior)`);
      old.dataset.unmapped = 'true'; select.value = previous;
    }
    syncId();
  });
  select.addEventListener('change', syncId);
  return () => { unsubscribe(); select.removeEventListener('change', syncId); };
}
function mountCases(root, store) {
  root.innerHTML = `
    <header class="section-heading"><div><p class="eyebrow">ACOMPANHAMENTO DE CASOS</p>
      <h1>Casos prioritários</h1><p>Cadastre um caso e consulte as demandas vinculadas.</p></div>
      <button type="button" data-new>Novo caso</button></header>
    <section class="panel" data-create hidden><h2>Cadastrar caso</h2>
      <form data-form><div class="fields">
        <label>Nome do caso<input name="nomeCaso" maxlength="150" required autocomplete="off" placeholder="Ex.: FURTO DE HILUX"></label>
        <label>Tipo de crime<select name="tipoCrime" required><option value="">Selecione</option></select></label>
        <label>Subtipo de crime<select name="subtipoCrime" required disabled><option value="">Selecione o tipo primeiro</option></select></label>
      </div><div class="actions"><button type="submit">Cadastrar caso</button><button type="button" class="secondary" data-cancel>Cancelar</button></div>
      <p data-save-message role="status" aria-live="polite"></p></form></section>
    <section class="panel"><div class="select-row"><label>Selecione um caso<select data-case></select></label>
      <button type="button" class="secondary" data-refresh>Atualizar lista</button></div>
      <p data-list-message role="status" aria-live="polite"></p>
      <div data-summary hidden><dl class="case-summary"><div><dt>Nome do caso</dt><dd data-name></dd></div>
        <div><dt>Tipo de crime</dt><dd data-type></dd></div><div><dt>Subtipo de crime</dt><dd data-subtype></dd></div></dl></div>
    </section>
    <section class="panel" data-linked hidden><h2>Demandas vinculadas</h2>
      <p data-demand-message role="status" aria-live="polite"></p>
      <div class="table-scroll"><table><thead><tr><th>Data</th><th>Procedimento</th><th>Unidade responsável</th><th>Status</th><th>Crime</th></tr></thead><tbody></tbody></table></div>
      <button type="button" class="secondary" data-more hidden>Carregar mais</button></section>`;
  const $ = selector => root.querySelector(selector);
  const form = $('[data-form]'), type = form.elements.tipoCrime, subtype = form.elements.subtipoCrime;
  const select = $('[data-case]'), saveMessage = $('[data-save-message]'), listMessage = $('[data-list-message]');
  const demandMessage = $('[data-demand-message]');
  let state = store.snapshot(), requestVersion = 0, next = null, destroyed = false, loading = false;
  const unbind = bindCaseSelector(store, select);
  function populateSubtypes(previous = '') {
    const types = state.tipos.find(c => c.tipo === type.value)?.subtipos || [];
    subtype.replaceChildren();
    option(subtype, '', !type.value ? 'Selecione o tipo primeiro' : types.length ? 'Selecione' : 'Sem subtipo cadastrado');
    types.forEach(s => option(subtype, s, s));
    subtype.disabled = !types.length; subtype.required = types.length > 0;
    if (types.includes(previous)) subtype.value = previous;
  }
  function summary() {
    const c = state.casos.find(row => row.id === select.value);
    $('[data-summary]').hidden = !c;
    if (c) { $('[data-name]').textContent = c.nomeCaso; $('[data-type]').textContent = c.tipoCrime; $('[data-subtype]').textContent = c.subtipoCrime || 'Sem subtipo cadastrado'; }
  }
  const unsubscribe = store.subscribe(s => {
    state = s; const previousType = type.value, previousSubtype = subtype.value;
    type.replaceChildren(); option(type, '', 'Selecione'); state.tipos.forEach(c => option(type, c.tipo, c.tipo));
    if (state.tipos.some(c => c.tipo === previousType)) type.value = previousType;
    populateSubtypes(previousSubtype); $('[data-new]').hidden = !state.podeCadastrar;
    if (!state.podeCadastrar) $('[data-create]').hidden = true;
    summary();
  });
  async function queryDemands(append = false) {
    const caseId = select.dataset.casoId;
    const current = ++requestVersion;
    if (!append) { $('tbody').replaceChildren(); next = null; }
    $('[data-linked]').hidden = !caseId; $('[data-more]').hidden = true; summary();
    if (!caseId) return;
    loading = true; demandMessage.textContent = 'Carregando demandas…';
    try {
      const response = await store.demands(caseId, append ? next : null);
      if (destroyed || current !== requestVersion || select.dataset.casoId !== caseId) return;
      for (const d of response.demandas) {
        const tr = root.ownerDocument.createElement('tr');
        for (const value of [d.dataOcorrencia, d.numeroProcedimento, d.unidadeResponsavel, d.status, d.crimeTipo]) {
          const td = root.ownerDocument.createElement('td'); td.textContent = value || '—'; tr.append(td);
        }
        $('tbody').append(tr);
      }
      next = response.proximaPagina; $('[data-more]').hidden = !next;
      demandMessage.textContent = $('tbody').children.length ? '' : 'Nenhuma demanda vinculada a este caso para o seu acesso.';
    } catch (error) { if (!destroyed && current === requestVersion) demandMessage.textContent = error.message; }
    finally { if (current === requestVersion) loading = false; }
  }
  function setMode(mode) {
    $('[data-create]').hidden = mode !== 'novo' || !state.podeCadastrar;
    if (!$('[data-create]').hidden) form.elements.nomeCaso.focus();
  }
  $('[data-new]').onclick = () => setMode('novo');
  $('[data-cancel]').onclick = () => setMode('visualizar');
  type.onchange = () => populateSubtypes();
  select.addEventListener('change', () => queryDemands());
  $('[data-more]').onclick = () => { if (!loading) queryDemands(true); };
  async function refresh() {
    $('[data-refresh]').disabled = true; listMessage.textContent = 'Atualizando lista…';
    try { await store.refresh(); if (!destroyed) { listMessage.textContent = ''; await queryDemands(); } }
    catch (error) { if (!destroyed) listMessage.textContent = error.message; }
    finally { if (!destroyed) $('[data-refresh]').disabled = false; }
  }
  $('[data-refresh]').onclick = refresh;
  form.onsubmit = async event => {
    event.preventDefault(); if (!form.reportValidity()) return;
    const submit = form.querySelector('button[type="submit"]'); submit.disabled = true;
    saveMessage.textContent = 'Cadastrando…';
    try {
      const saved = await store.create({nomeCaso: form.elements.nomeCaso.value, tipoCrime: type.value, subtipoCrime: subtype.value});
      if (destroyed) return;
      select.value = saved.id; select.dispatchEvent(new select.ownerDocument.defaultView.Event('change'));
      saveMessage.textContent = saved.listaAtualizada ? 'Caso cadastrado. A lista de fenômenos criminais foi atualizada.'
        : 'Caso cadastrado. A atualização dos demais casos falhou; use Atualizar lista.';
      form.reset(); populateSubtypes();
    } catch (error) { if (!destroyed) saveMessage.textContent = error.message; }
    finally { if (!destroyed) submit.disabled = false; }
  };
  return {refresh, setMode, destroy() { destroyed = true; requestVersion++; unbind(); unsubscribe(); root.replaceChildren(); }};
}

class DemandsStore {
  constructor(call, uuid = () => crypto.randomUUID()) {
    this.call = call; this.uuid = uuid; this.epoch = 0; this.pending = null; this.saving = false; this.uploads = new WeakMap();
  }
  reset() { this.epoch++; this.pending = null; this.uploads = new WeakMap(); }
  async request(name, data = {}) {
    const epoch = this.epoch, response = await this.call(name, data);
    if (epoch !== this.epoch) throw new Error('A sessão mudou. Entre novamente para continuar.');
    return response;
  }
  bootstrap() { return this.request('obterBootstrapDemandasAtivas'); }
  get(demandaId) { return this.request('obterDemandaAtiva', {demandaId}); }
  search(filtros, cursor = null) { return this.request('pesquisarDemandasAtivas', {filtros, cursor}); }
  async save(dados, current = null) {
    if (this.saving) throw new Error('Aguarde o salvamento em andamento.');
    const payload = {dados, ...(current ? {demandaId: current.id, versao: current.versao} : {})};
    const signature = JSON.stringify(payload);
    if (this.pending?.signature !== signature) this.pending = {signature, solicitacaoId: this.uuid()};
    this.saving = true;
    try {
      const result = await this.request('salvarDemandaAtiva', {...payload, solicitacaoId: this.pending.solicitacaoId});
      this.pending = null; return result;
    } finally { this.saving = false; }
  }
  async upload(file, readBase64) {
    if (!file || file.size > 10 * 1024 * 1024 || !/\.pdf$/i.test(file.name)) throw new Error('Escolha um PDF de até 10 MB.');
    const epoch = this.epoch;
    if (!this.uploads.has(file)) this.uploads.set(file, {solicitacaoId: this.uuid()});
    const entry = this.uploads.get(file);
    if (entry.saved) return entry.saved;
    const base64 = await readBase64(file);
    if (epoch !== this.epoch) throw new Error('Sessão encerrada.');
    const saved = await this.request('enviarPdfDemanda', {nome: file.name, base64, solicitacaoId: entry.solicitacaoId});
    entry.saved = saved; return saved;
  }
  download(referencia) { return this.request('baixarPdfDemanda', {anexoId: referencia.slice(6)}); }
}


async function mountDemands(root, store, casesStore, {onSaved = async () => {}} = {}) {
  const doc = root.ownerDocument, win = doc.defaultView;
  root.innerHTML = `<header class="section-heading"><div><p class="eyebrow">DEMANDAS ATIVAS</p><h1>Registro de Demandas</h1>
    <p>Cadastre ocorrências, selecione o fenômeno criminal e acompanhe os resultados.</p></div><button type="button" data-new-demand hidden>Nova demanda</button></header>
    <p data-message role="status" aria-live="polite">Carregando…</p>
    <section class="panel" data-search-panel hidden><h2>Buscar Ocorrência</h2><form data-search-form><div class="fields search-fields" data-filters></div>
      <div class="actions"><button type="submit">Buscar</button><button type="button" class="secondary" data-clear-search>Limpar busca</button></div></form></section>
    <section class="panel" data-editor hidden><h2 data-editor-title>Nova demanda</h2><form data-demand-form>
      <div class="fields demand-fields" data-fields></div><h2 class="subheading">Contadores e detalhes</h2><div class="fields" data-counters></div>
      <div data-details></div><div class="actions"><button type="submit" data-save>Salvar demanda</button><button type="button" class="secondary" data-cancel-edit>Fechar</button></div>
      <p data-save-message role="status" aria-live="polite"></p></form></section>
    <section class="panel" data-results hidden><h2>Demandas encontradas</h2><p data-search-message role="status" aria-live="polite"></p>
      <div class="table-scroll"><table><thead><tr><th>Data</th><th>Ocorrência</th><th>Unidade</th><th>Fenômeno Criminal</th><th>Evolução</th><th>Procedimento instaurado</th><th>Ações</th></tr></thead><tbody></tbody></table></div>
      <button type="button" class="secondary" data-more hidden>Carregar mais</button></section>`;
  const $ = s => root.querySelector(s), form = $('[data-demand-form]'), searchForm = $('[data-search-form]');
  let destroyed = false, current = null, editing = false, busy = false, loadVersion = 0, searchVersion = 0;
  let next = null, lastFilters = {}, searchBusy = false;
  const controls = new Map(), searchControls = new Map(), counterControls = new Map(), groups = new Map(), disposers = [];
  const view = {destroy() { if (destroyed) return; destroyed = true; loadVersion++; searchVersion++; disposers.forEach(fn => fn()); root.replaceChildren(); }};
  // destroy pode ser chamado antes do bootstrap terminar (logout/troca de usuário).
  root._destroyDemands = view.destroy;
  let setup;
  try { setup = await store.bootstrap(); }
  catch (error) { if (!destroyed) $('[data-message]').textContent = error.message; return view; }
  if (destroyed) return view;
  const {menus, campos, contadores, podeEditar} = setup;
