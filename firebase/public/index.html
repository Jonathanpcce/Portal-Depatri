<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Portal DEPATRI | Casos e Demandas Ativas</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="topbar"><div class="brand"><span class="brand-mark" aria-hidden="true">D</span>
    <div>PORTAL DEPATRI<small>Departamento de Combate aos Crimes Contra o Patrimônio</small></div></div>
    <button id="signout" class="secondary" type="button" hidden>Sair</button></header>
  <main>
    <p id="status" role="status" aria-live="polite">Carregando…</p>
    <section id="login" class="panel login-panel" hidden><p class="eyebrow">ACESSO AO PORTAL</p>
      <h1>Entre na sua conta</h1><p>Use o e-mail cadastrado para acessar o portal.</p>
      <form id="login-form"><label>E-mail<input name="email" type="email" required autocomplete="username"></label>
        <label>Senha<input name="password" type="password" required autocomplete="current-password" minlength="6"></label>
        <button type="submit">Entrar</button><p id="login-message" role="status" aria-live="polite"></p>
      </form></section>
    <div id="portal" hidden>
      <nav class="module-nav" aria-label="Módulos do portal">
        <button type="button" data-module="cases" aria-pressed="true">Casos prioritários</button>
        <button type="button" data-module="demands" aria-pressed="false" class="secondary">Demandas Ativas</button>
      </nav>
      <div id="cases"></div><div id="demands" hidden></div>
    </div>
  </main>
  <footer>DEPATRI · Casos prioritários e Demandas Ativas</footer>
  <script type="module" src="./boot.js"></script>
</body>
</html>
